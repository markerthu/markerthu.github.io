name: Update visitor map
# GoatCounter refresh -> _data/visitors.json (drives /visitors and the sidebar visitor map).
# The API token lives ONLY in the encrypted Actions secret GOATCOUNTER_TOKEN, never in the repo.

on:
  schedule:
    # Asked for hourly, at an off-peak minute. GitHub delays and silently drops many
    # scheduled runs: the old three-hourly schedule (8 a day) actually ran 2-3 times a
    # day, 5-10 hours apart. GoatCounter rate-limits the export behind the per-visit
    # list to about one an hour; when two runs land close together the script keeps
    # the previous visit list and still refreshes everything else.
    - cron: '47 * * * *'
  workflow_dispatch: {}    # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-visitors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch & update visitor locations
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/update_visitors.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain _data/visitors.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/visitors.json
            git commit -m "chore: visitor map update [skip ci]"
            git pull --rebase
            git push
          else
            echo "No visitor changes today."
          fi
