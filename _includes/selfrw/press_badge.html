<style>
.att{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:16px;padding:8px 16px 8px 13px;border:1px solid var(--rule);border-radius:999px;
  background:var(--card);font-size:var(--t-fine);line-height:1.3;color:var(--muted);text-decoration:none!important;transition:border-color .2s,transform .2s}
.att:hover{border-color:var(--mint-e);transform:translateY(-1px)}
.att b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.att-dot{flex:none;position:relative;width:8px;height:8px;border-radius:50%;background:#3E9A84}
.att-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #3E9A84;opacity:0;animation:att-ping 2.4s ease-out infinite}
@keyframes att-ping{0%{opacity:.7;transform:scale(.5)}80%,100%{opacity:0;transform:scale(1.6)}}
.att-sep{width:1px;height:12px;background:var(--hair)}
@media(prefers-reduced-motion:reduce){.att-dot::after{animation:none}}
@media(max-width:700px){.hero .att{justify-content:flex-start;border-radius:14px}.att-sep{display:none}}
</style>
<div class="att-row"><a class="att" href="#news" aria-label="In the news: 670K+ views, 7.5 million combined followers, 36 countries and regions"><i class="att-dot" aria-hidden="true"></i><span><b data-to="670067" data-fmt="k">670K+</b> views</span><span class="att-sep" aria-hidden="true"></span><span><b data-to="7478354" data-fmt="m">7.5M</b> followers reached</span><span class="att-sep" aria-hidden="true"></span><span><b data-to="36">36</b> countries and regions</span><span class="att-sep" aria-hidden="true"></span><span><b data-to="13">13</b> languages</span></a></div>
<script>
(function(){
  var a=document.querySelector('.att'); if(!a) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var bs=[].slice.call(a.querySelectorAll('b[data-to]'));
  function fmt(v,f){if(f==='k')return Math.floor(v/1000)+'K+';if(f==='m')return (v/1e6).toFixed(1)+'M';return Math.round(v)+'';}
  var t0=null, T=1600;
  function tick(t){if(t0===null)t0=t;var u=Math.min(1,(t-t0)/T),e=1-Math.pow(1-u,3);
    bs.forEach(function(b){b.textContent=fmt(+b.getAttribute('data-to')*e,b.getAttribute('data-fmt'));});
    if(u<1)requestAnimationFrame(tick);}
  bs.forEach(function(b){b.textContent=fmt(0,b.getAttribute('data-fmt'));});
  setTimeout(function(){requestAnimationFrame(tick);},350);
})();
</script>
