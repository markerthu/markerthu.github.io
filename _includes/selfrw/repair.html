<style>
.rd-fallback{font-size:var(--t-body);line-height:1.5;color:var(--body)}
.rd-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
.rd-mx{position:relative}
.rd-mx canvas{display:block;width:100%;height:auto;border-radius:6px;touch-action:pan-y}
.rd-mxcap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-family:var(--sans);font-size:var(--t-fine);line-height:1.4;color:var(--muted);margin-top:10px}
.rd-mxcap span{white-space:nowrap}
.rd-own{color:var(--mint-t);font-weight:600;opacity:0;transition:opacity .6s}
.rd[data-state="repaired"] .rd-own{opacity:1}
.rd-band{position:absolute;left:-14px;width:3px;border-radius:2px;background:var(--peach-e);opacity:0;transition:opacity .4s,background .6s}
.rd[data-state="damaged"] .rd-band,.rd[data-state="scanning"] .rd-band{opacity:.9}
.rd[data-state="repaired"] .rd-band{opacity:.9;background:var(--mint-e)}
.rd-mh{font-family:var(--sans);font-size:var(--t-label);font-weight:600;color:var(--ink);margin:0 0 14px}
.rd-leg{display:block;margin-top:4px;font-weight:400;color:var(--muted);white-space:nowrap}
.rd-leg i{display:inline-block;width:3px;height:12px;background:var(--ice-e);vertical-align:-2px;margin:0 8px 0 1px;border-radius:1px}
.rd-meters{list-style:none;margin:0;padding:0}
.rd-meters li{display:grid;grid-template-columns:7.6em 1fr 2.6em;align-items:center;gap:10px;font-family:var(--sans);font-size:var(--t-label);color:var(--body);padding:5px 0}
.rd-meters li.all{border-top:1px solid var(--rule);margin-top:6px;padding-top:11px;font-weight:600;color:var(--ink)}
.rd-tr{position:relative;height:8px;border-radius:4px;background:var(--band);box-shadow:inset 0 0 0 1px var(--rule)}
.rd-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ice);box-shadow:inset 0 0 0 1px var(--ice-e);transition:width .9s cubic-bezier(.2,.7,.2,1),background .5s,box-shadow .5s}
.rd[data-state="damaged"] .rd-fill,.rd[data-state="scanning"] .rd-fill{background:var(--peach);box-shadow:inset 0 0 0 1px var(--peach-e)}
.rd[data-state="repaired"] .rd-fill{background:var(--mint);box-shadow:inset 0 0 0 1px var(--mint-e)}
.rd-tick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ice-e)}
.rd-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rd-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;margin-top:28px;padding-top:24px;border-top:1px solid var(--rule)}
.rd-say{flex:1 1 300px;display:grid}
.rd-say > *{grid-area:1/1}
.rd-status{font-family:var(--serif);font-size:var(--t-body);line-height:1.48;color:var(--body);margin:0}
.rd-sizer{display:grid;visibility:hidden}
.rd-sizer > span{grid-area:1/1}
.rd-status b{font-weight:500;color:var(--ink)}
.rd-btns{display:flex;flex-wrap:wrap;gap:8px}
.rd-btn{font-family:var(--sans);font-size:var(--t-label);font-weight:600;padding:9px 20px;border-radius:999px;border:1px solid var(--hair);background:var(--card);color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,color .18s,opacity .18s}
.rd-btn:hover:not(:disabled){border-color:var(--mint-e)}
.rd-btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rd-btn:disabled{opacity:.4;cursor:default}
@media(max-width:720px){
  .rd-body{grid-template-columns:1fr;gap:28px}
  .rd-band{left:-9px}
  .rd-meters li{grid-template-columns:8.2em 1fr 2.6em}
}
@media(max-width:720px){
  .rd-btns{width:100%}.rd-btn{flex:1 1 auto;padding:12px 20px}
}
@media(max-width:480px){.rd-btns{flex-direction:column}.rd-btn{width:100%}}
</style>
<script>
(function(){
  var host = document.getElementById('repair-demo'); if (!host || !window.HTMLCanvasElement) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var ROWS = 48, COLS = 96, B0 = 20, B1 = 28, BOUND = 15;
  var BENCH = [['MathVista',86,3,67],['MathVerse',76,0,55],['MMStar',73,4,60],['HallusionBench',89,14,69],['POPE',89,23,81],['ScreenSpot-v2',93,0,89]];
  var ALL = ['All six',84.3,7.3,70.2];

  var SAY = {
    clean: 'One matrix of the model, as released.',
    damaged: 'We overwrite one block of 8 rows in this one matrix with noise. <b>It is enough: the copy fails almost everything.</b>',
    scanning: 'Told only that some values are corrupted, the model measures its matrices one by one, and finds this one.',
    repaired: '<b>It writes values of its own, by a rule it found on text problems alone.</b>'
  };
  var rd = document.createElement('div'); rd.className = 'rd'; rd.setAttribute('data-state', 'clean');
  rd.setAttribute('role', 'group'); rd.setAttribute('aria-label', 'Interactive illustration: damage a copy of the model, then let the model repair it');
  var rows = BENCH.concat([ALL]).map(function(b, i){
    return '<li' + (i === BENCH.length ? ' class="all"' : '') + '><span>' + b[0] + '</span><span class="rd-tr"><span class="rd-fill"></span><span class="rd-tick" style="left:' + b[1] + '%"></span></span><span class="rd-v">' + fmt(b[1], i === BENCH.length) + '</span></li>';
  }).join('');
  rd.innerHTML =
    '<div class="rd-body">' +
      '<div class="rd-mx"><span class="rd-band" aria-hidden="true"></span><canvas aria-label="Schematic heatmap of one MLP output matrix, 48 by 96 weights"></canvas>' +
        '<div class="rd-mxcap"><span>Schematic of the MLP output matrix, layer 30 of 64</span><span class="rd-own">8 rows of values it wrote itself</span></div></div>' +
      '<div><p class="rd-mh">Accuracy (%) on six image benchmarks, first 100 problems each<span class="rd-leg"><i></i>undamaged model</span></p><ul class="rd-meters">' + rows + '</ul></div>' +
    '</div>' +
    '<div class="rd-foot"><div class="rd-say"><p class="rd-status" aria-live="polite"></p><p class="rd-status rd-sizer" aria-hidden="true">' +
        Object.keys(SAY).map(function(k){ return '<span>' + SAY[k] + '</span>'; }).join('') + '</p></div><div class="rd-btns">' +
      '<button type="button" class="rd-btn go" data-act="damage">Damage it</button>' +
      '<button type="button" class="rd-btn" data-act="repair" disabled>Let the model repair it</button></div></div>';
  host.innerHTML = ''; host.appendChild(rd);
  var cv = rd.querySelector('canvas'), ctx = cv.getContext('2d'), status = rd.querySelector('.rd-status');
  var band = rd.querySelector('.rd-band');
  var fills = rd.querySelectorAll('.rd-fill'), vals = rd.querySelectorAll('.rd-v');
  var bDamage = rd.querySelector('[data-act="damage"]'), bRepair = rd.querySelector('[data-act="repair"]');
  function fmt(v, dec){ return dec ? v.toFixed(1) : String(Math.round(v)); }

  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function gauss(){ var u = rnd() || 1e-9, v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  var W0 = new Float32Array(ROWS * COLS), W = new Float32Array(ROWS * COLS), flick = new Float32Array(ROWS * COLS);
  for (var i = 0; i < W0.length; i++) {
    var r = Math.floor(i / COLS), c = i % COLS;
    var s = 1 + .35 * Math.sin(r * .31) * Math.cos(c * .13) + .25 * Math.sin(c * .05 + r * .02);
    W0[i] = gauss() / .674 * s;
  }
  W.set(W0);
  function damage(){ for (var r = B0; r < B1; r++) for (var c = 0; c < COLS; c++) W[r * COLS + c] = gauss() * 214; }

  var P = {};
  function hex(v){ v = v.trim(); if (v[0] === '#') { if (v.length === 4) v = '#' + v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; return [parseInt(v.slice(1,3),16), parseInt(v.slice(3,5),16), parseInt(v.slice(5,7),16)]; } return [128,128,128]; }
  function tokens(){
    var cs = getComputedStyle(document.body);
    ['--ice-l','--ice','--ice-e','--peach','--rose-e','--mint','--mint-e','--lav-e','--lav'].forEach(function(k){ P[k] = hex(cs.getPropertyValue(k)); });
    P.mid = mix(P['--mint'], P['--mint-e'], .5);
    P.dark = document.body.classList.contains('dark-mode');
  }
  function mix(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(a, al){ return 'rgba(' + (a[0]|0) + ',' + (a[1]|0) + ',' + (a[2]|0) + ',' + (al == null ? 1 : al) + ')'; }

  var dpr = 1, cell = 5, gap = 1;
  function size(){
    var w = cv.parentNode.clientWidth || 480;
    cell = w / COLS; dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(cell * ROWS * dpr);
    cv.style.height = (cell * ROWS) + 'px';
    band.style.top = (B0 * cell) + 'px'; band.style.height = ((B1 - B0) * cell) + 'px';
    draw();
  }
  var scanX = -1, state = 'clean', repairedAt = new Float32Array(COLS);
  function draw(){
    var g = gap * dpr * (cell > 4 ? 1 : .6), s = cell * dpr;
    ctx.clearRect(0, 0, cv.width, cv.height);
    var lo = P['--ice-l'], mid = P['--ice'], hi = P['--ice-e'];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var i = r * COLS + c, w = W[i], a = Math.abs(w), col;
      var inBand = r >= B0 && r < B1;
      var behind = inBand && (state === 'repaired' || (state === 'scanning' && c * s < scanX));
      if (inBand && state !== 'clean' && !behind && a > BOUND) {
        col = mix(P['--peach'], P['--rose-e'], .08 + .5 * flick[i]);
      } else if (behind) {
        var age = state === 'repaired' ? 1 : Math.min(1, (scanX - c * s) / (s * 10));
        col = mix(P['--peach'], w > 0 ? P.mid : P['--mint'], .35 + .65 * age);
      } else {
        var t = Math.min(1, a / 4.2); t = Math.pow(t, .85);
        col = t < .5 ? mix(lo, mid, t * 2) : mix(mid, hi, (t - .5) * 2 * .75);
      }
      ctx.fillStyle = rgb(col);
      ctx.fillRect(c * s + g / 2, r * s + g / 2, s - g, s - g);
    }
    if (state === 'scanning' && scanX >= 0) {
      var L = P['--lav-e'], grd = ctx.createLinearGradient(scanX - 60 * dpr, 0, scanX, 0);
      grd.addColorStop(0, rgb(P['--lav'], 0)); grd.addColorStop(1, rgb(P['--lav'], P.dark ? .45 : .65));
      ctx.fillStyle = grd; ctx.fillRect(scanX - 60 * dpr, 0, 60 * dpr, cv.height);
      ctx.fillStyle = rgb(L, .95); ctx.fillRect(scanX - dpr, 0, 2 * dpr, cv.height);
    }
  }

  var cur = BENCH.map(function(b){ return b[1]; }).concat([ALL[1]]), anim = null;
  function meters(col, instant){
    var target = BENCH.map(function(b){ return b[col]; }).concat([ALL[col]]), from = cur.slice(), t0 = performance.now(), D = instant ? 0 : 900;
    fills.forEach(function(f, k){ f.style.transition = instant ? 'none' : ''; f.style.width = target[k] + '%'; });
    if (anim) cancelAnimationFrame(anim);
    (function step(now){
      var u = D ? Math.min(1, (now - t0) / D) : 1, e = 1 - Math.pow(1 - u, 3);
      vals.forEach(function(v, k){ cur[k] = from[k] + (target[k] - from[k]) * e; v.textContent = fmt(cur[k], k === BENCH.length); });
      anim = u < 1 ? requestAnimationFrame(step) : null;
    })(t0 + D);
  }

  var timers = [], flickRaf = 0, lastFlick = 0, visible = false;
  function later(f, ms){ timers.push(setTimeout(f, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function set(st){ state = st; rd.setAttribute('data-state', st); }
  function say(st){ status.innerHTML = SAY[st]; }
  function flickLoop(now){
    flickRaf = 0;
    if (state === 'clean' || state === 'repaired' || !visible) return;
    if (!reduce.matches && now - lastFlick > 110) {
      lastFlick = now;
      for (var r = B0; r < B1; r++) for (var c = 0; c < COLS; c++) if (Math.random() < .35) flick[r * COLS + c] = Math.random();
      if (state === 'damaged') draw();
    }
    flickRaf = requestAnimationFrame(flickLoop);
  }
  function doDamage(instant){
    clearTimers(); W.set(W0); damage();
    for (var i = 0; i < flick.length; i++) flick[i] = Math.random();
    set('damaged'); say('damaged'); draw(); meters(2, instant);
    bDamage.disabled = true; bRepair.disabled = false; bRepair.classList.add('go'); bDamage.classList.remove('go');
    if (!flickRaf) flickRaf = requestAnimationFrame(flickLoop);
  }
  function finishRepair(instant){
    for (var r = B0; r < B1; r++) for (var c = 0; c < COLS; c++) { var i = r * COLS + c; if (Math.abs(W[i]) > BOUND) W[i] = W[i] > 0 ? BOUND : -BOUND; }
    set('repaired'); say('repaired'); draw(); meters(3, instant);
    bDamage.disabled = false; bRepair.disabled = true; bDamage.classList.add('go'); bRepair.classList.remove('go');
    bDamage.textContent = 'Damage it again';
    if (keyFocus) { keyFocus = false; var ae = document.activeElement; if (!ae || ae === document.body || ae === bRepair) bDamage.focus({ preventScroll:true }); }
  }
  var keyFocus = false;
  function doRepair(instant){
    keyFocus = document.activeElement === bRepair;
    clearTimers(); bRepair.disabled = true; bDamage.disabled = true;
    if (instant || reduce.matches) { finishRepair(true); return; }
    set('scanning'); say('scanning');
    var t0 = performance.now(), D = 1900;
    (function sweep(now){
      var u = Math.min(1, (now - t0) / D), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      scanX = e * (cv.width + 60 * dpr); draw();
      if (u < 1 && state === 'scanning') requestAnimationFrame(sweep); else if (state === 'scanning') { scanX = -1; finishRepair(false); }
    })(t0);
  }
  bDamage.addEventListener('click', function(){ doDamage(reduce.matches); bRepair.focus({ preventScroll:true }); });
  bRepair.addEventListener('click', function(){ doRepair(false); });

  function holdWidth(){ bDamage.style.minWidth = ''; var t = bDamage.textContent; bDamage.textContent = 'Damage it again'; var mw = bDamage.getBoundingClientRect().width; bDamage.textContent = t; bDamage.style.minWidth = Math.ceil(mw) + 'px'; }
  holdWidth(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(holdWidth);
  tokens(); size(); say('clean');
  meters(1, true);
  window.addEventListener('resize', function(){ size(); });
  new MutationObserver(function(){ tokens(); draw(); }).observe(document.body, { attributes:true, attributeFilter:['class'] });

  if (reduce.matches) {
    W.set(W0); damage(); state = 'damaged'; meters(2, true); finishRepair(true);
  }
  var played = false;
  new IntersectionObserver(function(es){
    visible = es[0].isIntersecting;
    if (visible && !flickRaf && (state === 'damaged' || state === 'scanning')) flickRaf = requestAnimationFrame(flickLoop);
    if (visible && !played && !reduce.matches) {
      played = true;
      later(function(){ doDamage(false); later(function(){ doRepair(false); }, 2600); }, 700);
    }
  }, { threshold:.45 }).observe(rd);

})();
</script>
