<script>
(function(){
  var cv=document.getElementById('srw-stage'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), W=0, H=0, dpr=1, G=null, C=null;
  var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
  var steps=[].slice.call(document.querySelectorAll('.stage-steps li'));
  var N=64, T=15.5, SPEED=1.18, FINAL=13.4, cycle=0, fixed=null, visible=true, raf=0, t0=0, lastStep=-1;

  function hex(s){s=s.trim().replace('#','');if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
  function mix(a,b,t){t=t<0?0:t>1?1:t;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
  function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';}
  function colors(){
    var cs=getComputedStyle(document.body), v=function(n){return hex(cs.getPropertyValue(n));};
    C={bg:v('--bg'),card:v('--card'),ink:v('--ink'),muted:v('--muted'),faint:v('--faint'),hair:v('--hair'),rule:v('--rule'),
       mint:v('--mint'),mintE:v('--mint-e'),mintT:v('--mint-t'),mintL:v('--mint-l'),
       peach:v('--peach'),peachE:v('--peach-e'),ice:v('--ice'),iceE:v('--ice-e'),iceT:v('--ice-t'),
       lav:v('--lav'),lavE:v('--lav-e'),
       dark:document.body.classList.contains('dark-mode'),
       serif:cs.getPropertyValue('--serif'),sans:cs.getPropertyValue('--sans')};
  }
  function clamp(x){return x<0?0:x>1?1:x;}
  function ease(x){x=clamp(x);return x*x*(3-2*x);}
  function seg(t,a,b){return clamp((t-a)/(b-a));}
  function gauss(d,s){return Math.exp(-d*d/(2*s*s));}

  var rnd=(function(){var s=20261116;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};})();
  var idx=[],i;for(i=0;i<100;i++)idx.push(i);
  for(i=99;i>0;i--){var j=Math.floor(rnd()*(i+1)),tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}
  var right0={},gain={},loss={},order=[];
  for(i=0;i<57;i++)right0[idx[i]]=1;
  for(i=57;i<68;i++){gain[idx[i]]=1;order.push(idx[i]);}
  for(i=0;i<4;i++){loss[idx[i]]=1;order.push(idx[i]);}
  order.sort(function(a,b){return (a*37%100)-(b*37%100);});
  var flipRank={};order.forEach(function(d,k){flipRank[d]=k;});

  function layout(){
    var r=cv.getBoundingClientRect();W=Math.max(280,r.width);H=Math.max(240,r.height);
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    var wide=W>=620;
    G={wide:wide};
    if(wide){
      G.x0=62;G.x1=W-62;G.h=Math.max(60,Math.min(176,H-250));G.yc=108+G.h/2;G.s=22;G.k=10;G.lift=15;G.inset=8;
      G.cell=11.5;G.cols=20;G.rsize=46;
      var gw=G.cell*G.cols, tw=246;
      G.gx=(W-gw-30-tw)/2;G.gy=H-72;G.rx=G.gx+gw+30;G.ry=G.gy+38;
    }else{
      G.x0=W*0.075;G.x1=W*0.925;G.h=136;G.yc=158;G.s=12;G.k=6;G.lift=10;G.inset=5;
      G.cell=9.4;G.cols=10;G.gy=H-112;G.rsize=42;
      var nw=G.cell*G.cols, nt=Math.min(172,W*0.46);
      G.gx=Math.max(W*0.03,(W-nw-24-nt)/2);G.rx=G.gx+nw+24;G.ry=G.gy+46;
    }
    G.dx=(G.x1-G.x0)/(N-1);G.y0=G.yc-G.h/2;G.y1=G.yc+G.h/2;
  }
  function lx(i){return G.x0+G.dx*i;}

  function draw(t){
    if(!G||!C) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    var wide=G.wide, first=(cycle===0), q;
    var reset=first?0:1-seg(t,0,0.9);
    var w1=-6+(N+12)*seg(t,0.3,2.7);
    var scanOn=seg(t,3.2,3.9)*(1-seg(t,6.3,6.7));
    var scan=60-60*ease(seg(t,4.1,6.4));
    var pen=-3+(N+5)*seg(t,6.8,9.6);
    var penOn=seg(t,6.6,6.9)*(1-seg(t,9.6,10.1));
    var w4=-6+(N+12)*seg(t,10.2,12.4);
    var arcA=seg(t,3.0,4.1), arcFade=1-seg(t,9.7,10.4);
    var li=t<6.6?scan:Math.max(0,Math.min(N-1,pen));
    if(t>=6.6&&t<6.8) li=0;
    var closing=t>=12.3||(!first&&t<0.9);
    if(closing){arcA=t>=12.3?ease(seg(t,12.3,13.3)):1;arcFade=t>=12.3?1:1-seg(t,0,0.8);li=0;}
    var step=t<3?0:t<6.6?1:t<10.1?2:3;
    if(step!==lastStep){lastStep=step;steps.forEach(function(el,k){el.classList.toggle('on',k===step);});}
    var motion=(fixed==null&&!mq.matches)?1:0;

    var gcx=(G.x0+G.x1)/2, gcy=G.y1+24, gw=(G.x1-G.x0)*0.58, glowC=C.dark?mix(C.iceE,C.mintE,t>=9.6?1:reset):C.ink;
    var gr=ctx.createRadialGradient(gcx,gcy,4,gcx,gcy,gw);
    gr.addColorStop(0,rgba(glowC,C.dark?0.2:0.085));gr.addColorStop(1,rgba(glowC,0));
    ctx.save();ctx.translate(0,gcy);ctx.scale(1,0.09);ctx.translate(0,-gcy);ctx.fillStyle=gr;ctx.fillRect(gcx-gw-20,gcy-gw,gw*2+40,gw*2);ctx.restore();

    var tops=[];
    for(var i=0;i<N;i++){
      var x=lx(i), full=(i%4===3);
      var m=full?0:Math.max(reset,clamp((pen-i)/2.2)*(t>=6.6?1:0));
      if(t>=9.6) m=full?0:1;
      var g1=gauss(i-w1,2.6)*(t<3.2?1:0), g4=gauss(i-w4,2.6)*(t>10?1:0);
      var gs=gauss(i-scan,3.0)*scanOn, gp=gauss(i-pen,2.2)*penOn;
      var lift=G.lift*Math.max(g1*0.8,g4*0.8,gs,gp*1.15)+motion*1.3*Math.sin(t*1.25-i*0.33);
      var fill=full?mix(C.card,C.ice,C.dark?0.45:0.3):C.ice, edge=C.iceE;
      fill=mix(fill,C.mint,m);edge=mix(edge,C.mintE,m);
      fill=mix(fill,C.lav,gs*0.95);edge=mix(edge,C.lavE,gs);
      fill=mix(fill,C.dark?C.iceT:C.card,Math.max(g1,g4)*0.5);
      fill=mix(fill,C.dark?C.mintE:C.mintL,gp*0.6);
      var a=(C.dark?0.6:0.6)+0.3*Math.max(gs,gp,g1*0.6,g4*0.6);
      var ins=full?G.inset:0, yA=G.y0-lift+ins, yB=G.y1-lift-ins;
      ctx.beginPath();ctx.moveTo(x-G.s,yA+G.k);ctx.lineTo(x+G.s,yA-G.k);ctx.lineTo(x+G.s,yB-G.k);ctx.lineTo(x-G.s,yB+G.k);ctx.closePath();
      ctx.fillStyle=rgba(fill,a);ctx.fill();
      ctx.lineWidth=1;ctx.strokeStyle=rgba(edge,C.dark?0.8:0.74);ctx.stroke();
      if(!full){
        var nd=wide?9:7, ox=-G.s+G.dx*0.5, oy=-G.k*ox/G.s, dc=mix(mix(C.iceE,C.mintT,m),C.lavE,gs), hot=Math.max(gs,gp,g1*0.7,g4*0.7);
        for(var d=0;d<nd;d++){
          var yy=yA+(yB-yA)*(d+0.5)/nd+oy, wob=((i*7+d*13)%6)/6;
          ctx.fillStyle=rgba(hot>0.3?mix(dc,C.card,hot*0.5):dc,Math.min(1,0.22+0.5*wob+0.6*hot));
          var sz=wide?2.6:2;ctx.fillRect(x+ox-sz/2,yy-sz/2,sz,sz);
        }
      }
      tops.push(yA);
    }
    ctx.textBaseline='alphabetic';ctx.textAlign='center';
    ctx.fillStyle=rgba(C.ink,0.92);ctx.font='600 '+(wide?13:12)+'px '+C.sans;
    ctx.fillText('its own weights',gcx,G.y1+(wide?36:30));
    ctx.font='500 '+(wide?12:11)+'px '+C.sans;ctx.fillStyle=rgba(C.muted,0.95);
    ctx.fillText('64 layers, 27 billion parameters',gcx,G.y1+(wide?54:46));

    [w1,w4].forEach(function(w,k){
      var on=k===0?(t>0.3&&t<2.9):(t>10.2&&t<12.6); if(!on) return;
      for(var p=0;p<9;p++){
        var l2=w-1.5-p*1.7; if(l2<0||l2>N-1) continue;
        var py=G.y0+G.h*(0.14+0.72*((p*37%9)/8))-G.lift*0.4;
        ctx.beginPath();ctx.arc(lx(l2),py,2.4-p*0.12,0,6.2832);
        ctx.fillStyle=rgba(k===0?C.iceE:C.mintE,0.85-p*0.07);ctx.fill();
      }
    });

    var a2=arcA*arcFade;
    if(a2>0.01){
      var S={x:G.x1+G.s+(wide?14:2),y:G.y0-G.k-(wide?4:12)}, liC=Math.max(0,Math.min(N-1,li));
      var i0=Math.floor(liC), i1=Math.min(N-1,i0+1), fr=liC-i0;
      var E={x:lx(liC),y:tops[i0]*(1-fr)+tops[i1]*fr-9};
      var topY=wide?14:24, c1={x:S.x+(wide?12:4),y:topY-22}, c2={x:E.x,y:topY-18};
      var rewriting=t>=6.6||closing, acol=rewriting?C.mintE:C.lavE, pts=[], n=64;
      for(q=0;q<=n;q++){var u=q/n,o=1-u;
        pts.push([o*o*o*S.x+3*o*o*u*c1.x+3*o*u*u*c2.x+u*u*u*E.x, o*o*o*S.y+3*o*o*u*c1.y+3*o*u*u*c2.y+u*u*u*E.y]);}
      var upto=Math.max(1,Math.round(n*arcA));
      ctx.save();ctx.globalAlpha=arcFade;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(q=1;q<=upto;q++)ctx.lineTo(pts[q][0],pts[q][1]);
      if(C.dark)ctx.globalCompositeOperation='lighter';
      ctx.lineWidth=18;ctx.strokeStyle=rgba(acol,C.dark?0.06:0.05);ctx.stroke();
      ctx.lineWidth=9;ctx.strokeStyle=rgba(acol,C.dark?0.11:0.09);ctx.stroke();
      ctx.lineWidth=4;ctx.strokeStyle=rgba(acol,C.dark?0.3:0.22);ctx.stroke();
      ctx.globalCompositeOperation='source-over';
      ctx.lineWidth=1.5;ctx.strokeStyle=rgba(C.dark?mix(acol,C.ink,0.35):acol,0.95);ctx.stroke();
      for(q=0;q<5;q++){
        var uu=(t*0.36+q/5)%1, fi=uu*upto, f0=Math.min(upto-1,Math.floor(fi)), ff=fi-f0;
        var qx=pts[f0][0]+(pts[f0+1][0]-pts[f0][0])*ff, qy=pts[f0][1]+(pts[f0+1][1]-pts[f0][1])*ff, qa=Math.sin(Math.PI*uu);
        var hg=ctx.createRadialGradient(qx,qy,0,qx,qy,11);hg.addColorStop(0,rgba(acol,0.5*qa));hg.addColorStop(1,rgba(acol,0));
        if(C.dark)ctx.globalCompositeOperation='lighter';
        ctx.fillStyle=hg;ctx.beginPath();ctx.arc(qx,qy,11,0,6.2832);ctx.fill();
        ctx.globalCompositeOperation='source-over';
        ctx.beginPath();ctx.arc(qx,qy,2.3,0,6.2832);ctx.fillStyle=rgba(C.dark?mix(acol,C.ink,0.6):C.card,qa);ctx.fill();
        ctx.lineWidth=1;ctx.strokeStyle=rgba(acol,qa);ctx.stroke();
      }
      var hd=pts[upto];
      if(rewriting&&penOn>0.2){
        for(q=0;q<9;q++){var age=(t*1.5+q/9)%1, ang=q*2.399, rad=5+age*20;
          ctx.beginPath();ctx.arc(hd[0]+Math.cos(ang)*rad*0.8,hd[1]-age*26+Math.sin(ang)*5,2.1*(1-age),0,6.2832);
          ctx.fillStyle=rgba(C.mintE,(1-age)*0.9*penOn);ctx.fill();}
      }
      var hr=22+3*Math.sin(t*5), hg2=ctx.createRadialGradient(hd[0],hd[1],0,hd[0],hd[1],hr);
      hg2.addColorStop(0,rgba(acol,C.dark?0.55:0.42));hg2.addColorStop(1,rgba(acol,0));
      if(C.dark)ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=hg2;ctx.beginPath();ctx.arc(hd[0],hd[1],hr,0,6.2832);ctx.fill();ctx.globalCompositeOperation='source-over';
      ctx.beginPath();ctx.arc(hd[0],hd[1],4.8,0,6.2832);ctx.fillStyle=rgba(acol,1);ctx.fill();
      ctx.beginPath();ctx.arc(hd[0],hd[1],1.9,0,6.2832);ctx.fillStyle=rgba(C.card,1);ctx.fill();
      ctx.beginPath();ctx.arc(S.x,S.y,3,0,6.2832);ctx.fillStyle=rgba(acol,1);ctx.fill();
      if(wide){
        var lxm=(S.x+E.x)/2, lym=topY+(S.y-topY)*0.56;
        ctx.globalAlpha=closing?arcFade*seg(arcA,0.75,1):arcFade*seg(t,3.6,4.3)*seg(S.x-E.x,250,330);ctx.textAlign='center';
        ctx.font='600 16px '+C.sans;ctx.fillStyle=rgba(C.ink,1);
        ctx.fillText(closing?'it rewrote itself':rewriting?'it rewrites itself':'it reads itself',lxm,lym);
        ctx.font='500 12px '+C.sans;ctx.fillStyle=rgba(C.muted,1);
        ctx.fillText(rewriting?'no gradients, no training':'its answers, its hidden states',lxm,lym+19);
      }
      ctx.restore();
    }

    var shown1=seg(t,1.3,3.0);
    for(var dI=0;dI<100;dI++){
      var r=Math.floor(dI/G.cols), c=dI%G.cols, px=G.gx+c*G.cell+G.cell/2, py2=G.gy+r*G.cell+G.cell/2;
      var app=first?clamp(shown1*100-dI+1):1;
      var ok=!!right0[dI], fl=flipRank[dI], fp=fl==null?0:seg(t,10.8+fl*0.11,11.15+fl*0.11);
      if(!first&&t<0.9&&fl!=null) fp=1-seg(t,0,0.8);
      var okNow=fp>0.5?(gain[dI]?true:loss[dI]?false:ok):ok;
      var rr=G.cell*0.34*(0.5+0.5*app)*(1+0.55*Math.sin(Math.PI*fp));
      ctx.beginPath();ctx.arc(px,py2,rr,0,6.2832);
      if(okNow){var isM=gain[dI]&&fp>0.5;
        ctx.fillStyle=rgba(isM?C.mint:C.ice,app);ctx.fill();
        ctx.lineWidth=1.2;ctx.strokeStyle=rgba(isM?C.mintE:C.iceE,app);ctx.stroke();
      }else{
        ctx.fillStyle=rgba(C.peach,app*(C.dark?0.5:0.6));ctx.fill();
        ctx.lineWidth=1.1;ctx.strokeStyle=rgba(C.peachE,app*0.9);ctx.stroke();
      }
    }
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.font='500 '+(wide?12.5:11.5)+'px '+C.sans;ctx.fillStyle=rgba(C.muted,first?seg(t,2.5,3.0):1);
    var ly=G.ry-G.rsize*0.32;
    if(wide){ctx.fillText('its answers on 490 problems',G.rx+1,ly-9);ctx.fillText('it never saw',G.rx+1,ly+9);}
    else{ctx.fillText('its answers on',G.rx,ly-16);ctx.fillText('490 problems',G.rx,ly);ctx.fillText('it never saw',G.rx,ly+16);}
    ctx.textBaseline='alphabetic';
  }

  function frame(now){
    raf=0;if(fixed!=null||mq.matches||!visible||document.hidden) return;
    if(!t0)t0=now;var e=(now-t0)/1000*SPEED;
    if(e>=T){cycle++;t0=now;e=0;}
    draw(e);raf=requestAnimationFrame(frame);
  }
  function still(){draw(fixed!=null?fixed:FINAL);}
  function kick(){
    if(fixed!=null||mq.matches){still();return;}
    if(!raf&&visible&&!document.hidden){t0=0;raf=requestAnimationFrame(frame);}
  }
  function refresh(){colors();layout();if(fixed!=null||mq.matches||!raf)still();}
  colors();layout();
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)kick();},{threshold:0.05}).observe(cv);
  }
  document.addEventListener('visibilitychange',kick);
  window.addEventListener('resize',function(){layout();if(fixed!=null||mq.matches)still();});
  if(mq.addEventListener)mq.addEventListener('change',function(){if(mq.matches)still();else kick();});
  new MutationObserver(function(){colors();if(fixed!=null||mq.matches)still();}).observe(document.body,{attributes:true,attributeFilter:['class']});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refresh);
  kick();
})();
</script>
