<figure class="pdm" id="paradigm">
  <div class="pdm-stage">
    <article class="pdm-act">
      <header><h3>Train it again</h3><p>pre&#8209;training&nbsp;&middot; post&#8209;training</p></header>
      <canvas role="img" aria-label="Animation, first of three acts. Training: data streams into the model on a cluster of GPUs, gradients flow backwards through its layers, optimizer states pile up beside the weights, a training pipeline runs and the added cost climbs. New weights come out and are frozen again."></canvas>
      <p class="pdm-say">It takes infrastructure and GPUs only a few labs have.</p>
      <ul class="pdm-yn">
        <li class="n"><i role="img" aria-label="No:"></i>No training</li>
        <li class="y"><i role="img" aria-label="Yes:"></i>No added cost per answer</li>
        <li class="y"><i role="img" aria-label="Yes:"></i>The weights themselves improve</li>
      </ul>
    </article>
    <article class="pdm-act">
      <header><h3>Spend more at inference</h3><p>prompt&nbsp;engineering&nbsp;&middot; harness&nbsp;engineering&nbsp;&middot; test&#8209;time&nbsp;scaling</p></header>
      <canvas role="img" aria-label="Animation, second act. Inference-time methods: the same frozen weights are wrapped in prompts and a harness, many samples are drawn for one answer, the context grows, and cost is added again on every answer. When the task ends the wrapping is gone and the weights have not changed."></canvas>
      <p class="pdm-say">Paid again on every answer, and gone once the task ends.</p>
      <ul class="pdm-yn">
        <li class="y"><i role="img" aria-label="Yes:"></i>No training</li>
        <li class="n"><i role="img" aria-label="No:"></i>No added cost per answer</li>
        <li class="n"><i role="img" aria-label="No:"></i>The weights themselves improve</li>
      </ul>
    </article>
    <article class="pdm-act ours">
      <header><h3>Let it rewrite itself</h3><p>its&nbsp;own&nbsp;weights&nbsp;&middot; its&nbsp;own&nbsp;reasoning</p></header>
      <canvas role="img" aria-label="Animation, third act. Self-rewriting: on one GPU the model reads its own weights, finds where it fails, rewrites those weights by its own reasoning, tests the edit against its unedited self and keeps it. Afterwards every answer takes one chain, the added cost stays flat, and the improvement stays in its weights. No new pre-training, no post-training, no training infrastructure, no harness engineering, no prompt engineering, no added cost per answer."></canvas>
      <p class="pdm-say"><span>One GPU, a few hours.</span> <span>Every answer costs what it cost before.</span></p>
      <ul class="pdm-yn">
        <li class="y"><i role="img" aria-label="Yes:"></i>No training</li>
        <li class="y"><i role="img" aria-label="Yes:"></i>No added cost per answer</li>
        <li class="y"><i role="img" aria-label="Yes:"></i>The weights themselves improve</li>
      </ul>
    </article>
    <p class="pdm-no"><b>Self&#8209;rewriting needs</b> <span>no new pre&#8209;training<i class="vh">,</i></span> <span>no post&#8209;training<i class="vh">,</i></span> <span>no training infrastructure<i class="vh">,</i></span> <span>no harness engineering<i class="vh">,</i></span> <span>no prompt engineering<i class="vh">,</i></span> <span>no added cost per answer</span></p>
  </div>
  <figcaption class="cap">Three ways to make a model better, played in turn. Schematic: the cost lines are not measured.</figcaption>
</figure>
<script>

  function F(wt,px,fam){return wt+' '+Math.max(px,11/sc).toFixed(2)+'px '+(fam||C.sans);}

  function cap(s,a,lk,col){if(a<=.01)return;c.font=F(500,11.6);var w=c.measureText(s).width,x=MX+(lk?7:0);txt(s,x,202,a,col||C.muted);if(lk)lock(x-w/2-9,198,col||C.muted,a);}

    meter(function(v){return .04+.9*ease(seg(v,.06,.66));},on?(.7*seg(u,.8,4.4)+.3*seg(u,4.4,5.5)):0,C.peachE,1-out);

  var AK=[1.9,2.55,3.2,3.85];
  function s2(u,out){

      rr(bx-12,38,24,14,4);c.fillStyle=rgba(mix(C.card,C.lav,.45+.55*bh),wa*bp);c.fill();c.lineWidth=1;c.strokeStyle=rgba(C.lavE,wa*bp*.9);c.stroke();
      line(bx-6,43,bx+6,43,C.lavE,wa*bp*.55);line(bx-6,47,bx+2,47,C.lavE,wa*bp*.55);}
    txt('a harness',MX,27,la*hp);
    for(i=0;i<3;i++){var pp=on?ease(seg(u,.3+i*.28,.95+i*.28)):0,qx=16+i*7-(1-pp)*18,qy=106+i*10;

      for(j=0;j<3;j++)line(qx+7,qy+9+j*6.5,qx+(j===2?24:37),qy+9+j*6.5,C.lavE,wa*pp*.5,1.2);}
    txt('prompts',47,182,la);
    var ch=on?ease(seg(u,1.3,1.9)):0,O=[236,MY],An=[304,MY],fl=0;

      for(k=0;k<4;k++){var pk=seg(u,AK[k],AK[k]+.5);if(on&&pk>0&&pk<1){var tt=clamp(pk*1.2-(j+2)*.04),o=1-tt;dot(o*o*O[0]+2*o*tt*270+tt*tt*An[0],o*o*O[1]+2*o*tt*cy+tt*tt*An[1],2.2,C.lavE,Math.sin(Math.PI*tt));}}
