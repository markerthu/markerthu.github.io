<!-- Phones: the round floating buttons (dark mode, back to top, the AI agent) slide out of the way while the
     reader scrolls down, and come back on any scroll up, near the top of the page, or while the
     agent panel is open. Desktop is unchanged. Block comments only: the site's HTML compressor joins lines. -->
<style>
@media (max-width:700px){
  .pg-fab,.ra-btn,.ra-tip,.dark-toggle,.scroll-top{transition:transform .3s ease,opacity .3s ease}
  html.fab-away .pg-fab,html.fab-away .ra-btn,html.fab-away .ra-tip,html.fab-away .dark-toggle,html.fab-away .scroll-top{
    transform:translateX(90px)!important;opacity:0!important;pointer-events:none!important}
}
</style>
<script>
(function () {
  if (window.__fabAuto) return; window.__fabAuto = true;
  var root = document.documentElement, last = window.scrollY || 0, ticking = false;
  function upd() {
    ticking = false;
    var y = window.scrollY || 0;
    var panel = document.querySelector('.ra-panel.show');
    if (panel || y < 220 || y < last - 8) root.classList.remove('fab-away');
    else if (y > last + 8) root.classList.add('fab-away');
    if (Math.abs(y - last) > 8) last = y;
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true });
  /* figures and tables that scroll sideways (on phones) get a tab stop and a name, so keyboard users can scroll them */
  function focusable() {
    document.querySelectorAll('figure, .table-wrap, .table-scroll, pre').forEach(function (el) {
      var ox = getComputedStyle(el).overflowX, sc = (ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth + 2;
      if (sc && !el.hasAttribute('tabindex')) {
        el.setAttribute('tabindex', '0'); el.dataset.fabScroll = '1';
        if (!el.getAttribute('role')) el.setAttribute('role', 'region');
        if (!el.getAttribute('aria-label')) { var c = el.querySelector('figcaption, caption'); el.setAttribute('aria-label', (c ? c.textContent : 'Scrollable figure').trim().slice(0, 90)); }
      } else if (!sc && el.dataset.fabScroll) { el.removeAttribute('tabindex'); delete el.dataset.fabScroll; }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', focusable); else focusable();
  window.addEventListener('load', focusable); window.addEventListener('resize', function () { clearTimeout(window.__fabT); window.__fabT = setTimeout(focusable, 300); });
})();
</script>
