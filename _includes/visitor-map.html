{%- comment -%}
Sidebar visitor card: header (live total + date range) + the shared map SVG.
Links through to the full /visitors/ page.
{%- endcomment -%}
{%- assign v = site.data.visitors -%}
<a class="vmap" href="/visitors/" title="See where visitors come from">
  <div class="vmap-hd">
    <div class="vmap-n"><span id="vmap-total">{{ v._total | default: 0 }}</span> Pageviews</div>
    <div class="vmap-r">{{ v._range | default: "" }}</div>
  </div>
  {% include visitor-map-svg.html %}
</a>
