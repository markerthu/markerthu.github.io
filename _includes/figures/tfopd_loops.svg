<svg class="cs-d" viewBox="0 0 640 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tfld-t tfld-d" fill="currentColor">
  <title id="tfld-t">A few looping answers carry many of the tokens</title>
  <desc id="tfld-d">Of the mathematics specialist's rollouts, answers that end in a repetition loop are 7 percent of the answers but 23 percent of the tokens.</desc>
  <style>.tfl-l{font:500 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.tfl-b{font:600 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.tfl-s{font:400 11.5px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.tfl-t{font:400 11px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.tfl-v{font:600 14px Inter,system-ui,sans-serif}</style>
  <text class="tfl-l" x="148.0" y="42.0" text-anchor="end">of the answers</text>
  <rect x="160" y="22" width="450" height="26" rx="5" fill="var(--c-base,#DDE2EA)" stroke="var(--c-base-line,#8F97A8)" stroke-width="1"/>
  <rect x="160" y="22" width="31.5" height="26" rx="5" fill="var(--c-rl,#F5C8B5)" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.2"/>
  <text class="tfl-v" x="199.5" y="40.0" text-anchor="start" fill="var(--c-rl-ink,#B8613C)">7% loop</text>
  <text class="tfl-s" x="602.0" y="40.0" text-anchor="end">ordinary reasoning</text>
  <text class="tfl-l" x="148.0" y="94.0" text-anchor="end">of the tokens</text>
  <rect x="160" y="74" width="450" height="26" rx="5" fill="var(--c-base,#DDE2EA)" stroke="var(--c-base-line,#8F97A8)" stroke-width="1"/>
  <rect x="160" y="74" width="103.5" height="26" rx="5" fill="var(--c-rl,#F5C8B5)" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.2"/>
  <text class="tfl-v" x="271.5" y="92.0" text-anchor="start" fill="var(--c-rl-ink,#B8613C)">23% loop</text>
  <text class="tfl-s" x="602.0" y="92.0" text-anchor="end">ordinary reasoning</text>
</svg>
