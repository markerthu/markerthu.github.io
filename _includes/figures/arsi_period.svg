<svg class="cs-d" viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arpd-t arpd-d" fill="currentColor">
  <title id="arpd-t">How often the student should become the teacher</title>
  <desc id="arpd-d">MMAU test-mini accuracy for synchronization periods T of 50, 100, 200, 500 and 1000 steps: 74.6, 75.6, 76.1, 76.0 and 75.1 percent. Outcome-only training scores 74.6 percent and a frozen external teacher 75.1 percent.</desc>
  <style>.arp-l{font:500 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.arp-b{font:600 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.arp-s{font:400 11.5px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.arp-t{font:400 11px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.arp-v{font:600 14px Inter,system-ui,sans-serif}</style>
  <g stroke="var(--c-grid,#E4E8EF)" stroke-width="1"><path d="M70.0,28 V214"/><path d="M185.7,28 V214"/><path d="M301.4,28 V214"/><path d="M454.3,28 V214"/><path d="M570.0,28 V214"/></g>
  <path d="M60,170.8 H580" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M60,134.8 H580" stroke="var(--c-base-line,#8F97A8)" stroke-width="1.6" stroke-dasharray="2 4"/>
  <text class="arp-s" x="566.0" y="186.8" text-anchor="end" style="fill:var(--c-rl-ink,#B8613C)">outcome-only training &#183; 74.6%</text>
  <text class="arp-s" x="566.0" y="150.8" text-anchor="end">frozen external teacher &#183; 75.1%</text>
  <polyline points="70.0,170.8 185.7,98.8 301.4,62.8 454.3,70.0 570.0,134.8" fill="none" stroke="var(--c-ours,#2F4B8F)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="70.0" cy="170.8" r="5" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.5"/>
  <text class="arp-l" x="70.0" y="157.8" text-anchor="middle">74.6</text>
  <circle cx="185.7" cy="98.8" r="5" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.5"/>
  <text class="arp-l" x="185.7" y="85.8" text-anchor="middle">75.6</text>
  <circle cx="301.4" cy="62.8" r="7" fill="var(--c-ours,#2F4B8F)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.5"/>
  <text class="arp-b" x="301.4" y="49.8" text-anchor="middle" style="fill:var(--c-ours,#2F4B8F)">76.1 (default)</text>
  <circle cx="454.3" cy="70.0" r="5" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.5"/>
  <text class="arp-l" x="454.3" y="57.0" text-anchor="middle">76.0</text>
  <circle cx="570.0" cy="134.8" r="5" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.5"/>
  <text class="arp-l" x="570.0" y="121.8" text-anchor="middle">75.1</text>
  <g class="arp-t" text-anchor="middle"><text x="70.0" y="232">T = 50</text><text x="185.7" y="232">100</text><text x="301.4" y="232">200</text><text x="454.3" y="232">500</text><text x="570.0" y="232">1000</text></g>
  <text class="arp-t" x="320.0" y="252.0" text-anchor="middle">sync period T, steps between handovers (log scale)</text>
</svg>
