<svg class="cs-d" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tfmd-t tfmd-d" fill="currentColor">
  <title id="tfmd-t">Mean accuracy over seven benchmarks</title>
  <desc id="tfmd-d">Mean accuracy over seven mathematics and code benchmarks on Olmo 3 7B: TF-OPD 61.1, math specialist 59.8, code specialist 53.6, base model 31.6 percent.</desc>
  <style>.tfm-l{font:500 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.tfm-b{font:600 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}.tfm-s{font:400 11.5px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.tfm-t{font:400 11px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}.tfm-v{font:600 14px Inter,system-ui,sans-serif}</style>
  <g stroke="var(--c-grid,#E4E8EF)" stroke-width="1"><path d="M230.0,14 V184"/><path d="M281.4,14 V184"/><path d="M332.9,14 V184"/><path d="M384.3,14 V184"/><path d="M435.7,14 V184"/><path d="M487.1,14 V184"/><path d="M538.6,14 V184"/><path d="M590.0,14 V184"/></g>
  <text class="tfm-b" x="218.0" y="31.0" text-anchor="end">TF-OPD (ours)</text>
  <text class="tfm-s" x="218.0" y="46.0" text-anchor="end">no training</text>
  <rect x="230" y="22" width="314.2" height="22" rx="5" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.1"/>
  <text class="tfm-v" x="552.2" y="38.0" text-anchor="start" fill="var(--c-ours,#2F4B8F)">61.1</text>
  <text class="tfm-l" x="218.0" y="71.0" text-anchor="end">Math specialist</text>
  <text class="tfm-s" x="218.0" y="86.0" text-anchor="end">RL on math</text>
  <rect x="230" y="62" width="307.5" height="22" rx="5" fill="var(--c-rl,#F5C8B5)" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.1"/>
  <text class="tfm-v" x="545.5" y="78.0" text-anchor="start" fill="var(--c-rl-ink,#B8613C)">59.8</text>
  <text class="tfm-l" x="218.0" y="111.0" text-anchor="end">Code specialist</text>
  <text class="tfm-s" x="218.0" y="126.0" text-anchor="end">RL on code</text>
  <rect x="230" y="102" width="275.7" height="22" rx="5" fill="var(--c-rl,#F5C8B5)" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.1"/>
  <text class="tfm-v" x="513.7" y="118.0" text-anchor="start" fill="var(--c-rl-ink,#B8613C)">53.6</text>
  <text class="tfm-l" x="218.0" y="151.0" text-anchor="end">Base model</text>
  <text class="tfm-s" x="218.0" y="166.0" text-anchor="end">Olmo 3 7B</text>
  <rect x="230" y="142" width="162.5" height="22" rx="5" fill="var(--c-base,#DDE2EA)" stroke="var(--c-base-line,#8F97A8)" stroke-width="1.1"/>
  <text class="tfm-v" x="400.5" y="158.0" text-anchor="start" fill="var(--c-ink2,#5B6273)">31.6</text>
  <g class="tfm-t" text-anchor="middle"><text x="230.0" y="202">0</text><text x="281.4" y="202">10</text><text x="332.9" y="202">20</text><text x="384.3" y="202">30</text><text x="435.7" y="202">40</text><text x="487.1" y="202">50</text><text x="538.6" y="202">60</text><text x="590.0" y="202">70</text></g>
  <text class="tfm-t" x="410.0" y="222.0" text-anchor="middle">mean accuracy over seven benchmarks (%)</text>
</svg>
