<svg class="cs-d" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arcd-t arcd-d" fill="currentColor">
  <title id="arcd-t">Out-of-distribution accuracy during training</title>
