<svg viewBox="0 0 640 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sgg-t sgg-d" fill="currentColor">
  <title id="sgg-t">Rollout groups that still carry a gradient</title>
  <desc id="sgg-d">With an outcome-only reward, 16.0 percent of GRPO rollout groups carry a gradient; with the per-turn process reward, 99.6 percent do.</desc>
  <style>
    .sgg-l{font:500 13px Inter,system-ui,sans-serif;fill:var(--ink,#1a1815)}
    .sgg-s{font:400 11.5px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}
    .sgg-v{font:600 15px Inter,system-ui,sans-serif}
    .sgg-t{font:400 11px Inter,system-ui,sans-serif;fill:var(--c-ink2,#5B6273)}
  </style>
  <!-- axis: x = 200 + 4 * value -->
  <g stroke="var(--c-grid,#E4E8EF)" stroke-width="1">
    <path d="M200,34 V170"/><path d="M300,34 V170"/><path d="M400,34 V170"/><path d="M500,34 V170"/><path d="M600,34 V170"/>
  </g>
  <g class="sgg-t" text-anchor="middle">
    <text x="200" y="188">0</text><text x="300" y="188">25</text><text x="400" y="188">50</text><text x="500" y="188">75</text><text x="600" y="188">100</text>
  </g>
  <text class="sgg-t" x="400" y="208" text-anchor="middle">rollout groups that still carry a gradient (%)</text>

  <!-- outcome-only -->
  <text class="sgg-l" x="190" y="66" text-anchor="end">outcome-only reward</text>
  <text class="sgg-s" x="190" y="83" text-anchor="end">success at the end only</text>
  <rect x="200" y="56" width="400" height="26" rx="6" fill="var(--c-grid,#E4E8EF)" fill-opacity=".55"/>
  <rect x="200" y="56" width="64" height="26" rx="6" fill="var(--c-rl,#F5C8B5)" stroke="var(--c-rl-line,#E39A7A)" stroke-width="1.1"/>
  <text class="sgg-v" x="274" y="75" fill="var(--c-rl-ink,#B8613C)">16.0%</text>
  <text class="sgg-s" x="596" y="75" text-anchor="end" fill="var(--c-rl-line,#E39A7A)">84% of groups teach nothing</text>

  <!-- per-turn -->
  <text class="sgg-l" x="190" y="128" text-anchor="end" style="font-weight:600">per-turn process reward</text>
  <text class="sgg-s" x="190" y="145" text-anchor="end">SpeechGym (ours)</text>
  <rect x="200" y="118" width="400" height="26" rx="6" fill="var(--c-grid,#E4E8EF)" fill-opacity=".55"/>
  <rect x="200" y="118" width="398.4" height="26" rx="6" fill="var(--c-ours-fill,#90A4C5)" stroke="var(--c-ours,#2F4B8F)" stroke-width="1.2"/>
  <text class="sgg-v" x="588" y="137" text-anchor="end" fill="#fff" style="paint-order:stroke;stroke:var(--c-ours,#2F4B8F);stroke-width:3px">99.6%</text>
</svg>
