<script>
(function(){
  var cv=document.getElementById('ce-stage'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), W=0, H=0, dpr=1, G=null, C=null;
  var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
  var steps=[].slice.call(document.querySelectorAll('.stage-steps li'));
  var T=15.2, FINAL=12.9, visible=true, raf=0, t0=0, lastStep=-1;
  /* Eight sampled chains for one question (schematic). ok: answer correct; con: consistency; str: structure;
     n: reasoning steps; bad: hallucinated steps; contra: the answer does not follow from the reasoning. */
  var CH=[
    {n:8, bad:[], ok:1,con:1,  str:.8},
    {n:12,bad:[5],ok:0,con:.3, str:.4},
    {n:7, bad:[], ok:1,con:1,  str:1},
    {n:15,bad:[], ok:1,con:.7, str:.6},
    {n:9, bad:[], ok:0,con:.25,str:.7,contra:1},
    {n:6, bad:[], ok:1,con:.95,str:.9},
    {n:11,bad:[3,7],ok:0,con:.2,str:.3},
    {n:10,bad:[], ok:1,con:.35,str:.5,contra:1}
  ];
  var SEG=['acc','fmt','con','str','len'], HEAD=['the answer','the format','consistency','structure','length','group mean'];
  var mean=0;
  CH.forEach(function(c){c.v=[5*c.ok,1,c.con,c.str,1-c.n/16];c.tot=c.v.reduce(function(a,b){return a+b;},0);mean+=c.tot/CH.length;});
  CH.forEach(function(c){c.adv=c.tot-mean;});
  var maxAdv=Math.max.apply(null,CH.map(function(c){return c.adv;})), minAdv=Math.min.apply(null,CH.map(function(c){return c.adv;}));

  function hex(s){s=s.trim().replace('#','');if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
  function mix(a,b,t){t=t<0?0:t>1?1:t;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
  function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a<0?0:a>1?1:a)+')';}
  function clamp(x){return x<0?0:x>1?1:x;}
  function ease(x){x=clamp(x);return x*x*(3-2*x);}
  function seg(t,a,b){return clamp((t-a)/(b-a));}
  function colors(){
    var cs=getComputedStyle(document.body), v=function(n){return hex(cs.getPropertyValue(n));};
    C={bg:v('--bg'),card:v('--card'),band:v('--band'),ink:v('--ink'),body:v('--body'),muted:v('--muted'),faint:v('--faint'),hair:v('--hair'),rule:v('--rule'),
       mint:v('--mint'),mintE:v('--mint-e'),mintT:v('--mint-t'),mintL:v('--mint-l'),
       peach:v('--peach'),peachE:v('--peach-e'),peachT:v('--peach-t'),peachL:v('--peach-l'),
       ice:v('--ice'),iceE:v('--ice-e'),iceT:v('--ice-t'),iceL:v('--ice-l'),
       lav:v('--lav'),lavE:v('--lav-e'),lavT:v('--lav-t'),rose:v('--rose'),roseE:v('--rose-e'),roseT:v('--rose-t'),
       dark:document.body.classList.contains('dark-mode'),sans:cs.getPropertyValue('--sans')};
    C.segF=[C.ice,C.band,C.lav,C.mint,C.rose];C.segE=[C.iceE,C.hair,C.lavE,C.mintE,C.roseE];C.segT=[C.iceT,C.body,C.lavT,C.mintT,C.roseT];
  }
  function layout(){
    var r=cv.getBoundingClientRect();W=Math.max(280,r.width);H=Math.max(300,r.height);
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    var wide=W>=620;G={wide:wide};
    if(wide){
      var top=Math.max(54,(H-312)/2+18);
      G.wx=24;G.wn=26;G.ws=5;G.wy=top+132;G.wa=30;
      G.mx=196;G.my=top+132;G.ms=48;
      G.ry0=top;G.rdy=37;G.cx=258;G.dx=16.5;G.dr=3.6;
      G.bx=Math.max(560,W-246);G.u=Math.min(22,(W-G.bx-24)/9);G.bh=12;G.hy=top-24;
    }else{
      G.wx=14;G.wn=22;G.ws=4.6;G.wy=40;G.wa=19;
      G.mx=30;G.my=0;G.ms=36;
      G.ry0=112;G.rdy=Math.min(36,(H-112-44)/7);G.cx=70;G.dx=Math.min(8.6,(W*0.56-74)/15);G.dr=2.6;
      G.u=Math.min(12.5,(W*0.34)/9);G.bx=W-16-9*G.u;G.bh=10;G.hy=G.ry0-26;
      G.my=G.ry0+3.5*G.rdy;
    }
  }
  function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function dot(x,y,r,f,a,e,ea){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=rgba(f,a);ctx.fill();if(e){ctx.lineWidth=1.1;ctx.strokeStyle=rgba(e,ea==null?a:ea);ctx.stroke();}}
  function glow(x,y,r,col,a){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));
    if(C.dark)ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.globalCompositeOperation='source-over';}
  function txt(s,x,y,col,a,al,wt,px){if(a<=.01)return;ctx.font=(wt||500)+' '+(px||13)+'px '+C.sans;ctx.textAlign=al||'left';ctx.fillStyle=rgba(col,a);ctx.fillText(s,x,y);}
  function rowY(k){return G.ry0+k*G.rdy;}
  function fan(k,u){ /* point at parameter u on the curve from the model to row k */
    var sx=G.mx+G.ms/2+2, sy=G.my, ex=G.cx-6, ey=rowY(k), c1x=sx+(ex-sx)*0.55, c2x=sx+(ex-sx)*0.45, o=1-u;
    return [o*o*o*sx+3*o*o*u*c1x+3*o*u*u*c2x+u*u*u*ex, o*o*o*sy+3*o*o*u*sy+3*o*u*u*ey+u*u*u*ey];
  }
  function wave(i,t){var a=Math.sin(i*0.9+t*7.1)*0.5+Math.sin(i*0.37-t*3.3)*0.35+Math.sin(i*2.3+t*11)*0.15;var env=0.35+0.65*Math.pow(Math.sin(Math.PI*(i+0.5)/G.wn),0.7);return Math.abs(a)*env;}

  function draw(t){
    if(!G||!C) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    var wide=G.wide, i, k, q;
    var out=1-seg(t,T-0.9,T-0.1);                  /* fade at the end of the loop */
    var step=t<1.9?0:t<5.7?1:t<9.7?2:3;
    if(step!==lastStep){lastStep=step;steps.forEach(function(el,n){el.classList.toggle('on',n===step);});}
    var motion=mq.matches?0:1;

    /* 1. the audio and its question */
    var play=seg(t,0.15,1.75), wa=0.55+0.45*(t<1.9?1:0.35);
    for(i=0;i<G.wn;i++){
      var x=G.wx+i*G.ws, lit=(i/G.wn)<=play||t>1.9, h=Math.max(2,G.wa*(motion?wave(i,t):0.5+0.5*Math.sin(i*1.3)*Math.sin(i*0.4)));
      ctx.fillStyle=rgba(lit?C.iceE:C.hair,wa*(lit?0.95:0.8));rr(x,G.wy-h,G.ws*0.56,h*2,1.4);ctx.fill();
    }
    if(t<1.9){var phx=G.wx+play*G.wn*G.ws;ctx.fillStyle=rgba(C.iceT,0.8*seg(t,0.15,0.4)*(1-seg(t,1.7,1.9)));ctx.fillRect(phx,G.wy-G.wa-6,1.5,2*G.wa+12);}
    if(wide){
      txt('the audio',G.wx,G.wy+G.wa+28,C.ink,0.92,'left',600,14);
      txt('and its question',G.wx,G.wy+G.wa+46,C.muted,0.95,'left',500,13);
      var qa=seg(t,0,0.5);rr(G.wx,G.wy-G.wa-50,30,24,8);ctx.fillStyle=rgba(C.card,qa);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=rgba(C.iceE,qa);ctx.stroke();
      txt('Q',G.wx+15,G.wy-G.wa-33,C.iceT,qa,'center',700,13);
      ctx.fillStyle=rgba(C.hair,qa);rr(G.wx+38,G.wy-G.wa-44,66,4,2);ctx.fill();rr(G.wx+38,G.wy-G.wa-35,46,4,2);ctx.fill();
    }else{
      txt('the audio and its question',G.wx+G.wn*G.ws+12,G.wy+5,C.muted,0.95,'left',500,13);
    }
    /* the audio flows into the model */
    var fl=seg(t,1.2,1.95);
    if(fl>0&&fl<1){var ax=wide?G.wx+G.wn*G.ws:G.wx+G.wn*G.ws*0.5, ay=wide?G.wy:G.wy+G.wa+6, bx=G.mx, by=G.my-G.ms/2;
      if(wide){bx=G.mx-G.ms/2;by=G.my;}
      for(q=0;q<4;q++){var uu=clamp(fl*1.25-q*0.08);if(uu<=0||uu>=1)continue;var px=ax+(bx-ax)*uu, py=ay+(by-ay)*uu;dot(px,py,2.6-q*0.4,C.iceE,0.9-q*0.18);}}

    /* 2. the model */
    var upd=ease(seg(t,10.9,12.5))*(1-seg(t,T-0.9,T-0.1)), pulse=Math.max(seg(t,1.75,1.95)*(1-seg(t,1.95,2.5)),0);
    var mf=mix(mix(C.card,C.ice,0.55),C.mint,upd), me=mix(C.iceE,C.mintE,upd);
    if(upd>0.02)glow(G.mx,G.my,G.ms*1.1,C.mintE,0.32*upd);
    if(pulse>0.02)glow(G.mx,G.my,G.ms,C.iceE,0.3*pulse);
    rr(G.mx-G.ms/2,G.my-G.ms/2,G.ms,G.ms,G.ms*0.26);ctx.fillStyle=rgba(mf,1);ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle=rgba(me,1);ctx.stroke();
    for(i=0;i<3;i++){var ly=G.my-G.ms*0.2+i*G.ms*0.2;ctx.fillStyle=rgba(mix(C.iceE,C.mintT,upd),0.75);rr(G.mx-G.ms*0.26,ly-1.5,G.ms*0.52*(i===1?0.72:1),3,1.5);ctx.fill();}
    if(wide){txt('the model',G.mx,G.my+G.ms/2+22,C.ink,0.92,'center',600,14);txt(upd>0.5?'reinforced':'audio LLM',G.mx,G.my+G.ms/2+40,upd>0.5?C.mintT:C.muted,0.95,'center',upd>0.5?600:500,13);}

    /* 3. eight chains of reasoning */
    var fade=out, bx=G.bx, u=G.u;
    for(k=0;k<CH.length;k++){
      var c=CH[k], y=rowY(k), st=1.95+k*0.12, grown=(t-st)*6.2, isTop=c.adv>0;
      var tint=seg(t,10.1,10.7), win=isTop?tint*(0.35+0.65*c.adv/maxAdv):0, lose=!isTop?tint*(0.4+0.6*c.adv/minAdv):0;
      var fanU=clamp((t-st)/0.35);
      if(fanU>0){ctx.beginPath();var p0=fan(k,0);ctx.moveTo(p0[0],p0[1]);for(q=1;q<=24;q++){var pp=fan(k,fanU*q/24);ctx.lineTo(pp[0],pp[1]);}
        ctx.lineWidth=1.1;ctx.strokeStyle=rgba(mix(C.hair,C.mintE,win),fade*(0.9-0.5*lose));ctx.stroke();}
      var shown=Math.max(0,Math.min(c.n,grown-1.2));
      for(i=0;i<c.n;i++){
        var a=clamp(shown-i), dxx=G.cx+i*G.dx; if(a<=0)break;
        var bad=c.bad.indexOf(i)>=0, over=i>=12, pr=Math.max(seg(t,7.3,7.5)*(1-seg(t,8.9,9.3)),0);
        var f=bad?C.peach:mix(C.iceE,C.mintE,win), e=bad?C.peachE:null, al=fade*a*(1-0.55*lose);
        if(over&&t>8.9&&t<9.7)f=mix(f,C.roseE,seg(t,8.9,9.2)*(1-seg(t,9.4,9.7)));
        var rad=G.dr*(bad?1.25:1)*(1+(bad?0.35*Math.sin(t*9)*Math.max(seg(t,7.3,7.5)*(1-seg(t,8.9,9.3)),0):0));
        dot(dxx,y,rad,f,al,e,al);
      }
      /* the answer */
      var aa=clamp(grown-1.2-c.n-0.3)*fade, axx=G.cx+c.n*G.dx+(wide?8:5), ar=wide?8:6.5;
      if(aa>0){
        if(c.contra){ctx.setLineDash([2.5,3]);ctx.beginPath();ctx.moveTo(axx-G.dx-1,y);ctx.lineTo(axx-ar-1,y);ctx.lineWidth=1.2;ctx.strokeStyle=rgba(C.peachE,aa*(t>6.6&&t<9.7?1:0.55));ctx.stroke();ctx.setLineDash([]);}
        dot(axx,y,ar,c.ok?mix(C.iceL,C.mintL,win):C.peachL,aa*(1-0.4*lose),c.ok?mix(C.iceE,C.mintE,win):C.peachE,aa*(1-0.4*lose));
        ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=rgba(c.ok?mix(C.iceT,C.mintT,win):C.peachT,aa*(1-0.4*lose));ctx.beginPath();
        var s=ar*0.42; if(c.ok){ctx.moveTo(axx-s,y+0.2);ctx.lineTo(axx-s*0.25,y+s*0.8);ctx.lineTo(axx+s,y-s*0.7);}else{ctx.moveTo(axx-s*0.75,y-s*0.75);ctx.lineTo(axx+s*0.75,y+s*0.75);ctx.moveTo(axx+s*0.75,y-s*0.75);ctx.lineTo(axx-s*0.75,y+s*0.75);}
        ctx.stroke();
      }
      /* its score, one term at a time */
      var xx=bx;
      for(var sI=0;sI<5;sI++){
        var g=ease(seg(t,5.75+sI*0.8,6.45+sI*0.8)), w=c.v[sI]*u*g;
        if(w>0.4){rr(xx,y-G.bh/2,w,G.bh,2.5);ctx.fillStyle=rgba(C.segF[sI],fade*(1-0.45*lose));ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=rgba(C.segE[sI],fade*(1-0.45*lose));ctx.stroke();}
        xx+=c.v[sI]*u*g;
      }
      /* above or below the group mean */
      if(tint>0.01){
        var ex2=bx+c.tot*u+(wide?9:6), sg=isTop?-1:1, aw=fade*tint;
        ctx.lineWidth=1.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=rgba(isTop?C.mintE:C.peachE,aw);ctx.beginPath();
        ctx.moveTo(ex2,y-4*sg);ctx.lineTo(ex2,y+4.5*sg);ctx.moveTo(ex2-3.2,y+1*sg);ctx.lineTo(ex2,y+4.5*sg);ctx.lineTo(ex2+3.2,y+1*sg);
        ctx.stroke();
      }
      /* the update flows back into the model along the chains that beat the mean */
      if(isTop&&t>10.6&&t<12.8){
        for(q=0;q<3;q++){var pu=((t-10.6)*0.62+q/3+k*0.07)%1, fx, fy;
          var tail=G.cx+(c.n-1)*G.dx;
          if(pu<0.55){var v2=pu/0.55;fx=tail+(G.cx-tail)*v2;fy=y;}else{var pq=fan(k,1-(pu-0.55)/0.45);fx=pq[0];fy=pq[1];}
          var pa=Math.sin(Math.PI*pu)*fade*(1-seg(t,12.4,12.8));
          glow(fx,fy,8,C.mintE,0.35*pa);dot(fx,fy,2.3,C.mintE,pa);}
      }
    }
    /* the group mean */
    var ma=seg(t,9.7,10.1)*fade;
    if(ma>0.01){var mxx=bx+mean*u, y0=rowY(0)-G.bh, y1=rowY(CH.length-1)+G.bh;
      ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(mxx,y0);ctx.lineTo(mxx,y1);ctx.lineWidth=1.3;ctx.strokeStyle=rgba(C.ink,0.55*ma);ctx.stroke();ctx.setLineDash([]);}
    /* the label above the scores names the term being scored */
    var hk=t<5.75?-1:t<9.75?Math.min(4,Math.floor((t-5.75)/0.8)):5, ha=(t<5.75?0:seg(t,5.75,6.0))*fade;
    if(hk>=0&&ha>0){
      var hc=hk<5?C.segE[hk]:C.ink, hf=hk<5?C.segF[hk]:C.card, lab=hk<5?HEAD[hk]:'its group mean', hxx=hk<5?bx+6:bx+mean*u-5;
      var subA=hk<5?seg(t,5.75+hk*0.8,5.95+hk*0.8):seg(t,9.75,9.95);
      if(hk<5){dot(bx+4,G.hy-4.5,4.2,hf,ha*subA,hc,ha*subA);txt(lab,bx+14,G.hy,C.ink,ha*subA,'left',600,13);}
      else{txt('group mean',Math.min(bx+mean*u,W-46),G.hy,C.ink,ha*subA,'center',600,13);}
      if(wide)txt('its score',bx,G.hy-20,C.muted,ha,'left',500,13);
    }
    if(t<5.75&&t>2.2){txt(wide?'eight chains of reasoning, one question':'eight chains, one question',G.cx-(wide?0:0),G.hy,C.muted,seg(t,2.2,2.7)*(1-seg(t,5.4,5.75)),'left',500,13);}
  }

  function frame(now){
    raf=0;if(mq.matches||!visible||document.hidden) return;
    if(!t0)t0=now;var e=(now-t0)/1000;
    if(e>=T){t0=now;e=0;}
    draw(e);raf=requestAnimationFrame(frame);
  }
  function still(){draw(FINAL);}
  function kick(){
    if(mq.matches){still();return;}
    if(!raf&&visible&&!document.hidden){t0=0;raf=requestAnimationFrame(frame);}
  }
  function refresh(){colors();layout();if(mq.matches||!raf)still();}
  colors();layout();
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){var was=visible;visible=es[0].isIntersecting;if(visible&&!was)t0=0;if(visible)kick();},{threshold:0.05}).observe(cv);
  }
  document.addEventListener('visibilitychange',kick);
  window.addEventListener('resize',function(){layout();if(mq.matches||!raf)still();});
  if(mq.addEventListener)mq.addEventListener('change',function(){if(mq.matches)still();else kick();});
  new MutationObserver(function(){colors();if(mq.matches||!raf)still();}).observe(document.body,{attributes:true,attributeFilter:['class']});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refresh);
  still();kick();
})();
</script>
