<figure class="su3" id="su-third">

      <p class="su3-say">Separate training, with gradients, away from its work.</p>
      <ul class="su3-yn">
        <li class="n"><i role="img" aria-label="Does not hold:"></i>No training</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>No added cost per step</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>Kept in its weights</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>An agent that acts, with no larger model</li>
      </ul>
    </article>
    <article class="su3-act">
      <header><h3>Aid it at every step</h3><p>reflection&nbsp;&middot; memory&nbsp;&middot; search&nbsp;&middot; prompts</p></header>
      <canvas role="img" aria-label="Animation, second act. Aids at test time: the same frozen weights are wrapped in reflection, memory, search and prompts. At every step of a task the four are stacked on again and paid again. Then the task changes, the aids fall away, and the weights have not changed."></canvas>
      <p class="su3-say">Paid again at every step, and lost when the task changes.</p>
      <ul class="su3-yn">
        <li class="y"><i role="img" aria-label="Holds:"></i>No training</li>
        <li class="n"><i role="img" aria-label="Does not hold:"></i>No added cost per step</li>
        <li class="n"><i role="img" aria-label="Does not hold:"></i>Kept in its weights</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>An agent that acts, with no larger model</li>
      </ul>
    </article>
    <article class="su3-act">
      <header><h3>Edit weights by reasoning, so far</h3><p>weight&#8209;space&nbsp;programming</p></header>
      <canvas role="img" aria-label="Animation, third act. Weight-space programming so far, in two halves. Above: a far larger model edits the weights of a smaller network. Below: a model rewrites its own weights, but it only reasons, with text in and text out, no room and no actions. The row of steps at work stays empty."></canvas>
      <p class="su3-say">It has stayed with models that only reason, or relied on a far larger commercial model.</p>
      <ul class="su3-yn">
        <li class="y"><i role="img" aria-label="Holds:"></i>No training</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>No added cost per step</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>Kept in its weights</li>
        <li class="n"><i role="img" aria-label="Does not hold:"></i>An agent that acts, with no larger model</li>
      </ul>
    </article>
    <article class="su3-act ours">
      <header><h3>Let it upgrade itself</h3><p>its&nbsp;own&nbsp;weights&nbsp;&middot; its&nbsp;own&nbsp;experience</p></header>
      <canvas role="img" aria-label="Animation, fourth act. Self-upgrading: by day the agent works, one step after another. At night it reads its record, traces a habit to one direction, rewrites one tensor of its own weights, tests the edit against its unchanged self and keeps it. The next day every step costs what it cost before, and the upgrade stays in its weights."></canvas>
      <p class="su3-say"><span>Between its tasks, on the one GPU that serves it.</span> <span>Every step costs what it cost before.</span></p>
      <ul class="su3-yn">
        <li class="y"><i role="img" aria-label="Holds:"></i>No training</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>No added cost per step</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>Kept in its weights</li>
        <li class="y"><i role="img" aria-label="Holds:"></i>An agent that acts, with no larger model</li>
      </ul>
    </article>
    <p class="su3-no"><b>Self&#8209;upgrading needs</b> <span>no training<i class="vh">,</i></span> <span>no gradient<i class="vh">,</i></span> <span>no reward model<i class="vh">,</i></span> <span>no second model<i class="vh">,</i></span> <span>no test&#8209;time scaling<i class="vh">,</i></span> <span>no harness or prompt engineering</span></p>
