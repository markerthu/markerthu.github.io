<style>
/* at a glance */
#glance .nots{margin-top:22px}
#glance .nots li::before{border-color:var(--ice-e);background:linear-gradient(135deg,transparent 43%,var(--ice-e) 43%,var(--ice-e) 57%,transparent 57%)}
.gl-step{fill:none;stroke:var(--mint-e);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gl-sd{fill:var(--card);stroke:var(--mint-e);stroke-width:2}
.gl-sd.gl-sk{fill:var(--mint-e)}

/* the five measures, as numbers */
.su-mets{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;margin-top:var(--sp-fig)}
.mt-main,.mt-t{border:1px solid var(--rule);border-radius:18px;background:var(--card);min-width:0}
.mt-main{padding:26px 30px 24px;border-color:var(--mint-e);background:linear-gradient(180deg,var(--mint-l),var(--card) 70%);display:flex;flex-direction:column;justify-content:center}
.mt-k{font-size:var(--t-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mt-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.mt-a{font-size:clamp(30px,4.2vw,50px);font-weight:500;color:var(--muted)}
.mt-b{font-size:clamp(50px,7.4vw,92px);font-weight:700;color:var(--mint-t)}
.mt-ar{flex:none;width:clamp(26px,3.4vw,44px);height:2px;background:var(--faint);position:relative;align-self:center}
.mt-ar::after{content:'';position:absolute;right:-1px;top:-4px;width:9px;height:9px;border-top:2px solid var(--faint);border-right:2px solid var(--faint);transform:rotate(45deg)}
.mt-bars{display:grid;gap:6px;margin-top:20px}
.mt-bars i{display:block;height:9px;border-radius:5px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.mt-bars i.u{background:var(--ice);border:1px solid var(--ice-e)}
.mt-bars i.e{background:var(--mint);border:1px solid var(--mint-e);transition-delay:.25s}
.su-mets.in .mt-bars i{width:var(--w)}
.mt-d{margin-top:16px;font-size:var(--t-label);line-height:1.5;color:var(--body);font-variant-numeric:tabular-nums}
.mt-d b{font-size:var(--t-lead);font-weight:700;color:var(--mint-t);margin-right:4px}
.mt-sub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mt-t{padding:18px 20px 16px;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.su-mets.in .mt-t{opacity:1;transform:none}
.mt-t .mt-k{letter-spacing:.02em;text-transform:none;font-weight:500}
.mt-v{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.mt-v span{font-size:clamp(17px,1.7vw,21px);color:var(--muted)}
.mt-v b{font-size:clamp(26px,2.9vw,38px);font-weight:700;color:var(--mint-t)}
.mt-v em{font-style:normal;color:var(--faint);font-size:17px}
.mt-t .mt-bars{margin-top:12px;gap:4px}
.mt-t .mt-bars i{height:6px}
.mt-w{margin-top:10px;font-size:var(--t-fine);color:var(--muted)}
@media(max-width:900px){.su-mets{grid-template-columns:1fr}}
@media(max-width:480px){.mt-sub{gap:12px}.mt-t{padding:14px 14px 12px}.mt-main{padding:22px 20px 20px}.mt-v{gap:5px}.mt-v span{font-size:15px}.mt-v em{font-size:14px}.mt-v b{font-size:22px}}
@media(max-width:380px){.mt-big{gap:6px 12px}.mt-a{font-size:25px}.mt-b{font-size:43px}.mt-ar{width:22px}.mt-sub{gap:10px}.mt-t{padding:13px 11px 11px}.mt-v{gap:4px}.mt-v span{font-size:14px}.mt-v em{font-size:13px}.mt-v b{font-size:20px}}
@media(prefers-reduced-motion:reduce){.mt-bars i,.mt-t{transition:none}}

/* the same tasks, with and without its own edit: one row a task, both agents on one clock */
.su-rows{padding:18px 22px 10px}
.rw-head,.rw{display:grid;grid-template-columns:minmax(0,.5fr) minmax(0,1fr) minmax(0,1fr);gap:0 22px;align-items:start}
.rw-head{position:relative;align-items:center;min-height:34px;padding-bottom:8px;font-size:var(--t-label);font-weight:600}
.rw-head .k-unch{color:var(--ice-t)}.rw-head .k-edit{color:var(--mint-t)}
.rw-head span:first-child{color:var(--muted);font-weight:500}
.rw-head .rw-play{position:absolute;right:0;top:0;margin:0}
.rw{border-top:1px solid var(--hair);padding:14px 0 12px}
.rw-task{font-size:var(--t-body);line-height:1.4;color:var(--ink);padding-top:4px;overflow-wrap:anywhere}
.rw-task span{display:block;font-size:var(--t-fine);color:var(--muted);margin-bottom:5px}
.rw-task small{display:block;font-size:var(--t-fine);color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.rw-cell{min-width:0;border-radius:14px;padding:6px 12px 8px;background:linear-gradient(180deg,var(--kl),transparent 70%)}
.rw-cell .ch{display:block}
.rw-cell .su-stat{margin-top:4px;min-height:1.5em}
.rw-cell::before{display:none;content:attr(data-lab);font-size:var(--t-label);font-weight:600;color:var(--kt);margin-bottom:2px}
.su-rows .su-key{border-top:1px solid var(--hair);margin-top:0;padding:12px 0 8px}
.rw-f{fill:var(--card);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.rw-fl{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rw-fd{fill:var(--ink)}
.ch text.rw-pl{font-size:11px;fill:var(--muted)}
.rw-obj{transition:transform .5s cubic-bezier(.45,0,.2,1)}
.ob-a{fill:var(--su-take);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.ob-g{fill:var(--mint);stroke:var(--ink);stroke-width:1.3}
.ob-l{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
.rw-pulse{fill:none;stroke:var(--lav-e);stroke-width:2;opacity:0}
.rw-pulse.go{animation:rwPulse .9s ease-out}
@keyframes rwPulse{0%{opacity:.9;r:6}100%{opacity:0;r:30}}
.rw-sc.lamp-on .rm-light{opacity:.5}
.rw-sc .rm-light{fill:var(--su-sun);opacity:0;transition:opacity .4s}
.rw-sc .rm-robot{transition:transform .7s cubic-bezier(.45,0,.2,1)}
@media(max-width:900px){
  .rw-head{display:flex;justify-content:flex-start;padding-right:40px}
  .rw-head .k-unch,.rw-head .k-edit{display:none}
  .rw{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .rw-task{grid-column:1/-1;padding-top:0}
  .rw-task small{display:inline;margin:0 0 0 10px}
  .rw-cell::before{display:block}
  .rw-cell{padding:6px 8px 8px}
  .su-rows{padding:14px 12px 6px}
}
@media(max-width:620px){.rw{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rw-obj,.rw-sc .rm-robot{transition:none}.rw-pulse.go{animation:none}}

/* what it opens: the door (one clock, driven from the script below) */
.su-door{margin-top:var(--sp-fig);border:1px solid var(--rule);border-radius:20px;background:var(--card);overflow:hidden}
.su-door svg{display:block;width:100%;height:auto}
.dr-floor{stroke:var(--hair);stroke-width:1.6;stroke-linecap:round}
.dr-wallb{fill:var(--band)}
.dr-wallo{fill:none;stroke:var(--faint);stroke-width:1.2}
.dr-open{fill:var(--card)}
.dr-openo{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.dr-glow{fill:var(--mint);opacity:0}
.dr-leaf{fill:var(--card);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.dr-pan{fill:none;stroke:var(--hair);stroke-width:1.2}
.dr-knob{fill:var(--ink)}
.dr-chip{fill:var(--band);stroke:var(--hair);stroke-width:1.2}
.dr-gap{stroke:var(--rose-e);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round}
.dr-day{fill:var(--su-sun);stroke:var(--su-sun-e);stroke-width:1.2}
.dr-night{fill:var(--su-night);stroke:var(--su-night-e);stroke-width:1.2}

.dr-sun{fill:var(--su-sun-e)}
.dr-moon{fill:var(--su-on-night)}
.dr-t{opacity:.3}
.su-door text{font-family:var(--sans)}
.dr-lab{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
.dr-lab.on{fill:var(--mint-t)}
.dr-sm{font-size:13px;fill:var(--body)}
.dr-big{font-size:16px;font-weight:600;fill:var(--mint-t)}
.dr-dark{fill:var(--su-night)}
.dr-step{fill:var(--ice);stroke:var(--ice-e);stroke-width:1}
.dr-nl{font-size:12.5px;fill:var(--body)}
.dr-oc rect{fill:var(--card);stroke:var(--hair);stroke-width:1.2;stroke-dasharray:3 3}
.dr-oc text{font-size:12.5px;fill:var(--muted)}
.dr-oc.k rect{fill:var(--mint);stroke:var(--mint-e);stroke-dasharray:none}
.dr-oc.k text{fill:var(--mint-t);font-weight:600}
#horizon .belief{max-width:38em;font-size:clamp(20px,2.2vw,27px);line-height:1.38;font-weight:500;color:var(--ink);margin-top:26px;text-wrap:balance}
#horizon .belief b{color:var(--mint-t);font-weight:700}
#horizon .cap{max-width:none}

/* Finding 02, drawn as the paper draws it: one small chart a measure, its unchanged self against the agent after its own edit */
.sl-ax{stroke:var(--ink);stroke-width:1.1;stroke-linecap:round}
.sl-tk{stroke:var(--ink);stroke-width:1}
.sl-grid{stroke:var(--hair);stroke-width:1;stroke-dasharray:2 4}
.sl-l{fill:none;stroke:var(--mint-e);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.sl-u{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.8}
.sl-e{fill:var(--mint);stroke:var(--mint-e);stroke-width:2}
.sl-band{fill:var(--mint-e);fill-opacity:.2}
.sl-zero{stroke:var(--ink);stroke-width:1.1}
.ch text.sl-t{font-size:15px;font-weight:600;fill:var(--ink)}
.ch text.sl-s{font-size:12px;fill:var(--muted)}
.ch text.sl-n{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ch text.sl-vu{font-size:14px;font-weight:600;fill:var(--ice-t);font-variant-numeric:tabular-nums}
.ch text.sl-ve{font-size:16px;font-weight:700;fill:var(--mint-t);font-variant-numeric:tabular-nums}
.ch text.sl-big{font-size:19px}
.ch text.sl-xu{font-size:12.5px;fill:var(--ice-t)}
.ch text.sl-xe{font-size:12.5px;fill:var(--mint-t);font-weight:600}
.ch text.sl-note{font-size:12.5px;fill:var(--mint-t);font-weight:600}

/* Finding 02 on the web: bars that rise for the five measures, and the running lead drawn episode by episode */
.br-base{stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
.br-u{fill:url(#brU);stroke:var(--ice-e);stroke-width:1.4}
.br-e{fill:url(#brE);stroke:var(--mint-e);stroke-width:1.6}
.br-cap{fill:var(--mint-e);opacity:.92}
.br-ghost{fill:var(--mint-l);stroke:var(--mint-e);stroke-width:1.3;stroke-dasharray:4 4}
.br-guide{fill:none;stroke:var(--ice-e);stroke-width:1.4;stroke-dasharray:3 4;stroke-linecap:round}
.br-brk{fill:none;stroke:var(--mint-e);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch text.br-vu{font-size:15px;font-weight:600;fill:var(--ice-t);font-variant-numeric:tabular-nums}
.ch text.br-ve{font-size:20px;font-weight:700;fill:var(--mint-t);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ch text.br-vu.big{font-size:22px}
.ch text.br-ve.big{font-size:38px;letter-spacing:-.025em}
.ch text.br-d{font-size:15px;font-weight:700;fill:var(--mint-t)}
.ch text.br-d2{font-size:12.5px;fill:var(--muted)}
.ch text.br-x{font-size:12.5px;fill:var(--muted)}
.ch text.br-x.e{fill:var(--mint-t);font-weight:600}
.ch text.br-x.u{fill:var(--ice-t)}
.ch text.br-dir{font-size:12px;font-weight:600;fill:var(--mint-t);letter-spacing:.04em;text-transform:uppercase}
.anim .br-glow{filter:none}
.anim.in .br-glow{animation:brGlow 3.4s ease-in-out 2.2s infinite}
@keyframes brGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(63,144,104,0))}50%{filter:drop-shadow(0 0 9px rgba(63,144,104,.55))}}
.paused .br-glow{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.anim.in .br-glow{animation:none}}
.ld-ax{stroke:var(--ink);stroke-width:1.1;stroke-linecap:round}
.ld-tk{stroke:var(--ink);stroke-width:1}
.ld-zero{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4}
.ld-band{fill:var(--mint-e);fill-opacity:.16}
.ld-l{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ld-scan{stroke:var(--mint-e);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.ld-halo{fill:var(--mint-e);fill-opacity:.22}
.ld-dot{fill:var(--mint);stroke:var(--mint-e);stroke-width:2.2}
.ch text.ld-end{font-size:22px;font-weight:700;fill:var(--mint-t);font-variant-numeric:tabular-nums;letter-spacing:-.01em;transition:opacity .5s ease}
.ch text.ld-endu{font-size:12.5px;fill:var(--mint-t);transition:opacity .5s ease}
.ld-count{margin:0 0 6px;font-size:var(--t-label);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ld-count b{color:var(--mint-t);font-weight:700;display:inline-block;min-width:1.5em;text-align:right}
.ch text.br-tm{font-size:17px;fill:var(--mint-t)}
.br-chip{fill:var(--card);stroke:var(--mint-e);stroke-width:1.2}
.br-chip.m{fill:var(--mint);stroke:var(--mint-e)}
.ch text.br-chip-t{font-size:13.5px;font-weight:600;fill:var(--mint-t);font-variant-numeric:tabular-nums}
.ld-count{text-align:center}
.br-hl{fill:var(--mint-l);stroke:var(--mint-e);stroke-opacity:.35;stroke-width:1}
.ch text.br-vu{font-size:14px}
.ch text.br-ve{font-size:18px}
.ch text.br-tm{font-size:15px;fill:var(--mint-t)}
</style>
<script>
(function(){
  'use strict';
  var S=window.SUF; if(!S) return;
  var D=S.D, $=S.$, $$=S.$$, R=S.R, esc=S.esc, num=S.num, tx=S.tx, rect=S.rect, line=S.line, svg=S.svg, tw=S.tw, reduced=S.reduced, hasIO=S.hasIO;

  /* ---------- the five measures ---------- */
  function mets(){
    var el=$('#su-mets'); if(!el) return;
    var M=D.headline.main, F=D.headline.further;
    var unit={within:'%',steps:'',noaction:'%',tokens:'k'}, word={within:'more',steps:'fewer',noaction:'fewer',tokens:'fewer'};
    var mx=Math.max(M.unchanged.value,M.edited.value);
    var o='<div class="mt-main"><p class="mt-k">'+esc(M.label)+'</p>'+
      '<p class="mt-big"><span class="mt-a">'+M.unchanged.text+'%</span><i class="mt-ar" aria-hidden="true"></i><span class="mt-b">'+M.edited.text+'%</span></p>'+
      '<div class="mt-bars" aria-hidden="true"><i class="u" style="--w:'+R(M.unchanged.value/mx*100)+'%"></i><i class="e" style="--w:'+R(M.edited.value/mx*100)+'%"></i></div>'+
      '<p class="mt-d"><b>'+S.minus(M.change.text)+' points</b> <span class="nw">95% interval '+M.interval95.text[0]+' to '+M.interval95.text[1]+'</span> <span class="nw">· p&nbsp;&lt;&nbsp;10<sup>&minus;4</sup></span></p></div>';
    o+='<div class="mt-sub">'+F.map(function(f,i){var m=Math.max(f.unchanged.value,f.edited.value), u=unit[f.id]||'';
      return '<div class="mt-t" style="--d:'+(0.25+i*0.12).toFixed(2)+'s"><p class="mt-k">'+esc(f.label)+'</p>'+
        '<p class="mt-v"><span>'+f.unchanged.text+u+'</span><em aria-hidden="true">&rarr;</em><b>'+f.edited.text+u+'</b></p>'+
        '<div class="mt-bars" aria-hidden="true"><i class="u" style="--w:'+R(f.unchanged.value/m*100)+'%"></i><i class="e" style="--w:'+R(f.edited.value/m*100)+'%"></i></div>'+
        '<p class="mt-w">'+word[f.id]+(f.id==='tokens'?' tokens, in thousands':f.id==='within'?' of a task’s episodes':f.id==='noaction'?' of a task’s steps':' steps')+'</p></div>';}).join('')+'</div>';
    el.innerHTML=o;
  }

  /* ---------- the same tasks, with and without its own edit: rooms drawn from the steps of each episode ---------- */
  var cardOf={};D.cards.forEach(function(c){cardOf[c.letter]=c;});
  var EPS=[{k:'alarm',ep:D.alarm,task:D.alarm.task,room:'a room it never saw',obj:'clock'},
           {k:'b',ep:D.opened.b,task:cardOf.b.task,room:'a room it never saw',obj:'lettuce'},
           {k:'c',ep:D.opened.c,task:cardOf.c.task,room:'a room seen in practice',obj:'knife'},
           {k:'f',ep:D.opened.f,task:cardOf.f.task,room:'a room it never saw',obj:'vase'}];
  function baseOf(p){return p.replace(/ \d+$/,'');}
  function placesOf(ep){var seen={}, list=[];
    [ep.edited.step_list,ep.unchanged.step_list].forEach(function(L){L.forEach(function(s){var m=/^go to (.+)$/.exec(s.action);if(m&&!seen[m[1]]){seen[m[1]]=1;list.push(m[1]);}});});
    /* keep places of one kind side by side, in the order the kinds first appear */
    var order=[];list.forEach(function(p){var b=baseOf(p);if(order.indexOf(b)<0)order.push(b);});
    return list.slice().sort(function(a,b){var x=order.indexOf(baseOf(a))-order.indexOf(baseOf(b));return x||(parseInt(a.replace(/\D/g,''),10)-parseInt(b.replace(/\D/g,''),10));});}
  function srcOf(ep){var m=null;[ep.edited.step_list,ep.unchanged.step_list].some(function(L){return L.some(function(s){var x=/^take .+ from (.+)$/.exec(s.action);if(x&&s.kind!=='none'){m=x[1];return true;}return false;});});return m;}
  /* furniture, drawn with its foot at 0,0; returns its picture and the height of its top */
  function furn(b,w){var h, o='';
    if(b==='fridge'){h=56;var fw=Math.min(w,30);o=rect(-fw/2,-h,fw,h,3,'rw-f')+line(-fw/2,-h+19,fw/2,-h+19,'rw-fl')+line(fw/2-5,-h+7,fw/2-5,-h+13,'rw-fl')+line(fw/2-5,-h+25,fw/2-5,-h+33,'rw-fl');}
    else if(b==='cabinet'){h=40;o=rect(-w/2,-h,w,h,2.5,'rw-f')+line(0,-h,0,0,'rw-fl')+'<circle class="rw-fd" cx="-3.4" cy="'+(-h/2)+'" r="1.4"/><circle class="rw-fd" cx="3.4" cy="'+(-h/2)+'" r="1.4"/>';}
    else if(b==='drawer'){h=24;o=rect(-w/2,-h,w,h,2.5,'rw-f')+line(-w/2,-h/2,w/2,-h/2,'rw-fl')+'<circle class="rw-fd" cx="0" cy="'+(-h*0.75)+'" r="1.4"/><circle class="rw-fd" cx="0" cy="'+(-h*0.25)+'" r="1.4"/>';}
    else if(b==='dresser'){h=42;o=rect(-w/2,-h,w,h,2.5,'rw-f')+line(-w/2,-h*0.66,w/2,-h*0.66,'rw-fl')+line(-w/2,-h*0.33,w/2,-h*0.33,'rw-fl');}
    else if(b==='safe'){h=32;var sw=Math.min(w,30);o=rect(-sw/2,-h,sw,h,3,'rw-f')+'<circle class="rw-fl" cx="0" cy="'+(-h/2)+'" r="5.5"/><circle class="rw-fd" cx="0" cy="'+(-h/2)+'" r="1.5"/>';}
    else if(b==='shelf'){h=50;var p=w/2-2;o=line(-p,-h,-p,0,'rw-fl')+line(p,-h,p,0,'rw-fl')+[h,h-17,h-34].map(function(y){return line(-p,-y,p,-y,'rw-fl');}).join('');}
    else if(b==='sofa'||b==='armchair'){h=22;o=rect(-w/2,-38,w,22,6,'rw-f')+rect(-w/2-2,-h,w+4,16,5,'rw-f')+line(-w/2+3,-6,-w/2+3,0,'rw-fl')+line(w/2-3,-6,w/2-3,0,'rw-fl');}
    else{h=b==='sidetable'?30:b==='sinkbasin'?38:40;var lg=w/2-4;   /* a table: desk, countertop, sinkbasin, sidetable */

    var cols=$$('.dr-dark',el), stp=$$('.dr-step',el);nights.forEach(function(nt,k){nt.col=cols[k];nt.left=tc(nt.i)+30*bs+6+(nt.kept?wk:ww)>W-6;});days.forEach(function(d,k){d.marks=stp.slice(k*4,k*4+4);});
    DR.T=tEnd+2.4;DR.stillT=nights.length?nights[0].t0+1.6:tEnd;
    doorAt(DR.hold!=null?DR.hold:DR.still!=null?DR.still:DR.t);
  }
  function doorAt(t){
    var g=DR.g; if(!g) return;
    var te=g.tEnd, open=sm(sg(t,1.0,2.1))*(1-sm(sg(t,te+1.0,te+1.8))), back=t>=te+1.5, x=g.bx, i;
    if(!back){if(t>=te)x=g.xEnd;else for(i=0;i<g.sched.length;i++){var q=g.sched[i];if(t>=q.t0&&t<q.t1){var u=sg(t,q.t0,q.t1);x=q.a+(q.b-q.a)*(q.k==='m'?sm(u):u);break;}}}
    var a=t<te+0.8?1:t<te+1.3?1-(t-te-0.8)/0.5:t<te+1.7?0:cl((t-te-1.7)/0.5), off=1-sm(sg(t,te+0.8,te+1.6));
    g.leaf.style.transform='scaleX('+(1-0.74*open).toFixed(3)+') skewY('+(-7*open).toFixed(2)+'deg)';
    g.glow.style.opacity=(0.55*open).toFixed(3);
    g.bot.style.transform='translateX('+x.toFixed(1)+'px)';g.bot.style.opacity=a.toFixed(3);
    g.tiles.forEach(function(q){var lit=back?0:cl((x-(q.cx-g.ts*0.55))/(g.ts*0.5));q.el.style.opacity=(0.3+0.7*lit*off).toFixed(3);});
    var prog=cl((x-g.bx)/Math.max(1,g.xEnd-g.bx));
    g.big.style.opacity=(0.42+0.58*sm(sg(prog,0.8,1))*off).toFixed(3);
    /* the nights: it stops, the room darkens, it reads the day, rewrites a pane, and keeps the edit or withdraws it */
    var lit=1, blink=-1, label='', chip='', left=false;
    g.nights.forEach(function(nt){var s0=nt.t0, e0=nt.t1, u=t-s0;
      nt.col.setAttribute('opacity',(back?0:0.18*sm(sg(t,s0-0.2,s0+0.3))*(1-sm(sg(t,e0,e0+0.45)))*off).toFixed(3));
      if(back)return;
      if(u>=0&&u<2.0){if(u<0.6)label='reads its record';else if(u<1.25){label='rewrites its weights';blink=lit;}else{chip=nt.kept?'kept':'withdrawn';left=nt.left;}}
      if(nt.kept&&u>=1.25)lit++;
    });
    g.days.forEach(function(d){if(!back&&!label&&!chip&&t>=d.t0&&t<d.t1)label='works on its tasks';d.marks.forEach(function(m,j){var ta=d.t0+(0.12+0.2*j)*(d.t1-d.t0), on=back?0:sm(sg(t,ta,ta+0.15)), nr=d.next, rd=nr?sm(sg(t,nr.t0+0.1,nr.t0+0.6)):0;
      m.setAttribute('opacity',(on*(1-0.6*rd)*off).toFixed(3));});});
    g.ws.forEach(function(w,j){var on=j<Math.min(3,lit)||j===blink;w.classList.toggle('e',on);w.style.opacity=j===blink?(0.45+0.55*(0.5+0.5*Math.sin(t*16))).toFixed(3):'1';});
    g.nl.textContent=label;g.nl.setAttribute('opacity',label&&g.words?'1':'0');
    if(chip){g.oct.textContent=chip;g.oc.classList.toggle('k',chip==='kept');var cw=chip==='kept'?g.wk:g.ww;g.ocr.setAttribute('width',cw);g.oc.setAttribute('transform',left?'translate('+(-(2*g.cx0+cw)).toFixed(1)+' 0)':'');g.oc.setAttribute('opacity','1');}else g.oc.setAttribute('opacity','0');
  }
  function doorRun(){
    var el=$('#su-door'); if(!el) return;
    window.__suDoor=function(t){DR.hold=t;doorAt(t);};   /* for a still at time t */
    if(reduced||!hasIO||!window.requestAnimationFrame){DR.still=DR.stillT||9.6;doorAt(DR.still);return;}
    var last=0;
    function frame(now){if(!DR.vis||DR.hold!=null){DR.raf=0;return;}
      if(last)DR.t=(DR.t+Math.min(0.1,(now-last)/1000))%DR.T;last=now;doorAt(DR.t);DR.raf=requestAnimationFrame(frame);}
    new IntersectionObserver(function(es){var v=es[0].isIntersecting;if(v===DR.vis)return;DR.vis=v;if(v&&!DR.raf){last=0;DR.raf=requestAnimationFrame(frame);}},{threshold:0.05}).observe(el);
  }


  /* ---------- Finding 02: the five measures as bars that rise, each pair side by side ---------- */
  function barsFig(){
    var el=$('#ch-bars'); if(!el||!el.clientWidth) return;
    var W=Math.round(el.clientWidth), M=D.headline.main, F={}, Lv=D.levels;D.headline.further.forEach(function(f){F[f.id]=f;});
    var dl=function(c,u){return S.minus(c.text)+u;};
    var MAIN={t:'More tasks completed',s:'of a task’s episodes',u:M.unchanged,e:M.edited,un:'%',ci:Lv.completed,main:1,chip:dl(M.change,' points')};
    var SIDE=[{t:'Sooner',s:'completed within 40 steps',u:F.within.unchanged,e:F.within.edited,un:'%',chip:dl(F.within.change,' points')},
              {t:'Fewer steps',s:'steps an episode',u:F.steps.unchanged,e:F.steps.edited,un:'',chip:dl(F.steps.change,' steps')},
              {t:'Fewer wasted',s:'steps without an action',u:F.noaction.unchanged,e:F.noaction.edited,un:'%',chip:dl(F.noaction.change,' points')},
              {t:'Fewer tokens',s:'tokens an episode',u:F.tokens.unchanged,e:F.tokens.edited,un:'k',chip:dl(F.tokens.change,'k')}];
    var wide=W>=900, four=W>=560, o='', H;
    var defs='<defs><linearGradient id="brU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ice)"/><stop offset="1" stop-color="var(--ice-l)"/></linearGradient>'+
      '<linearGradient id="brE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--mint)"/><stop offset="1" stop-color="var(--mint-l)"/></linearGradient></defs>';
    /* one pair of bars, everything centred on cx; its floor at bot, its tallest bar hm high */
    function pair(p,cx,y,w,bot,hm,k){
      var big=!!p.main, up=p.e.value>p.u.value, d=big?0.1:0.45+k*0.2, mx=Math.max(p.u.value,p.e.value);
      var bw=Math.min(34,(w-40)/3.2), g=18, xu=cx-g/2-bw, xe=cx+g/2;
      var hu=p.u.value/mx*hm, he=p.e.value/mx*hm, yu=bot-hu, ye=bot-he, r=5;
      if(big)o+=rect(cx-w/2+6,y,w-12,bot+72-y,18,'br-hl fade',S.D_(0.05));
      o+=tx(cx,y+30,p.t,'sl-t'+(big?' br-tm':''),'middle')+tx(cx,y+49,p.s,'sl-s','middle');
      o+=rect(xu,yu,bw,hu,r,'br-u growy',S.D_(d));
      o+='<g class="br-glow">'+rect(xe,ye,bw,he,r,'br-e growy',S.D_(d+0.55))+'</g>';
      var lift=0;
      if(p.ci){lift=11;[['unchanged',xu,'u'],['edited',xe,'e']].forEach(function(a){var iv=p.ci[a[0]].interval, c=a[1]+bw/2, y1=bot-iv[0]/mx*hm, y2=bot-iv[1]/mx*hm;
        o+=line(c,y1,c,y2,'lv-ci '+a[2]+' fade',S.D_(d+1.6))+line(c-5,y1,c+5,y1,'lv-ci '+a[2]+' fade',S.D_(d+1.6))+line(c-5,y2,c+5,y2,'lv-ci '+a[2]+' fade',S.D_(d+1.6));});}
      o+=line(xu-14,bot,xe+bw+14,bot,'br-base');
      o+=tx(xu+bw/2-2,yu-9-lift,p.u.text+p.un,'br-vu fade','end',S.D_(d+0.5));
      o+=tx(xe+bw/2+2,Math.min(ye,yu)-9-lift,p.e.text+p.un,'br-ve fade','start',S.D_(d+1.45));
      o+=tx(xu+bw/2+4,bot+20,'unchanged','br-x u','end')+tx(xe+bw/2-4,bot+20,'edited','br-x e','start');
      var ct=p.chip+(big?'  ·  p < 10⁻⁴':''), cwid=Math.ceil(tw(ct,13.5,600))+26;
      o+='<g class="pop"'+S.D_(d+1.8)+'>'+rect(cx-cwid/2,bot+34,cwid,26,13,'br-chip'+(big?' m':''))+tx(cx,bot+51.5,ct,'br-chip-t'+(big?' m':''),'middle')+'</g>';
    }
    var hm=150, ph=hm+96+78;
    if(wide){var cw5=W/5, ORD=[SIDE[0],SIDE[1],MAIN,SIDE[2],SIDE[3]];H=ph;
      ORD.forEach(function(p,j){pair(p,cw5*(j+0.5),0,cw5,ph-78,hm,j);});}
    else if(four){var cwm=Math.min(W,300);pair(MAIN,W/2,0,cwm,ph-78,hm,0);
      var cw4=W/4;for(var j=0;j<4;j++)pair(SIDE[j],cw4*(j+0.5),ph+20,cw4,ph+20+ph-78,hm,j+1);H=2*ph+20;}
    else{pair(MAIN,W/2,0,Math.min(W,260),ph-78,hm,0);
      var cw2=W/2;for(var q=0;q<4;q++){var yy=ph+16+Math.floor(q/2)*(ph+12);pair(SIDE[q],cw2*((q%2)+0.5),yy,cw2,yy+ph-78,hm,q+1);}H=3*ph+16+12;}
    el.innerHTML=svg(W,H,o,defs);if(S.setLens)S.setLens(el);
  }

  /* ---------- the running lead, drawn as it is earned: one clock of 48 episodes for the three curves ---------- */
  var LD={parts:[],t:1,raf:0,vis:false,t0:0};
  function leadFig(){
    var el=$('#ch-lead'); if(!el||!el.clientWidth) return;
    var W=Math.round(el.clientWidth), A=D.ahead, n=A.curves.length, wide=W>=760, gap=38, pw=wide?(W-gap*(n-1))/n:W, ph=wide?286:258, o='';
    var x0=A.x[0], x1=A.x[A.x.length-1];
    var cfg={wasted_steps:{t:'The saved steps add up',s:'steps without an action, a task’s running total',ax:[-150,0,50],k:'',u:'steps'},
             tokens:{t:'So do the tokens',s:'tokens generated, a task’s running total',ax:[-60,0,20],k:'k',u:'tokens'},
             tasks_completed:{t:'And the tasks it completes',s:'episodes completed, a task’s running total',ax:[0,2,1],k:'',u:'episodes'}};
    var defs='<defs><linearGradient id="ldS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--ice-e)"/><stop offset=".45" stop-color="var(--mint-e)"/><stop offset="1" stop-color="var(--mint-e)"/></linearGradient>';
    LD.parts=[];
    A.curves.forEach(function(c,k){var g=cfg[c.id], ox=wide?k*(pw+gap):0, oy=wide?0:k*(ph+22), padL=46, padR=74, top=oy+62, bot=oy+ph-42;
      var lo=Math.min(g.ax[0],Math.min.apply(null,c.lo)), hi=Math.max(g.ax[1],Math.max.apply(null,c.hi)), sp=hi-lo;lo-=sp*0.05;hi+=sp*0.05;
      var X=function(x){return ox+padL+(x-x0)/(x1-x0)*(pw-padL-padR);}, Y=function(v){return bot-(v-lo)/(hi-lo)*(bot-top);}, last=c.y.length-1;
      var ln=A.x.map(function(x,i){return (i?'L':'M')+R(X(x))+' '+R(Y(c.y[i]));}).join('');
      var bd=A.x.map(function(x,i){return (i?'L':'M')+R(X(x))+' '+R(Y(c.hi[i]));}).join('');for(var bi=last;bi>=0;bi--)bd+='L'+R(X(A.x[bi]))+' '+R(Y(c.lo[bi]));
      var ar=ln+'L'+R(X(x1))+' '+R(Y(0))+'L'+R(X(x0))+' '+R(Y(0))+'Z', down=c.y[last]<0;
      defs+='<clipPath id="ldC'+k+'"><rect x="'+R(X(x0)-4)+'" y="'+R(top-14)+'" width="0" height="'+R(bot-top+30)+'"/></clipPath>'+
        '<linearGradient id="ldA'+k+'" x1="0" y1="'+(down?0:1)+'" x2="0" y2="'+(down?1:0)+'"><stop offset="0" stop-color="var(--mint-e)" stop-opacity="0"/><stop offset="1" stop-color="var(--mint-e)" stop-opacity=".26"/></linearGradient>';
      o+=tx(ox,oy+17,g.t,'sl-t')+tx(ox,oy+35,g.s,'sl-s');
      o+=line(ox+padL,top-8,ox+padL,bot+6,'ld-ax')+line(ox+padL,bot+6,X(x1)+6,bot+6,'ld-ax');
      for(var v=g.ax[0];v<=g.ax[1]+1e-6;v+=g.ax[2]){var yy=Y(v);o+=line(ox+padL-4,yy,ox+padL,yy,'ld-tk')+tx(ox+padL-8,yy+4,(v<0?'−':'')+Math.abs(v)+(v===0?'':g.k),'sl-n','end');}
      [0,12,24,36,48].forEach(function(xx){o+=line(X(xx),bot+6,X(xx),bot+10,'ld-tk')+tx(X(xx),bot+24,String(xx),'sl-n','middle');});
      o+=tx((ox+padL+X(x1))/2,bot+40,'episodes of a task, in order','sl-s','middle');
      o+=line(ox+padL,Y(0),X(x1)+6,Y(0),'ld-zero');
      o+='<g clip-path="url(#ldC'+k+')"><path class="ld-band" d="'+bd+'Z"/><path d="'+ar+'" fill="url(#ldA'+k+')"/><path class="ld-l" stroke="url(#ldS)" d="'+ln+'"/></g>';
      o+='<line class="ld-scan" x1="0" y1="'+R(top-10)+'" x2="0" y2="'+R(bot+6)+'"/><circle class="ld-halo" r="13"/><circle class="ld-dot" r="6.5"/>';
      var endv=c.id==='tokens'?'−'+Math.abs(Math.round(c.y[last]))+'k':c.id==='wasted_steps'?'−'+Math.abs(Math.round(c.y[last])):'+'+(Math.round(c.y[last]*10)/10);
      var ey=Y(c.y[last]);
      o+=tx(X(x1)+15,ey+3,endv,'ld-end','start')+tx(X(x1)+15,ey+20,g.u,'ld-endu','start');
      LD.parts.push({k:k,X:X,Y:Y,y:c.y,x0:x0,x1:x1,top:top,bot:bot});
    });
    el.innerHTML='<p class="ld-count" aria-hidden="true">after <b>48</b> of its 48 episodes</p>'+svg(W,wide?ph:n*(ph+22)-22,o,defs+'</defs>');
    LD.el=el;LD.clips=$$('clipPath rect',el);LD.scan=$$('.ld-scan',el);LD.halo=$$('.ld-halo',el);LD.dot=$$('.ld-dot',el);LD.end=$$('.ld-end',el);LD.endu=$$('.ld-endu',el);LD.cnt=$('.ld-count b',el);
    leadDraw(LD.t);
  }
  function leadDraw(u){   /* u: 0 at the first episode, 1 at the last */
    if(!LD.el) return; LD.t=u;
    LD.parts.forEach(function(p,i){var e=p.x0+(p.x1-p.x0)*u, i0=Math.floor(e), i1=Math.min(p.y.length-1,i0+1), fr=e-i0, yv=p.y[i0]+(p.y[i1]-p.y[i0])*fr, px=p.X(e), py=p.Y(yv);
      LD.clips[i].setAttribute('width',R(px-p.X(p.x0)+4));
      LD.scan[i].setAttribute('x1',R(px));LD.scan[i].setAttribute('x2',R(px));LD.scan[i].style.opacity=u>=1?0:0.7;
      LD.halo[i].setAttribute('cx',R(px));LD.halo[i].setAttribute('cy',R(py));LD.halo[i].setAttribute('r',R(13+3*Math.sin(u*40)));
      LD.dot[i].setAttribute('cx',R(px));LD.dot[i].setAttribute('cy',R(py));
      LD.end[i].style.opacity=u>=1?1:0;LD.endu[i].style.opacity=u>=1?1:0;});
    if(LD.cnt)LD.cnt.textContent=String(Math.round(48*u));
  }
  function leadRun(){
    var el=$('#ch-lead'); if(!el) return;
    if(reduced||!hasIO){leadDraw(1);return;}
    var RUN=6400, HOLD=4200;
    function frame(now){LD.raf=0;if(!LD.vis)return;if(!LD.t0)LD.t0=now;var ms=now-LD.t0;
      if(ms>RUN+HOLD){LD.t0=now;ms=0;}
      var u=Math.min(1,ms/RUN);u=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      leadDraw(ms>=RUN?1:u);LD.raf=requestAnimationFrame(frame);}
    new IntersectionObserver(function(es){var v=es[0].isIntersecting&&es[0].intersectionRatio>=0.25;if(v===LD.vis)return;LD.vis=v;
      if(v){LD.t0=0;if(!LD.raf)LD.raf=requestAnimationFrame(frame);}else if(LD.raf){cancelAnimationFrame(LD.raf);LD.raf=0;}},{threshold:[0,0.25]}).observe(el);
  }

  function all(){try{barsFig();leadFig();}catch(e){if(window.console)console.error('f02',e);}try{rowsBuild();}catch(e){if(window.console)console.error('rows',e);}try{door();}catch(e){if(window.console)console.error('door',e);}}
  try{mets();}catch(e){if(window.console)console.error('mets',e);}
  all();rowsRun();doorRun();leadRun();
  var lastW=window.innerWidth, rt=0;
  window.addEventListener('resize',function(){if(Math.abs(window.innerWidth-lastW)<24)return;clearTimeout(rt);rt=setTimeout(function(){lastW=window.innerWidth;all();},180);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(all);
})();
