<style>
/* Self-upgrading page: only what the shared design system (selfrw/style.html) does not already provide.
   Colours are the paper's, named by role: EDIT the agent after its own edit, UNCH the unchanged agent,
   WASTE a step without an action, READ a read of its hidden states. Sizes come from the shared tokens only. */
:root{
  --mint:#BFE5CB; --mint-e:#3F9068; --mint-t:#27664A; --mint-l:#EAF6EE; --mint-hl:#D3F0DC;
  --ice:#DADDF7; --ice-e:#6F7BC0; --ice-t:#434E94; --ice-l:#EDEFFA;
  --rose:#F7DADF; --rose-e:#C4788E; --rose-t:#8C4459; --rose-l:#FAEDEF;
  --peach:#F7DADF; --peach-e:#C4788E; --peach-t:#8C4459; --peach-l:#FAEDEF;
  --lav:#EADCF5; --lav-e:#9A6FC0; --lav-t:#643F8A; --lav-l:#F4EDFA;
  --su-waste-bar:#F0C0CB; --su-waste-bar-e:#C4788E;
  --su-again:#97A0D2; --su-again-e:#6F7BC0;
  --su-take:#D3ECF3; --su-take-e:#4E9DB5;
  --su-look:#ECE7DC; --su-look-e:#6C624A;
  --su-put:#3F9068; --su-put-e:#27664A;
  --su-open-e:#8791A0;
  --su-sun:#FBE8AE; --su-sun-e:#D2A645;
  --su-night:#2B3550; --su-night-e:#2B3550; --su-on-night:#FFFFFF;
}
body.dark-mode{
  --mint:#2B6348; --mint-e:#82CFA9; --mint-t:#BCEBD6; --mint-l:#162920; --mint-hl:#24543C;
  --ice:#2B3463; --ice-e:#828DCF; --ice-t:#BFC5E8; --ice-l:#161929;
  --rose:#632B3C; --rose-e:#CF8298; --rose-t:#E7C0CC; --rose-l:#29161C;
  --peach:#632B3C; --peach-e:#CF8298; --peach-t:#E7C0CC; --peach-l:#29161C;
  --lav:#492B63; --lav-e:#AB82CF; --lav-t:#D3BFE8; --lav-l:#201629;
  --su-waste-bar:#81374C; --su-waste-bar-e:#D3889E;
  --su-again:#4F5DB0; --su-again-e:#8E99D7;
  --su-take:#2A5765; --su-take-e:#80BED0;
  --su-look:#534C3B; --su-look-e:#BBAF95;
  --su-put:#60BE8F; --su-put-e:#B3E6CC;
  --su-open-e:#7C8695;
  --su-night:#2B3550; --su-night-e:#828DCF; --su-on-night:#FFFFFF;
}
.su-k-edit,.k-edit{--k:var(--mint);--ke:var(--mint-e);--kt:var(--mint-t);--kl:var(--mint-l)}
.su-k-unch,.k-unch{--k:var(--ice);--ke:var(--ice-e);--kt:var(--ice-t);--kl:var(--ice-l)}
.su-k-waste{--k:var(--rose);--ke:var(--rose-e);--kt:var(--rose-t);--kl:var(--rose-l)}
.su-k-read{--k:var(--lav);--ke:var(--lav-e);--kt:var(--lav-t);--kl:var(--lav-l)}

/* hero */
.stage-steps li:nth-child(1){--sc:var(--ice-e)}.stage-steps li:nth-child(2){--sc:var(--lav-e)}.stage-steps li:nth-child(3){--sc:var(--mint-e)}.stage-steps li:nth-child(4){--sc:var(--mint-e)}
.su-hero h1{white-space:normal}
/* headings break evenly, no word left alone on a last line; an inequality is not split */
.scene h2,.scene h3,.scene h4,.su-sz h4,.su-fold h3,.su-st h4{text-wrap:balance}
.nw{white-space:nowrap}
.su-cap-gap{margin-bottom:36px}
@media(max-width:560px),(min-width:761px) and (max-width:1023px){pre.su-mono.su-code{white-space:pre;overflow-x:auto;overflow-wrap:normal}}
#horizon .belief,#horizon .cap{max-width:600px}
.su-claim{margin:14px auto 0;max-width:34em;font-size:clamp(1.05rem,.9rem + .62vw,1.34rem);line-height:1.4;color:var(--body);text-wrap:balance}
.su-claim b{font-weight:600;color:var(--ink)}
.su-claim .nb{white-space:nowrap}
.su-logos{gap:8px 18px;max-width:1000px;margin-left:auto;margin-right:auto}
.su-logos img{height:22px}
.su-logos .su-br{flex-basis:100%;height:0;padding:0;margin:0}
.su-stage{max-width:860px}
.su-fine{font-size:var(--t-fine);line-height:1.5;color:var(--muted);margin-top:12px}
@media(min-width:601px){.hero .cta .btn{min-width:128px}}
@media(min-width:701px) and (max-height:860px){.su-logos{margin-top:10px}.su-logos img{height:20px}}
@media(max-width:900px){.su-logos .su-br{display:none}}
@media(max-width:700px){.su-fine{text-align:left}}
/* on a phone the names and the marks take less room, so the figure comes up; in dark the white plates do not add a row */
@media(max-width:600px){.su-hero .byline{font-size:15px;line-height:1.6}.su-logos{gap:6px 12px}.su-logos img{height:18px}.su-logos span{font-size:13px}.dark-mode .su-logos img{padding:2px 4px}}
@media(min-width:601px){.dark-mode .su-logos img{margin:-3px 0}}

/* at a glance */
.say + .cards,.say + .su-glance{margin-top:var(--sp-fig)}
.su-glance{grid-template-columns:repeat(4,minmax(0,1fr))}
.su-creed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--gap);margin-top:30px}
.su-creed li{border-top:1px solid var(--hair);padding:16px 0 0}
.su-creed b{display:block;font-weight:600;font-size:var(--t-card);line-height:1.25;color:var(--ink)}
.su-creed li > span{display:block;font-size:var(--t-label);line-height:1.5;color:var(--muted);margin-top:6px}
@media(max-width:1000px){.su-glance{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.su-glance{grid-template-columns:1fr}.su-creed{grid-template-columns:1fr}.su-creed li{padding-bottom:14px}}
.gl-wall rect{fill:var(--ice);stroke:var(--ice-e);stroke-width:1}
.gl-one{fill:var(--ice);stroke:var(--ice-e);stroke-width:1}
.gl-moon{fill:var(--su-night);stroke:var(--su-night-e);stroke-width:1}
.gl-nt{fill:none;stroke:var(--su-night);stroke-width:1.6}
body.dark-mode .gl-nt{stroke:var(--su-night-e)}
.gl-nt.gl-kept{fill:var(--mint);stroke:var(--mint-e)}
.gl-tick{fill:none;stroke:var(--mint-t);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gl-sz{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.4}
.gl-sz.gl-big{fill:var(--mint);stroke:var(--mint-e)}
.gl-strips .b-u{fill:var(--ice);stroke:var(--ice-e);stroke-width:.8}
.gl-strips .b-w{fill:var(--su-waste-bar);stroke:var(--su-waste-bar-e);stroke-width:.8}
.gl-strips .b-e{fill:var(--mint);stroke:var(--mint-e);stroke-width:.8}
.gl-strips .lim{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
@keyframes suTurn{0%,30%{fill:var(--ice);stroke:var(--ice-e)}45%,85%{fill:var(--mint);stroke:var(--mint-e)}100%{fill:var(--ice);stroke:var(--ice-e)}}
@keyframes suFade{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes suKept{0%,25%{fill:none}40%,85%{fill:var(--mint)}100%{fill:none}}
@keyframes suDraw{0%{stroke-dashoffset:24}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
@keyframes suGrowX{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes suBig{0%,30%{fill:var(--ice);stroke:var(--ice-e)}45%,85%{fill:var(--mint);stroke:var(--mint-e)}100%{fill:var(--ice);stroke:var(--ice-e)}}
.gl-big{fill:var(--mint)}
body:not(.no-anim) .gl-one{animation:suTurn 4.6s ease-in-out infinite}
body:not(.no-anim) .gl-moon{animation:suFade 4.6s ease-in-out infinite}
body:not(.no-anim) .gl-tick{stroke-dasharray:24;animation:suDraw 4.6s ease-in-out infinite}
body:not(.no-anim) .gl-sz.gl-big{animation:suBig 4.6s ease-in-out infinite}
body:not(.no-anim) .gl-strips .grow-l{transform-box:fill-box;transform-origin:left center;animation:suGrowX 4.6s ease-in-out infinite}
body.no-anim .gl-one{fill:var(--mint);stroke:var(--mint-e)}
#glance-cards.paused .gl-one,#glance-cards.paused .gl-moon,#glance-cards.paused .gl-tick,#glance-cards.paused .gl-sz,#glance-cards.paused .grow-l{animation-play-state:paused}

/* shared bits of the figures */
.su-task{font-size:var(--t-body);line-height:1.45;color:var(--ink);margin-bottom:14px;overflow-wrap:anywhere}
.su-task > span{display:block;font-size:var(--t-label);color:var(--muted);margin-bottom:4px}
.su-row-lab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;font-size:var(--t-label);line-height:1.4;margin-top:6px}
.su-row-lab > b{font-weight:600;color:var(--kt)}
.su-row-lab > span{color:var(--muted);font-variant-numeric:tabular-nums}
.su-row-lab > span b{color:var(--rose-t);font-weight:700}
.su-counter{min-width:12em;text-align:right}
.su-mono{font-family:var(--mono);font-size:var(--t-fine);line-height:1.6;color:var(--body);background:var(--code-bg);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.su-ftitle{font-size:var(--t-label);line-height:1.45;font-weight:600;color:var(--ink);margin-bottom:10px}
.su-ftitle span{display:block;font-weight:400;color:var(--muted)}
.su-body{font-size:var(--t-body);line-height:1.6;color:var(--body);max-width:44em;margin-top:var(--sp-fig)}
.su-ic{font-family:var(--mono);color:var(--ink)}
.ch .t-rose{fill:var(--rose-t)}
.ch .t-edit{fill:var(--mint-t)}
.ch .t-unch{fill:var(--ice-t)}
.ch .w6{font-weight:600}
.ch .lim{stroke:var(--faint);stroke-width:1;stroke-dasharray:4 4}
.ch .zero{stroke:var(--faint);stroke-width:1}
.ch .ax{stroke:var(--hair);stroke-width:1}
.sb-waste{fill:var(--su-waste-bar);stroke:var(--su-waste-bar-e);stroke-width:.8}
.sb-none{fill:url(#su-hatch);stroke:var(--su-open-e);stroke-width:.8}
.sb-new{fill:var(--ice);stroke:var(--ice-e);stroke-width:.8}
.sb-again{fill:var(--su-again);stroke:var(--su-again-e);stroke-width:.8}
.sb-open{fill:var(--card);stroke:var(--su-open-e);stroke-width:.8}
.sb-take{fill:var(--su-take);stroke:var(--su-take-e);stroke-width:.8}
.sb-tool{fill:var(--lav);stroke:var(--lav-e);stroke-width:.8}
.sb-put{fill:var(--su-put);stroke:var(--su-put-e);stroke-width:.8}
.sb-look{fill:var(--su-look);stroke:var(--su-look-e);stroke-width:.8}
.su-hatch-l{stroke:var(--su-open-e);stroke-width:.8}
.su-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:var(--t-fine);color:var(--muted)}
.su-key span{display:inline-flex;align-items:center;gap:6px}
.su-key i{display:inline-block;width:10px;height:12px;border-radius:2px;border:1px solid var(--ke,var(--hair));background:var(--k,var(--card))}

/* by day: one episode of the unchanged agent */
.su-ep1 .ch{margin-top:6px}
.su-cut{display:grid;grid-template-columns:minmax(0,1fr);margin-top:16px;max-width:640px;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.su-cut.on,.no-anim .su-cut{opacity:1;transform:none}
.su-cut-lab{font-size:var(--t-label);font-weight:600;color:var(--rose-t);margin-bottom:6px}
.su-cut .su-mono{border-left:3px solid var(--rose-e)}
.su-cut-say{font-size:var(--t-label);color:var(--rose-t);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:8px}
.su-caret{display:inline-block;width:.55em;height:1.05em;background:var(--rose-e);animation:blink 1s steps(2) infinite}
.paused .su-caret{animation-play-state:paused}
.su-end{font-size:var(--t-label);font-weight:600;color:var(--ink);margin-top:14px;opacity:0;transition:opacity .6s ease}
.su-end.on,.no-anim .su-end{opacity:1}
.su-habit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px 44px;align-items:start}
@media(max-width:760px){.su-habit{grid-template-columns:1fr}}

/* at night: Fig. 1 on its plate */
#idea .nots{margin-top:24px}
#idea .nots li::before{border-color:var(--ice-e);background:linear-gradient(135deg,transparent 43%,var(--ice-e) 43%,var(--ice-e) 57%,transparent 57%)}

/* the four stations of the night */
.su-wipe{fill:var(--card);transform-box:fill-box;transform-origin:center bottom}
.anim.in .su-wipe{transform:scaleY(0);transition:transform 1.8s cubic-bezier(.4,0,.2,1) .2s}
.no-anim .su-wipe{display:none}
.su-night{margin-top:var(--sp-fig);border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);position:relative;overflow:hidden}
.sn-stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sn-rail{display:none}
.su-st{position:relative;padding:24px 26px 22px;min-width:0;transition:opacity .5s ease}
.su-st:nth-child(even){border-left:1px solid var(--rule)}
.su-st:nth-child(n+3){border-top:1px solid var(--rule)}
.su-st::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--sc);transform:scaleX(0);transform-origin:left;transition:transform .8s ease}
.su-st.on::before,.no-anim .su-st::before{transform:none}
.su-st:nth-child(1),.sn-step:nth-child(1){--sc:var(--rose-e);--sc-l:var(--rose-l);--sc-t:var(--rose-t)}.su-st:nth-child(2),.sn-step:nth-child(2){--sc:var(--lav-e);--sc-l:var(--lav-l);--sc-t:var(--lav-t)}.su-st:nth-child(3),.sn-step:nth-child(3){--sc:var(--ice-e);--sc-l:var(--ice-l);--sc-t:var(--ice-t)}.su-st:nth-child(4),.sn-step:nth-child(4){--sc:var(--mint-e);--sc-l:var(--mint-l);--sc-t:var(--mint-t)}
.su-live .su-st:not(.on){opacity:.38}
.su-st-k{font-size:var(--t-label);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.su-st-k::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--sc)}
.su-st h4{font-size:var(--t-card);line-height:1.25;font-weight:600;color:var(--ink);margin:6px 0 14px}
.su-st-n{font-size:var(--t-fine);line-height:1.5;color:var(--muted);margin-top:10px}
.su-q{font-size:var(--t-label);line-height:1.5;color:var(--ink);border-left:2px solid var(--rose-e);padding-left:10px;margin-top:12px}
.su-formula{font-family:var(--sans);font-size:var(--t-body);font-weight:600;color:var(--mint-t);letter-spacing:.01em}
.su-night:not(.sn-live) .su-formula{margin-top:16px}
#su-st-rec b{display:inline-block;min-width:2.7em;text-align:right;font-variant-numeric:tabular-nums}
.su-code{margin-top:12px;border-left:3px solid var(--mint-e);white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.su-big-say{font-size:var(--t-body);line-height:1.45;color:var(--ink)}
.su-big-say b{color:var(--mint-t);font-weight:700;font-variant-numeric:tabular-nums}
.su-exits{margin-top:16px;display:grid;gap:8px}
.su-st-loop{margin-top:12px;display:inline-flex;gap:6px;align-items:baseline;font-size:var(--t-fine);line-height:1.45;color:var(--muted);border:1px dashed var(--hair);border-radius:12px;padding:5px 11px}
.su-st-loop::before{content:'\21BA';color:var(--lav-e);font-weight:600}
.su-st-loop b{color:var(--ink);font-weight:600}
.su-exits li{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:12px;padding:8px 12px;font-size:var(--t-label);color:var(--muted);line-height:1.35;transition:opacity .5s,border-color .5s,background .5s}
.su-exits li b{color:var(--ink);font-weight:600}
.su-exits .su-ex-y{border-color:var(--mint-e);background:var(--mint-l)}
.su-exits .su-ex-y b{color:var(--mint-t)}
.sn-live .su-st:not(.done) .su-ex-y{background:none;border-color:var(--hair)}
.sn-live .su-st:not(.done) .su-ex-y b{color:var(--ink)}
@media(max-width:760px){.sn-stages{grid-template-columns:1fr}.su-st:nth-child(even){border-left:0}.su-st + .su-st{border-top:1px solid var(--rule)}.su-st{padding:20px 18px}}

/* the night in its own words: eight cards in two columns */
.su-ncards{margin-top:var(--sp-fig);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.su-ncol{display:grid;gap:12px;align-content:start;min-width:0}
.su-ncol-h{font-size:var(--t-label);font-weight:600;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--hair)}
.su-nc{border:1px solid var(--rule);border-radius:16px;background:var(--card);padding:14px 16px 14px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;opacity:0;transform:translateY(8px);transition:opacity .5s ease var(--d,0s),transform .5s ease var(--d,0s)}
.su-ncards.in .su-nc,.no-anim .su-nc{opacity:1;transform:none}
.su-nc .n{grid-row:span 3;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:var(--t-label);font-weight:700;background:var(--k);border:1px solid var(--ke);color:var(--kt)}
.su-nc h5{font-size:var(--t-body);font-weight:600;color:var(--ink);line-height:1.3;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px}
.su-nc h5 span{font-size:var(--t-fine);font-weight:400;color:var(--faint)}
.su-nc blockquote{font-size:var(--t-label);line-height:1.5;color:var(--body);margin-top:2px}
.su-badges{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.su-badge{position:relative;font-size:var(--t-fine);line-height:1.35;color:var(--kt);background:var(--kl);border:1px solid var(--ke);border-radius:8px;padding:4px 9px;overflow:hidden;font-variant-numeric:tabular-nums}
.su-badge i{position:absolute;left:0;bottom:0;height:2px;background:var(--ke);width:var(--w,0);transform:scaleX(0);transform-origin:left;transition:transform .9s ease calc(var(--d,0s) + .3s)}
.su-ncards.in .su-badge i,.no-anim .su-badge i{transform:none}
@media(max-width:820px){.su-ncards{grid-template-columns:1fr}}

/* one tensor */
.su-tensor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 40px;align-items:center}
.su-tensor-say p{font-size:var(--t-body);line-height:1.5;color:var(--body)}
.su-tensor-say p + p{margin-top:10px}
.su-tensor-say b{color:var(--ink);font-weight:600}
.wl-c{fill:var(--ice);stroke:none}
.wl-one{fill:var(--mint-e);stroke:var(--mint-t);stroke-width:1}
.wl-ring{fill:none;stroke:var(--mint-e);stroke-width:1.5}
@media(max-width:760px){.su-tensor{grid-template-columns:1fr}}

/* the ledger of the four nights */
.su-ledger{padding:22px 24px}
.lg-head{font-size:var(--t-fine);fill:var(--muted)}
.lg-read{fill:var(--lav);stroke:var(--lav-e);stroke-width:1}
.lg-for{fill:var(--mint);stroke:var(--mint-e);stroke-width:1}
.lg-against{fill:var(--su-waste-bar);stroke:var(--rose-e);stroke-width:1}
.lg-within{fill:var(--card);stroke:var(--faint);stroke-width:1}
.lg-c{font-size:10px;font-weight:600;fill:var(--ink)}
.ch .lg-c.b{font-size:12px}
.su-key i.su-key-c{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;font-style:normal;font-size:9px;font-weight:600;line-height:1;color:var(--ink);border-color:var(--faint);background:var(--card)}
.lg-ci{stroke:var(--ice-e);stroke-width:2;stroke-linecap:round}
.lg-dot{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.4}
.lg-ci.k{stroke:var(--mint-e)}
.lg-dot.k{fill:var(--mint);stroke:var(--mint-e)}
.lg-pill{fill:var(--card);stroke:var(--hair);stroke-width:1}
.lg-pill.k{fill:var(--mint);stroke:var(--mint-e)}
.lg-row{stroke:var(--rule);stroke-width:1}
.su-instr{margin-top:var(--sp-fig)}
.su-instr .card h3{font-size:var(--t-card)}

/* the six nights that withdrew */
.su-wcards{margin-top:var(--sp-fig);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.su-wc{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:18px 20px 16px;display:flex;flex-direction:column;min-width:0}
.su-wc h4{font-size:var(--t-body);font-weight:600;color:var(--ink);line-height:1.3}

.su-fold{margin-top:20px}

/* finding 01: the pair, the steps, the cards, the measures */
.su-pair .ch{margin-top:4px}
.su-steps{margin-top:18px;max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:12px;background:var(--bg)}

.su-steps tbody{counter-reset:su-step}

.su-cases .ba svg{display:block;width:100%;height:auto;margin:4px 0 2px}

.su-results{padding:24px 28px}

/* finding 04: four sizes as cards */
.su-sizes{margin-top:var(--sp-fig);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch}
.su-sz{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:20px 20px 18px;display:flex;flex-direction:column;min-width:0}

/* 1951 to 2026: the paper's epigraph and what the paper shows, on one line of years */
.su-era{margin-top:var(--sp-scene);padding-top:clamp(30px,3.6vw,44px);border-top:1px solid var(--rule)}
.su-era .eyebrow{margin-bottom:22px}
/* 1951, the run of the years, 2026: top to bottom, in the order the page is read */
.su-era-then{margin:0;max-width:46em}
.su-era-yr{font-size:var(--t-h2);font-weight:600;letter-spacing:-.012em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ice-t)}
.su-era-yr.now{color:var(--mint-t)}
.su-era-then blockquote{margin:14px 0 0;font-size:var(--t-lead);line-height:1.55;color:var(--body);font-style:italic}
.su-era-then figcaption{font-size:var(--t-label);line-height:1.5;color:var(--muted);margin-top:.85em}
.su-era-then figcaption cite{font-style:italic}
.su-run{margin:clamp(40px,5vw,60px) 0 clamp(36px,4.6vw,56px)}
.su-run-track{position:relative;height:34px;margin-top:22px}
.su-run-track::before{content:'';position:absolute;left:0;right:0;top:16px;height:2px;border-radius:1px;background:var(--hair)}
.su-run-fill{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ice-e),var(--mint-e));transform-origin:left center}
.su-run-stop{position:absolute;left:var(--x);top:10px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--faint);transition:background .3s ease}
.su-run-stop.hit{background:var(--mint-e)}
.su-run-dot{position:absolute;left:100%;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--mint-e);box-shadow:0 0 0 5px var(--bg,#fff)}
.su-run-now{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:var(--t-label);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;transition:opacity .3s ease}
.su-run-now.l{transform:translateX(-8px)}
.su-run-now.r{transform:translateX(calc(-100% + 8px))}
.su-run-lab{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:var(--t-label);line-height:1.4;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
