<script>
(function(){
  /* Figures of the self-upgrading page. Every value is read from the data block (#su-data); charts are drawn at the
     width of their box so SVG text keeps the page's type sizes, and each animates once when it enters the view. */
  var src=document.getElementById('su-data'); if(!src) return;
  var D=JSON.parse(src.textContent);
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasIO='IntersectionObserver' in window;
  if(reduced||!hasIO)document.body.classList.add('no-anim');
  var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
  function R(v){return Math.round(v*10)/10;}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  /* the agent's words as the paper typesets them: one kind of apostrophe, quotes inside its words as single quotes */
  function aq(s){return esc(String(s).replace(/"([^"]*)"/g,'\u2018$1\u2019').replace(/'/g,'\u2019'));}
  function minus(s){return String(s).replace(/(^|[\s(=:·,])-(?=\d)/g,'$1−');}
  function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function D_(v){return ' style="--d:'+v.toFixed(2)+'s"';}
  function tx(x,y,s,cls,anc,extra){return '<text x="'+R(x)+'" y="'+R(y)+'"'+(cls?' class="'+cls+'"':'')+(anc&&anc!=='start'?' text-anchor="'+anc+'"':'')+(extra||'')+'>'+s+'</text>';}
  function rect(x,y,w,h,r,cls,extra){return '<rect'+(cls?' class="'+cls+'"':'')+' x="'+R(x)+'" y="'+R(y)+'" width="'+R(Math.max(0,w))+'" height="'+R(Math.max(0,h))+'" rx="'+R(Math.max(0,r||0))+'"'+(extra||'')+'/>';}
  function line(x1,y1,x2,y2,cls,extra){return '<line class="'+cls+'" x1="'+R(x1)+'" y1="'+R(y1)+'" x2="'+R(x2)+'" y2="'+R(y2)+'"'+(extra||'')+'/>';}
  function svg(W,H,inner,defs){return '<svg viewBox="0 0 '+Math.round(W)+' '+Math.round(H)+'" width="'+Math.round(W)+'" height="'+Math.round(H)+'">'+(defs||'')+inner+'</svg>';}
  function setLens(root){$$('.draw',root).forEach(function(p){try{p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2);}catch(e){}});}
  var mctx=document.createElement('canvas').getContext('2d');
  function px(cls){var p=document.createElement('span');p.className=cls;p.style.position='absolute';p.style.visibility='hidden';document.body.appendChild(p);var v=parseFloat(getComputedStyle(p).fontSize);p.remove();return v;}
  var FS={label:14,fine:13};
  function tw(s,size,weight){mctx.font=(weight||400)+' '+size+'px '+getComputedStyle(document.body).fontFamily;return mctx.measureText(s).width;}
  var HATCH='<defs><pattern id="su-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="su-hatch-l" x1="0" y1="0" x2="0" y2="4"/></pattern></defs>';
  var KIND=D.kinds;

  /* ---------- an episode strip: one bar a step, height = tokens of the reply against the limit ---------- */
  function strip(steps,W,h,opt){
    opt=opt||{};var n=opt.n||D.setting.steps_limit, lim=D.setting.token_limit, gap=W/n>5?1.2:0.6, bw=W/n-gap, o='', top=opt.top||0;
    if(opt.limit!==false)o+=line(0,top,W,top,'lim');
    steps.forEach(function(s,i){
      var k=s.kind, hh=Math.max(0.16,Math.min(1,s.tokens/lim))*h, x=i*(bw+gap);
      o+=rect(x,top+h-hh,bw,hh,Math.min(1.5,bw/3),'sb-'+k+(opt.anim?' growy':''),opt.anim?D_((opt.d0||0)+i*(opt.dt||0.07)):'');
    });
    return o;
  }
  function kindsKey(list){
    var seen={};list.forEach(function(k){seen[k]=1;});
    var order=['waste','none','new','again','open','take','tool','put','look'], cls={waste:'su-k-waste',new:'su-k-unch',again:'',open:'',take:'',tool:'su-k-read',put:'su-k-edit',look:'',none:''};
    var var_={waste:['--su-waste-bar','--su-waste-bar-e'],none:['--card','--su-open-e'],new:['--ice','--ice-e'],again:['--su-again','--su-again-e'],open:['--card','--su-open-e'],take:['--su-take','--su-take-e'],tool:['--lav','--lav-e'],put:['--su-put','--su-put-e'],look:['--su-look','--su-look-e']};
    return '<p class="su-key" aria-hidden="true">'+order.filter(function(k){return seen[k];}).map(function(k){
      return '<span><i style="--k:var('+var_[k][0]+');--ke:var('+var_[k][1]+')'+(KIND[k].hatched?';background:repeating-linear-gradient(45deg,var(--card) 0 2px,var(--su-open-e) 2px 3px)':'')+'"></i>'+esc(KIND[k].label.replace(/ \(([^)]*)\)/,', $1'))+'</span>';}).join('')+'<span><i style="height:0;width:14px;border:0;border-top:1px dashed var(--faint);border-radius:0;background:none"></i>the limit of '+D.setting.token_limit+' tokens</span></p>';
  }

  /* ---------- at a glance: the glyph of two strips ---------- */
  function glanceStrips(){
    var el=$('.gl-strips'); if(!el) return;
    var A=D.alarm, o='', w=172, x0=14, n=A.unchanged.step_list.length, bw=w/n;
    o+=line(x0,16,x0+w,16,'lim');
    A.unchanged.step_list.forEach(function(s,i){var h=Math.max(0.16,s.tokens/512)*30;o+=rect(x0+i*bw,46-h,bw-0.6,h,0.6,s.kind==='waste'?'b-w':'b-u');});
    o+='<g class="grow-l">';A.edited.step_list.forEach(function(s,i){var h=Math.max(0.16,s.tokens/512)*30;o+=rect(x0+i*bw,84-h,bw-0.6,h,0.6,'b-e');});o+='</g>';
    o+=line(x0,54,x0+w,54,'lim');
    el.innerHTML=o;
  }

  /* ---------- by day: one episode of the unchanged agent ---------- */
  function ep1(el){
    var W=Math.round(el.clientWidth), H=W<500?118:150, A=D.alarm.unchanged, o='';
    o+=strip(A.step_list,W,H-24,{anim:true,dt:0.075,top:6});
    o+=tx(0,H-2,'step 1','sm');o+=tx(W,H-2,'step '+A.steps,'sm','end');
    o+=tx(W,0,'','sm','end');
    el.innerHTML=svg(W,H,o,HATCH);
    var k=$('#su-ep1 .su-key');if(k)k.remove();
    el.insertAdjacentHTML('afterend',kindsKey(A.step_list.map(function(s){return s.kind;})));
  }
  function ep1Run(){
    var box=$('#su-ep1'), cnt=$('#su-ep1-n'), cut=$('#su-ep1 .su-cut'), end=$('#su-ep1-end'), rep=$('#su-ep1-reply'), A=D.alarm;
    if(!box)return;
    var RE=A.reply_ends.unchanged;
    if(rep)rep.textContent=(RE.abridged_at_start?'… ':'')+RE.lines.join('\n');
    var steps=A.unchanged.step_list, total=steps.filter(function(s){return s.action==='none';}).length;
    if(reduced||!hasIO){if(cnt)cnt.textContent=total;cut&&cut.classList.add('on');end&&end.classList.add('on');return;}
    var done=false;
    new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting||done||e.intersectionRatio<0.3)return;done=true;
      var t0=performance.now(), dt=75;
      (function tick(now){var i=Math.min(steps.length,Math.floor((now-t0)/dt)), c=0;for(var j=0;j<i;j++)if(steps[j].action==='none')c++;
        if(cnt)cnt.textContent=c; if(i>=A.part_at&&cut)cut.classList.add('on');
        if(i<steps.length)requestAnimationFrame(tick);else{end&&end.classList.add('on');}})(t0);
    });},{threshold:[0,0.3]}).observe(box);
  }

  /* ---------- by day: the habit, the unchanged agent alone ---------- */
  function share(el){
    var W=Math.round(el.clientWidth), H=84, v=parseFloat(D.habit.share), o='', bh=26;
    o+=rect(0,10,W,bh,6,'sb-new');
    o+=rect(0,10,W*v/100,bh,6,'sb-waste grow',D_(0.2));
    o+=tx(0,10+bh+28,D.habit.share+'%','big t-rose fade','start',D_(0.9));
    o+=tx(tw(D.habit.share+'%',19,600)+10,10+bh+27,'of its steps: a reply cut at the token limit','sm fade','start',D_(1.0));
    el.innerHTML=svg(W,H,o);
  }
  function runs(el){
    var W=Math.round(el.clientWidth), H=170, N=D.habit.next, v=N.unchanged, labs=N.in_a_row_before, o='', n=v.length;
    var top=26, base=H-36, bw=Math.min(54,(W-(n-1)*10)/n), gap=(W-n*bw)/(n-1);
    o+=line(0,base,W,base,'ax');
    v.forEach(function(p,i){var h=(base-top)*p/100, x=i*(bw+gap);
      o+=rect(x,base-h,bw,h,4,'sb-waste growy',D_(0.15+i*0.12));
      o+=tx(x+bw/2,base+18,esc(labs[i]),'sm','middle');
    });
    o+=tx(0,H-2,'wasted steps in a row just before','sm');
    el.innerHTML=svg(W,H,o);
  }

  /* ---------- at night: the record it read, its tests ---------- */
  function record(el){
    var W=Math.round(el.clientWidth), M=D.kept.marks, cols=D.setting.steps_limit, cw=W/cols, rh=W<300?1.5:W>=460?(el.closest('.sn-live')?2.3:3.1):1.8, H=Math.ceil(M.length*rh)+2, a='', x='';
    M.forEach(function(s,r){for(var i=0;i<s.length;i++){var d='M'+R(i*cw)+' '+R(r*rh)+'h'+R(cw-0.5)+'v'+R(rh-0.3)+'h'+R(-(cw-0.5))+'z';if(s[i]==='x')x+=d;else a+=d;}});
    var o='<path class="sb-new" style="stroke:none" d="'+a+'"/><path class="sb-waste" style="stroke:none" d="'+x+'"/>';
    o+='<rect class="su-wipe" x="0" y="0" width="'+W+'" height="'+H+'"/>';
    el.innerHTML=svg(W,H,o);
    var c=D.kept.counts;
    $('#su-st-rec').innerHTML='<b>'+num(c.steps_without_action)+'</b> of the '+num(c.steps_of_those_episodes)+' steps of its '+c.opening_episodes+' opening episodes end without an action. One row an episode, one mark a step.';
    var f=D.kept.found.text, k=f.indexOf('the token limit.');
    $('#su-st-found').innerHTML='&ldquo;'+aq(k>0?f.slice(0,k+'the token limit.'.length):f)+'&rdquo;';
  }
  function tests(el){
    var W=Math.round(el.clientWidth), T=D.kept.tests, n=T.length, rowH=17, top=22, H=top+n*rowH+6, o='';
    var labW=W<380?118:170, mx=Math.max.apply(null,T.map(function(t){return Math.abs(t.change_points);})), z=W-14, sc=(z-labW-44)/mx;
    o+=tx(0,12,'layer, strength, episodes','sm');o+=tx(z,12,'0','sm','middle');
    o+=line(z,top-4,z,top+n*rowH,'zero');
    var dt=el.closest('.sn-live')?0.3:0.1;
    T.forEach(function(t,i){var cy=top+i*rowH+rowH/2, d=0.15+i*dt;
      o+=tx(0,cy+4.5,'layer '+t.layer+', '+minus(t.strength)+', '+t.episodes,'sm fade','start',D_(d));
      if(t.clear){var w=Math.abs(t.change_points)*sc;o+=rect(z-w,cy-5.5,w,11,3,'lg-for grow',D_(d)+' data-o="r"');o+=tx(z-w-6,cy+4.5,minus(t.printed),'sm t-edit w6 fade','end',D_(d+0.4));}
      else o+='<circle class="lg-within pop" cx="'+R(z)+'" cy="'+R(cy)+'" r="4.5"'+D_(d)+'/>';
    });
    el.innerHTML=svg(W,H,o);
    $$('rect[data-o]',el).forEach(function(r){r.style.transformOrigin='right center';});
  }
  function stationsText(){
    var u=D.kept.update;$('#su-st-formula').textContent=u.formula;$('#su-st-code').textContent=u.lines.join('\n');
    $('#su-st-where').innerHTML=esc('W is '+D.kept.tensor.words+'; u is a direction it read from its own hidden states. The component of that layer’s output along this single direction is multiplied by eleven, and nothing else in the network moves. In its code the strength is −10, in the convention of the helper it called, ')+'<span class="nw">W ← W − α u uᵀ W</span>.';
    var c=D.kept.confirmation;
    $('#su-st-conf').innerHTML='<b>'+minus(c.steps_without_action.printed)+' points</b> of steps without an action, edited against unchanged, on '+c.reserved_tasks+' practice tasks reserved from it all night.';
    var C=D.kept.cards, q=function(id,i){var e=$(id);if(e&&C[i]&&!C[i].words.own_word_for_tasks)e.innerHTML='&ldquo;'+aq(C[i].words.text)+'&rdquo;';};
    q('#sn-q-exam',3);q('#sn-q-conf',7);
    [['#sn-t0',0],['#sn-t2',3],['#sn-t3',7]].forEach(function(p){var e=$(p[0]);if(e&&C[p[1]])e.textContent=C[p[1]].turns;});
  }
  /* a number that counts up, and a text that is typed; the text keeps its full room from the start, so nothing moves */
  function countUp(el,to,ms,delay){if(!el)return;var id=(el._cu=(el._cu||0)+1), t0=performance.now()+(delay||0);
    (function tick(now){if(el._cu!==id)return;var p=Math.max(0,Math.min(1,(now-t0)/ms)), e=1-Math.pow(1-p,3);el.textContent=num(Math.round(to*e));if(p<1)requestAnimationFrame(tick);})(performance.now());}
  function typeInto(el,text,ms,delay,done){if(!el)return;var id=(el._ty=(el._ty||0)+1), t0=performance.now()+(delay||0);
    el.classList.remove('ty-done');el.classList.add('ty-on');el.innerHTML='<span class="ty-a"></span><span class="ty-rest"></span>';var a=el.firstChild, r=el.lastChild;r.textContent=text;
    (function tick(now){if(el._ty!==id)return;var k=Math.max(0,Math.min(text.length,Math.floor((now-t0)/ms*text.length)));a.textContent=text.slice(0,k);r.textContent=text.slice(k);
      if(k<text.length)requestAnimationFrame(tick);else{el.classList.add('ty-done');if(done)done();}})(performance.now());}

  /* the confirmation: a mark that leaves "no change" and settles at the measured change, with two standard errors */
  function conf(el){
    var W=Math.round(el.clientWidth), c=D.kept.confirmation.steps_without_action, v=parseFloat(c.printed), se=parseFloat(c.printed_se), H=172, o='', y=104;
    var z=W-40, x0=6, lim=Math.abs(v)+2*se+1.4, X=function(t){return z+t/lim*(z-x0);}, a=X(v-2*se), b=X(v+2*se);
    o+=line(x0,y,z,y,'ax');o+=line(z,y-44,z,y+16,'zero');
    o+=tx(z,y-54,'no change','sm','middle');o+=tx(z,y+34,'0','sm','middle');
    o+=rect(a,y-14,b-a,28,14,'cf-band fade',D_(1.45));
    o+=line(a,y,b,y,'cf-w fade',D_(1.45))+line(a,y-6,a,y+6,'cf-w fade',D_(1.45))+line(b,y-6,b,y+6,'cf-w fade',D_(1.45));
    o+='<g class="cf-slide" style="--dx:'+R(z-X(v))+'px;--d:0.30s"><circle class="cf-halo" cx="'+R(X(v))+'" cy="'+y+'" r="15"/><circle class="cf-dot" cx="'+R(X(v))+'" cy="'+y+'" r="7.5"/></g>';
    o+=tx(X(v),y-30,minus(c.printed),'cf-val fade','middle',D_(1.6));
    var cl='steps without an action, edited − unchanged, points';
    if(tw(cl,FS.fine,400)<z-x0-22)o+=tx(x0,y+34,cl,'sm');else{o+=tx(x0,y+34,'steps without an action,','sm');o+=tx(x0,y+51,'edited − unchanged, points','sm');H+=14;}
    el.innerHTML=svg(W,H,o);
  }

  /* one night, played: four stations, one at a time. A reader who asked for no motion gets the four side by side. */
  function nightPlayer(){
    var box=$('#su-stations');if(!box)return;var st=$$('.su-st',box), rail=$('.sn-rail',box);
    if(reduced||!hasIO||!rail){st.forEach(function(s){s.classList.add('on','done');});return;}
    var names=[['Diagnose','it reads its own record'],['Rewrite','one tensor, in code'],['Examine','against its unchanged self'],['Confirm','once, on reserved tasks']];
    rail.innerHTML=names.map(function(n,i){return '<button type="button" class="sn-step" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="t"><b>'+n[0]+'</b><small>'+n[1]+'</small></span><i></i></button>';}).join('')+'<button type="button" class="sn-play"></button>';
    box.classList.add('sn-live');build();      /* the stages now share one cell at full width: their charts are drawn at that width */
    var steps=$$('.sn-step',rail), play=$('.sn-play',rail), at=0, playing=true, vis=false, timer=0, late=0, DUR=[7000,7400,8200,7800];
    var ICON={pause:'<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>',play:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>'};
    var code=D.kept.update.lines.join('\n');
    function fx(i){clearTimeout(late);
      if(i===0)countUp($('#su-st-rec b'),D.kept.counts.steps_without_action,1500,500);
      if(i===1)typeInto($('#su-st-code'),code,2600,1100);
      if(i===3)late=setTimeout(function(){if(at===3)st[3].classList.add('done');},3300);}
    function mark(){play.innerHTML=playing?ICON.pause:ICON.play;play.setAttribute('aria-label',playing?'Pause the night':'Resume the night');}
    function run(){clearTimeout(timer);var u=$('i',steps[at]);u.style.transition='none';u.style.width='0';mark();
      if(!playing||!vis)return;
      void u.offsetWidth;u.style.transition='width '+DUR[at]+'ms linear';u.style.width='100%';
      timer=setTimeout(function(){show((at+1)%st.length);},DUR[at]);}
    function show(i){at=i;
      st.forEach(function(s,k){s.classList.toggle('cur',k===i);s.classList.remove('play','done');});
      steps.forEach(function(b,k){b.setAttribute('aria-current',k===i?'true':'false');b.classList.toggle('done',k<i);var u=$('i',b);u.style.transition='none';u.style.width='';});
      var s=st[i];$$('.anim',s).forEach(function(e){e.classList.remove('in');void e.offsetWidth;e.classList.add('in');e.dataset.seen=1;});
      void s.offsetWidth;s.classList.add('play');fx(i);run();}
    rail.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
      if(b===play){playing=!playing;if(playing)show(at);else run();return;}
      show(+b.getAttribute('data-i'));});
    show(0);
    new IntersectionObserver(function(es){var v=es[0].isIntersecting&&es[0].intersectionRatio>=0.2;if(v===vis)return;vis=v;if(vis)show(at);else run();},{threshold:[0,0.2]}).observe(box);
  }

  /* the step where the two part: both replies are written at the same pace against the same limit of tokens; one runs
     into the limit and is cut, the other ends in an action */
  function lens(){
    var box=$('#su-part');if(!box)return;var A=D.alarm, RE=A.reply_ends, lim=D.setting.token_limit, T=3600;
    var side=function(k,cls,name){var r=RE[k];return '<div class="'+cls+(r.cut?' cutside':'')+'" data-k="'+k+'"><b>'+name+', step '+A.part_at+'</b>'+
      '<p class="tk"><span class="tk-bar"><i></i></span><span class="tk-t"><span class="tk-n">'+r.tokens+'</span> of '+lim+' tokens</span></p>'+
      '<pre class="su-mono"></pre><p class="lp-end">'+(r.cut?'cut at the limit: no action':'it ends in an action')+'</p></div>';};
    box.innerHTML=side('unchanged','k-unch','unchanged agent')+side('edited','k-edit','after its own edit');
    var cards=$$('[data-k]',box);
    var full=function(r){return (r.abridged_at_start?'… ':'')+r.lines.join('\n');};
    var fin=function(c){var r=RE[c.getAttribute('data-k')], pre=$('pre',c), L=r.lines, last=L[L.length-1], act=/^<action>/.test(last);
      pre.classList.remove('ty-on');
      pre.innerHTML=esc((r.abridged_at_start?'… ':'')+L.slice(0,act?-1:L.length).join('\n'))+(act?'\n<span class="act">'+esc(last)+'</span>':'')+(r.cut?'<span class="cutmark">cut</span>':'');
      c.style.setProperty('--p',r.tokens/lim);$('.tk-n',c).textContent=r.tokens;c.classList.add('done');};
    if(reduced||!hasIO){cards.forEach(fin);return;}
    function playAll(){cards.forEach(function(c){var r=RE[c.getAttribute('data-k')], ms=T*r.tokens/lim, id=(c._run=(c._run||0)+1), t0=performance.now()+350, n=$('.tk-n',c);
      c.classList.remove('done');c.style.setProperty('--p',0);n.textContent='0';
      typeInto($('pre',c),full(r),ms,350,function(){if(c._run===id)fin(c);});
      (function tick(now){if(c._run!==id)return;var p=Math.max(0,Math.min(1,(now-t0)/ms));c.style.setProperty('--p',p*r.tokens/lim);n.textContent=Math.round(p*r.tokens);if(p<1)requestAnimationFrame(tick);})(performance.now());});}
    cards.forEach(function(c){$('pre',c).innerHTML='<span class="ty-rest">'+esc(full(RE[c.getAttribute('data-k')]))+'</span>';c.style.setProperty('--p',0);$('.tk-n',c).textContent='0';});
    var seen=false;
    new IntersectionObserver(function(es){var e=es[0];if(e.isIntersecting&&e.intersectionRatio>=0.5){if(!seen){seen=true;playAll();}}else if(!e.isIntersecting)seen=false;},{threshold:[0,0.5]}).observe(box);
    var rb=$('#su-lens-replay');if(rb)rb.addEventListener('click',playAll);
  }

  /* ---------- the night in its own words: eight cards ---------- */
  function glossFor(block){var cap=block.nextElementSibling;while(cap&&!cap.classList.contains('cap'))cap=cap.nextElementSibling;var g=cap&&cap.querySelector('[data-gloss]');return g&&g.textContent.trim()===D.gloss.trim();}
  function nightCards(){
    var box=$('#su-ncards');if(!box)return;var cols=$$('.su-ncol',box), hasGloss=glossFor(box);
    var kind={1:'su-k-waste',2:'su-k-unch',3:'su-k-read',4:'su-k-unch',5:'su-k-edit',6:'su-k-edit',7:'su-k-edit',8:'su-k-edit'};
    D.kept.cards.forEach(function(c,i){

<script>
/* 1951 to 2026: the years run along the line, as in the film. The dot
   stops at three years of the paper's own account of the work before it, then reaches 2026; there the 2026 answer comes up and the
   three phrases of 1951 take the colours of the three sentences set beside them. It runs again while the section is in view. */
(function(){
  var sec=document.getElementById('su-era'), run=document.getElementById('su-run'); if(!sec||!run) return;
  var fill=run.querySelector('.su-run-fill'), dot=run.querySelector('.su-run-dot'), now=run.querySelector('.su-run-now'), stops=run.querySelectorAll('.su-run-stop'), cap=run.querySelector('.su-run-cap');
  var A=1951, B=2026, K=[[0,1951],[1600,1995],[2600,1995],[3400,2016],[4400,2016],[4900,2023],[5900,2023],[6400,2026]], HOLD=4200, END=K[K.length-1][0];
  var STOPS=[1995,2016,2023], CAPS={1995:'1995 · Lifelong robot learning: a goal',2016:'2016 · Continual learning, trained from outside',2023:'2023 · Language-model agents, frozen weights',2026:'2026 · An embodied agent upgrades itself'};
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var spans={}; cap.innerHTML=''; [1995,2016,2023,2026].forEach(function(y){var s=document.createElement('span');s.textContent=CAPS[y];s.style.position='absolute';s.style.left='0';s.style.right='0';cap.appendChild(s);spans[y]=s;});
  cap.style.minHeight='3em';
  var lastY=A; dot.style.left='0';   /* the dot moves by a transform, so nothing is laid out again on a frame */
  function ease(u){return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}
  function yearAt(ms){if(ms<=0)return A;if(ms>=END)return B;for(var i=1;i<K.length;i++)if(ms<=K[i][0]){var u=(ms-K[i-1][0])/(K[i][0]-K[i-1][0]);return K[i-1][1]+(K[i][1]-K[i-1][1])*ease(u);}return B;}
  function draw(y){
    var p=(y-A)/(B-A); lastY=y; fill.style.transform='scaleX('+p+')'; dot.style.transform='translateX('+(p*dot.parentNode.clientWidth).toFixed(1)+'px)';
    now.textContent=String(Math.round(y)); now.classList.toggle('l',p<0.06); now.classList.toggle('r',p>0.94);
    now.style.opacity=(y<=A+0.01||y>=B-0.01)?'0':'1';   /* at either end the year stands under the line already */
    for(var i=0;i<stops.length;i++)stops[i].classList.toggle('hit',y>=STOPS[i]-0.01);
    var at=null; [1995,2016,2023,2026].forEach(function(s){if(Math.abs(y-s)<0.02)at=s;});
    for(var k in spans)spans[k].classList.toggle('on',+k===at);
    if(y>=B-0.01&&!sec.classList.contains('arrived')){sec.classList.add('arrived');sec.classList.add('lit');}
  }
  window.addEventListener('resize',function(){draw(lastY);});
  if(reduced||!('IntersectionObserver' in window)){draw(B);sec.classList.add('arrived','lit');return;}
  var t0=null, raf=0, vis=false;
  function tick(ts){ if(t0===null)t0=ts; var e=ts-t0; if(e>END+HOLD){t0=ts;e=0;} draw(yearAt(e)); if(vis)raf=requestAnimationFrame(tick); }
  draw(A);
  /* the answer of 2026 never stays dim: when it is on screen and the line is not, it lights at once */
  var nowEl=sec.querySelector('.su-era-now'), nowVis=false;
  function settle(){if(nowVis&&!vis)sec.classList.add('arrived','lit');}
  new IntersectionObserver(function(es){es.forEach(function(en){
    vis=en.isIntersecting; cancelAnimationFrame(raf); settle();
    if(vis){t0=null;raf=requestAnimationFrame(tick);}
  });},{threshold:0.25}).observe(run);
  if(nowEl)new IntersectionObserver(function(es){nowVis=es[0].isIntersecting;settle();},{threshold:0.5}).observe(nowEl);
})();
</script>
