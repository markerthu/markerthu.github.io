<script>
(function(){
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
  var hasIO='IntersectionObserver' in window, D=window.ACF_DATA||{};
  if(reduced||!hasIO) document.body.classList.add('no-anim');
  function clamp(x){return x<0?0:x>1?1:x;}
  function ease(x){x=clamp(x);return x*x*(3-2*x);}
  function seg(t,a,b){return clamp((t-a)/(b-a));}
  function f(v){return (+v).toFixed(1);}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function setLens(root){$$('.draw',root).forEach(function(p){try{p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2);}catch(e){}});}
  function mm(q){return !!(window.matchMedia&&window.matchMedia(q).matches);}

  /* in view: add .in; out of view: remove it, so the figure plays again on re-entry */
  var revIO=hasIO&&!reduced?new IntersectionObserver(function(es){es.forEach(function(e){
    var big=e.intersectionRect.height>window.innerHeight*0.32;
    if(e.isIntersecting&&(e.intersectionRatio>=0.25||big))e.target.classList.add('in');
    else if(!e.isIntersecting)e.target.classList.remove('in');
  });},{threshold:[0,0.25,0.5],rootMargin:'0px 0px -6% 0px'}):null;
  function watch(el){if(revIO)revIO.observe(el);else el.classList.add('in');}
  var pauseIO=hasIO?new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('paused',!e.isIntersecting);e.target.dispatchEvent(new CustomEvent('acf:vis',{detail:e.isIntersecting}));});},{threshold:0.05}):null;
  $$('.pausable').forEach(function(e){if(pauseIO){e.classList.add('paused');pauseIO.observe(e);}});

  /* a timeline that loops while its figure is on screen and starts over each time it comes back */
  var DBG=(location.search.match(/[?&]acft=([\d.]+)/)||[])[1];
  function loop(el,T,draw,FINAL){
    if(DBG){draw(+DBG);return;}
    if(reduced||!hasIO){draw(FINAL);return;}
    var vis=false,raf=0,start=0;
    function tick(now){raf=0;if(!vis||document.hidden)return;if(!start)start=now;var t=(now-start)/1000;if(t>=T){start=now;t=0;}draw(t);raf=requestAnimationFrame(tick);}
    draw(0);
    new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting&&!vis){vis=true;start=0;if(!raf)raf=requestAnimationFrame(tick);}
      else if(!e.isIntersecting){vis=false;}
    });},{threshold:0.2}).observe(el);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&vis&&!raf){raf=requestAnimationFrame(tick);}});
  }

  /* palette noise for the schematic denoising chains */
  var NOISE='';
  function noiseURL(){
    try{var n=document.createElement('canvas'),s=64;n.width=s;n.height=s;var c=n.getContext('2d'),d=c.createImageData(s,s),r=7;
      function rnd(){r=(r*1664525+1013904223)%4294967296;return r/4294967296;}
      var dark=document.body.classList.contains('dark-mode'), lo=dark?[34,40,50]:[205,212,222], hi=dark?[150,160,174]:[80,92,110];
      for(var i=0;i<s*s;i++){var u=(rnd()+rnd()+rnd())/3;d.data[i*4]=lo[0]+(hi[0]-lo[0])*u;d.data[i*4+1]=lo[1]+(hi[1]-lo[1])*u;d.data[i*4+2]=lo[2]+(hi[2]-lo[2])*u;d.data[i*4+3]=255;}
      c.putImageData(d,0,0);return n.toDataURL('image/png');}catch(e){return '';}
  }
  var SAMPLE='/images/projects/ac-flow/hero_sample.jpg', uid=0;
  function chainFrame(x,y,s,t,id){
    var cid='acfc'+(uid++);
    return '<g id="'+id+'"><clipPath id="'+cid+'"><rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(s)+'" height="'+f(s)+'" rx="7"/></clipPath>'+
      '<g clip-path="url(#'+cid+')"><image href="'+NOISE+'" x="'+f(x)+'" y="'+f(y)+'" width="'+f(s)+'" height="'+f(s)+'" preserveAspectRatio="none"/>'+
      '<image href="'+SAMPLE+'" x="'+f(x)+'" y="'+f(y)+'" width="'+f(s)+'" height="'+f(s)+'" opacity="'+Math.pow(t,0.9).toFixed(2)+'"/></g>'+
      '<rect class="fr" x="'+f(x)+'" y="'+f(y)+'" width="'+f(s)+'" height="'+f(s)+'" rx="7" fill="none"/></g>';
  }

  /* ---------- The problem: two panels ---------- */
  function problem(){
    var fig=$('#pb'); if(!fig) return;
    var hosts=$$('.cst-draw',fig); if(hosts.length!==2) return;
    var A=null,B=null;
    function buildA(){
      var host=hosts[0], W=Math.max(280,Math.min(520,Math.round(host.clientWidth))), n=W<380, N=n?5:6, H=246;
      var s=n?40:44, gap=(W-28-N*s)/(N-1), x0=14, y0=58, s1='', i;
      for(i=0;i<N;i++){var x=x0+i*(s+gap);s1+=chainFrame(x,y0,s,i/(N-1),'pa-f'+i);
        if(i<N-1)s1+='<path class="ln pa-a" d="M'+f(x+s+4)+','+f(y0+s/2)+' H'+f(x+s+gap-4)+'"/>';}
      var rx=x0+(N-1)*(s+gap)+s/2;
      s1+='<g class="pa-r"><rect class="bx" x="'+f(rx-34)+'" y="14" width="68" height="26" rx="13"/><text class="lb t" x="'+f(rx)+'" y="31" text-anchor="middle">reward</text><path class="ln" d="M'+f(rx)+',40 V'+(y0-3)+'"/></g>';
      var by=y0+s+86;
      s1+='<line class="base" x1="8" x2="'+(W-8)+'" y1="'+by+'" y2="'+by+'"/>';
      for(i=0;i<N;i++){var cx=x0+i*(s+gap)+s/2;s1+='<rect class="bar pa-b" x="'+f(cx-9)+'" y="'+(by-40)+'" width="18" height="40" rx="3"/>';}
      var wi=n?2:3, wx=x0+wi*(s+gap);
      s1+='<rect class="pa-w" x="'+f(wx-4)+'" y="'+(y0-4)+'" width="'+(s+8)+'" height="'+(s+8)+'" rx="10" fill="none" stroke="var(--peach-e)" stroke-width="2"/>';
      s1+='<text class="lb bad pa-wt" x="'+f(wx+s/2)+'" y="'+(y0+s+20)+'" text-anchor="middle">one step goes wrong</text>';
      s1+='<rect class="bar bd pa-wb" x="'+f(wx+s/2-9)+'" y="'+(by-40)+'" width="18" height="40" rx="3"/>';
      s1+='<text class="lb t pa-l" x="8" y="'+(by+20)+'">the same credit for every step</text>';
      s1+='<text class="lb pa-l2" x="8" y="'+(by+38)+'">'+(n?'the wrong step included':'including the step that went wrong')+'</text>';
      host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s1+'</svg>';
      var q=function(c){return $$(c,host);};
      return {N:N,frames:q('[id^=pa-f]'),arrows:q('.pa-a'),r:q('.pa-r')[0],bars:q('.pa-b'),w:q('.pa-w')[0],wt:q('.pa-wt')[0],wb:q('.pa-wb')[0],l:q('.pa-l')[0],l2:q('.pa-l2')[0],svg:q('svg')[0],W:W};
    }
    function buildB(){
      var host=hosts[1], W=Math.max(280,Math.min(520,Math.round(host.clientWidth))), n=W<380, H=246, s='';
      var cx1=n?56:84, cx2=W-(n?56:84), cy=64, r=n?28:30;
      s+='<path id="pb-top" class="ln" d="M'+(cx1+r*0.7)+','+(cy-r*0.7)+' Q'+(W/2)+','+(cy-r*2.1)+' '+(cx2-r*0.7)+','+(cy-r*0.7)+'"/>';
      s+='<path id="pb-bot" class="ln" d="M'+(cx2-r*0.7)+','+(cy+r*0.7)+' Q'+(W/2)+','+(cy+r*2.1)+' '+(cx1+r*0.7)+','+(cy+r*0.7)+'"/>';
      s+='<circle class="node cr" cx="'+cx1+'" cy="'+cy+'" r="'+r+'"/><text class="lb t" x="'+cx1+'" y="'+(cy+4)+'" text-anchor="middle">critic</text>';
      s+='<circle class="node" cx="'+cx2+'" cy="'+cy+'" r="'+r+'"/><text class="lb t" x="'+cx2+'" y="'+(cy+4)+'" text-anchor="middle">model</text>';
      s+='<text class="lb" x="'+(W/2)+'" y="'+(cy-r*1.45-6)+'" text-anchor="middle">its estimates</text><text class="lb" x="'+(W/2)+'" y="'+(cy+r*1.45+16)+'" text-anchor="middle">its own samples</text>';
      for(var k=0;k<3;k++)s+='<circle class="pulse pb-p" r="3"/>';
      var my=cy+r*2+30, mx0=14, mx1=W-14;
      s+='<text class="lb t" x="'+mx0+'" y="'+(my-8)+'">actor loss</text>';
      s+='<rect class="meter0" x="'+mx0+'" y="'+my+'" width="'+(mx1-mx0)+'" height="12" rx="6"/><rect class="meter pb-m" x="'+mx0+'" y="'+my+'" width="0" height="12" rx="6"/>';
      [0,4,8,12].forEach(function(e){var x=mx0+(mx1-mx0)*e/12.6;s+='<text class="lb" x="'+f(x)+'" y="'+(my+29)+'" text-anchor="'+(e===0?'start':'middle')+'">10<tspan dy="-5">'+e+'</tspan></text>';});
      var ts=n?36:40, ty=my+44, tx=W-14-3*ts-12;
      s+='<g class="pb-dogs"><text class="lb bad" x="14" y="'+(ty+ts/2-3)+'">its images</text><text class="lb" x="14" y="'+(ty+ts/2+14)+'">'+(n?'collapse':'collapse to one')+'</text>';for(k=0;k<3;k++){var dx=tx+k*(ts+6), cid='pbd'+k+(uid++);
        s+='<clipPath id="'+cid+'"><rect x="'+dx+'" y="'+ty+'" width="'+ts+'" height="'+ts+'" rx="6"/></clipPath><image clip-path="url(#'+cid+')" href="/images/projects/ac-flow/dog_vanilla_'+[1,3,5][k]+'.jpg" x="'+dx+'" y="'+ty+'" width="'+ts+'" height="'+ts+'"/>';}
      s+='</g>';
      host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s+'</svg>';
      var q=function(c){return $$(c,host);};
      return {top:q('#pb-top')[0],bot:q('#pb-bot')[0],p:q('.pb-p'),m:q('.pb-m')[0],mw:mx1-mx0,dogs:q('.pb-dogs')[0],svg:q('svg')[0],W:W};
    }
    function build(){NOISE=NOISE||noiseURL();A=buildA();B=buildB();}
    var T=10.5;
    function draw(t){
      if(!A||!B) return;
      var out=1-seg(t,T-0.6,T);
      A.svg.style.opacity=f(Math.min(seg(t,0,0.3),out));B.svg.style.opacity=A.svg.style.opacity;
      A.frames.forEach(function(g,i){g.style.opacity=f(ease(seg(t,0.2+i*0.25,0.5+i*0.25)));});
      A.arrows.forEach(function(g,i){g.style.opacity=f(seg(t,0.4+i*0.25,0.6+i*0.25)*0.8);});
      A.r.style.opacity=f(ease(seg(t,1.9,2.3)));
      A.bars.forEach(function(b,i){var u=ease(seg(t,2.5+(A.N-1-i)*0.15,3.0+(A.N-1-i)*0.15));b.style.transformBox='fill-box';b.style.transformOrigin='center bottom';b.style.transform='scaleY('+u.toFixed(3)+')';});
      A.l.style.opacity=f(seg(t,3.3,3.7));
      var w=seg(t,4.4,4.8);A.w.style.opacity=f(w);A.wt.style.opacity=f(w);A.wb.style.opacity=f(seg(t,5.2,5.6));A.l2.style.opacity=f(seg(t,5.4,5.8));
      /* B: the loop amplifies, the loss runs away, the samples collapse */
      var lap=seg(t,0.6,6.6)*3, k;
      B.p.forEach(function(p,i){var u=lap-i*0.33, on=u>0&&lap<3;if(!on){p.style.opacity='0';return;}
        var fr=u%1, path=fr<0.5?B.top:B.bot, L=path.getTotalLength(), pt=path.getPointAtLength(L*((fr%0.5)*2));
        p.setAttribute('cx',f(pt.x));p.setAttribute('cy',f(pt.y));p.setAttribute('r',(2.4+Math.min(3,u)*1.6).toFixed(1));p.style.opacity=f(0.55+0.15*Math.min(3,u));});
      B.m.setAttribute('width',f(B.mw*Math.min(1,ease(seg(t,0.8,6.6))*12/12.6)));
      B.dogs.style.opacity=f(ease(seg(t,6.4,7.0)));
    }
    build();
    loop(fig,T,draw,8.5);
    var lw=0;window.addEventListener('resize',function(){var w=hosts[0].clientWidth;if(Math.abs(w-lw)<20)return;lw=w;build();if(reduced||!hasIO)draw(8.5);});
    lw=hosts[0].clientWidth;
  }

  /* ---------- The idea: one weight per state ---------- */
  function idea(){
    var host=$('#gcw'); if(!host) return;
    var parts=null;
    function build(){
      NOISE=NOISE||noiseURL();
      var cw=host.clientWidth, n=cw<640, W=Math.round(Math.max(320,Math.min(cw,1060))), N=n?5:6;
      var lw=n?0:250, rowH=n?156:128, top=n?4:12, H=top+rowH*3+(n?2:8);
      var s='', i, r, s0=n?34:54, x0=lw+(n?6:24), x1=W-(n?6:20), gap=(x1-x0-N*s0)/(N-1);
      var rows=[['Reward-weighted','weight from the final reward'],['Advantage-weighted','weight from the reward, normalized in its group'],['AC-Flow','weight from the reward minus the critic’s value of each step']];
      var ADV=n?[0.25,-0.45,1,0.55,-0.25]:[0.2,0.62,-0.42,1,0.44,-0.22];
      function wrap(t,k){var out=[],line='';t.split(' ').forEach(function(w){if((line+' '+w).trim().length>k&&line){out.push(line);line=w;}else line=(line+' '+w).trim();});if(line)out.push(line);return out;}
      for(r=0;r<3;r++){
        var ry=top+r*rowH, ly=n?ry+20:ry+rowH/2-14, cy=n?ry+rowH-s0-12:ry+rowH/2-1, by=cy-16;
        s+='<g class="g-row" data-r="'+r+'">';
        if(r===2)s+='<rect class="row-bg" x="0" y="'+(ry+2)+'" width="'+W+'" height="'+(rowH-6)+'" rx="14"/>';
        s+='<text class="t-ink" x="'+(n?10:16)+'" y="'+ly+'">'+rows[r][0]+'</text>';
        wrap(rows[r][1],n?Math.floor((W-20)/7.2):34).forEach(function(l,k){s+='<text class="sm" x="'+(n?10:16)+'" y="'+(ly+19+k*17)+'">'+l+'</text>';});
        for(i=0;i<N;i++){var x=x0+i*(s0+gap);s+=chainFrame(x,cy,s0,i/(N-1),'g'+r+'f'+i);
          if(i<N-1)s+='<path class="lk" d="M'+f(x+s0+4)+','+f(cy+s0/2)+' H'+f(x+s0+gap-4)+'"/>';
          s+='<rect class="'+(r===2?'w-p':'w-u')+' g-w" data-i="'+i+'" x="'+f(x+s0/2-8)+'" y="'+f(by-22)+'" width="16" height="22" rx="3"/>';}
        s+='<line class="base" x1="'+f(x0-6)+'" x2="'+f(x1+4)+'" y1="'+f(by)+'" y2="'+f(by)+'"/>';
        if(r===2)s+='<rect class="scanl" x="0" y="'+f(by-34)+'" width="2" height="'+f(s0+46)+'" opacity="0"/>';
        s+='</g>';
      }
      host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Schematic. Three ways to weight a flow-matching update. Reward-weighted and advantage-weighted fine-tuning give every step of the denoising chain the same weight. AC-Flow gives each step its own weight, set by the reward minus the critic’s value of that step.">'+s+'</svg>';
      var g=$$('.g-row',host);
      parts={rows:g,bars:g.map(function(x){return $$('.g-w',x);}),frames:g.map(function(x){return $$('[id^=g]',x);}),scan:$('.scanl',host),N:N,x0:x0,s0:s0,gap:gap,ADV:ADV,by:g.map(function(x){var b=$('.g-w',x);return +b.getAttribute('y')+22;})};
    }
    var T=11;
    function draw(t){
      if(!parts) return;
      var out=1-seg(t,T-0.6,T), N=parts.N;
      parts.rows.forEach(function(g,r){
        var a=ease(seg(t,0.2+r*1.6,0.7+r*1.6));g.style.opacity=f(a*out);
        parts.bars[r].forEach(function(b,i){
          var y0=parts.by[r], hU=24, h=hU*ease(seg(t,0.6+r*1.6+i*0.06,1.1+r*1.6+i*0.06));
          if(r===2){var sc=-0.5+(N+0.3)*ease(seg(t,3.9,6.6)), c=ease(seg(sc-i,-0.2,0.5)), v=parts.ADV[i];
            h=(hU*(1-c)+Math.abs(v)*(v<0?24:40)*c)*ease(seg(t,3.5,3.9));
            var neg=v<0&&c>0.5;b.setAttribute('class',neg?'w-n g-w':'w-p g-w');
            b.setAttribute('y',f(neg?y0:y0-h));b.setAttribute('height',f(Math.max(1,h)));}
          else{b.setAttribute('y',f(y0-h));b.setAttribute('height',f(Math.max(1,h)));}
        });
      });
      var sc2=-0.5+(N+0.3)*ease(seg(t,3.9,6.6)), on=t>3.8&&t<6.8;
      parts.scan.setAttribute('x',f(parts.x0+Math.max(0,Math.min(N-1,sc2))*(parts.s0+parts.gap)+parts.s0/2-1));
      parts.scan.setAttribute('opacity',on?'0.55':'0');
    }
    build();
    loop(host,T,draw,9);
    var lw=host.clientWidth;window.addEventListener('resize',function(){var w=host.clientWidth;if(Math.abs(w-lw)<30)return;lw=w;build();if(reduced||!hasIO)draw(9);});
  }

  /* ---------- How it works: the training loop, one part at a time ---------- */
  function how(){
    var root=$('#hw'); if(!root) return;
    /* small illustrations, laid out for the width they get so their text stays full size */
    function ill1(W){var k=W/400,X=function(x){return (x*k).toFixed(1);},s='<svg viewBox="0 0 '+W+' 190"><text class="t-ink" x="0" y="20">raw rewards, one batch</text><line class="ax" x1="0" x2="'+W+'" y1="44" y2="44"/>';
      var raw=[34,72,96,150,182,268,352], out=raw.map(function(v){return 120+(v-34)/(352-34)*180;});
      raw.forEach(function(v,i){s+='<line class="ke" data-a style="--d:'+(0.5+i*0.06)+'s" x1="'+X(v)+'" y1="48" x2="'+X(out[i])+'" y2="140" stroke-opacity=".45"/><circle class="kd" data-a style="--d:'+(0.1+i*0.05)+'s" cx="'+X(v)+'" cy="44" r="6"/><circle class="kd" data-a style="--d:'+(0.9+i*0.05)+'s" cx="'+X(out[i])+'" cy="144" r="6"/>';});
      s+='<line class="ax" x1="'+X(120)+'" x2="'+X(300)+'" y1="144" y2="144"/><text data-a style="--d:1.1s" class="t-k" x="'+X(120)+'" y="172" text-anchor="middle">0</text><text data-a style="--d:1.1s" class="t-k" x="'+X(300)+'" y="172" text-anchor="middle">1</text><text data-a style="--d:1.2s" x="'+X(210)+'" y="172" text-anchor="middle">shaped</text></svg>';return s;}
    function ill2(W){var k=W/400,X=function(x){return (x*k).toFixed(1);},s='<svg viewBox="0 0 '+W+' 190"><rect class="kl gx" style="--d:.1s" x="0" y="22" width="'+X(170)+'" height="120" rx="8"/><line class="ax" x1="0" x2="'+W+'" y1="142" y2="142"/>';
      s+='<text class="t-k" data-a style="--d:.3s" x="10" y="42">warm-up</text><text data-a style="--d:.4s" x="10" y="60">critic learns</text><text class="t-ink" data-a style="--d:1.3s" x="'+X(186)+'" y="42">the critic steers</text>';
      s+='<path class="ke" data-a style="--d:.5s" d="M'+X(6)+',74 C'+X(50)+',80 '+X(70)+',118 '+X(118)+',124 S'+X(160)+',128 '+X(170)+',128 L'+X(398)+',128"/>';
      s+='<line class="dash" x1="'+X(170)+'" x2="'+X(170)+'" y1="16" y2="148"/><text x="0" y="166">0</text><text class="t-k" x="'+X(170)+'" y="166" text-anchor="middle">500</text><text x="'+W+'" y="166" text-anchor="end">steps</text><text data-a style="--d:.8s" x="'+W+'" y="120" text-anchor="end">critic error</text></svg>';return s;}
    function ill3(W){var s='<svg viewBox="0 0 '+W+' 190"><line class="ax" x1="0" x2="'+W+'" y1="100" y2="100"/>';
      var A=[0.4,1.45,-0.5,0.8,-1.55,0.3,1.1,-0.35], d=44, step=(W-60)/(A.length-1);
      s+='<line class="dash" data-a style="--d:.9s" x1="0" x2="'+W+'" y1="'+(100-d)+'" y2="'+(100-d)+'"/><line class="dash" data-a style="--d:.9s" x1="0" x2="'+W+'" y1="'+(100+d)+'" y2="'+(100+d)+'"/>';
      s+='<text class="t-k" data-a style="--d:1s" x="'+W+'" y="'+(100-d-8)+'" text-anchor="end">+δ</text><text class="t-k" data-a style="--d:1s" x="'+W+'" y="'+(100+d+20)+'" text-anchor="end">−δ</text>';
      A.forEach(function(a,i){var h=Math.min(Math.abs(a),1)*d, H=Math.abs(a)*d, x=(20+i*step).toFixed(1), up=a>=0;
        if(Math.abs(a)>1)s+='<rect class="cut" data-a style="--d:'+(0.2+i*0.06)+'s" x="'+(x-10)+'" y="'+(up?100-H:100+d)+'" width="20" height="'+(H-d)+'" rx="3"/>';
        s+='<rect class="kd gw" style="--d:'+(0.2+i*0.06)+'s;transform-origin:center '+(up?'bottom':'top')+'" x="'+(x-10)+'" y="'+(up?100-h:100)+'" width="20" height="'+h+'" rx="3"/>';});

      s+='<text x="'+(small?m.l:8)+'" y="'+(small?y-15:y+5)+'" class="'+(ours?'t-mint':'')+(small?' halo':'')+'">'+r[0]+'</text>';
      s+='<rect class="'+(ours?'bar-m':i===1?'bar-l':'bar-o')+' grow" style="--d:'+(0.1+i*0.08)+'s" x="'+m.l+'" y="'+(y-(small?7:9))+'" width="'+f(X(v)-m.l)+'" height="'+(small?14:18)+'" rx="4"/>';
      s+='<text class="'+(ours?'t-mint':'')+' fade halo" style="--d:'+(0.6+i*0.08)+'s" x="'+f(X(v)+8)+'" y="'+(y+5)+'">'+v+'</text>';});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px">'+s+'</svg>';
  }
  function charts(){
    var c;
    if((c=$('#ch-actor')))lossChart(c,'actor');
    if((c=$('#ch-value')))lossChart(c,'value');
    if((c=$('#ch-reward')))rewardChart(c);
    if((c=$('#ch-align')))alignChart(c);
    if((c=$('#ch-div')))divChart(c);
    if((c=$('#ch-time')))costChart(c,1,'h',36,[0,10,20,30]);
    if((c=$('#ch-mem')))costChart(c,2,'GB',52,[0,16,32,48],48);
  }

  /* ---------- Hard prompts: one prompt at a time ---------- */
  function compare(){
    var root=$('#cmp'); if(!root) return;
    var tabs=$$('.rp-tabs button',root), sets=$$('.cmp-set',root), qs=$$('.cmp-q p',root), bar=$('.rp-bar span',root), playBtn=$('.rp-play',root);
    var at=0, vis=!hasIO, auto=!reduced, timer=0, DUR=6500;
    function show(i){at=i;tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===i?'true':'false');});sets.forEach(function(s,k){s.classList.toggle('on',k===i);});qs.forEach(function(q,k){q.hidden=k!==i;});sched();}
    function sched(){clearTimeout(timer);if(!bar)return;bar.style.transition='none';bar.style.width='0';
      if(playBtn)playBtn.innerHTML=auto?'<svg viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>':'<svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg>';
      if(playBtn)playBtn.setAttribute('aria-label',auto?'Pause':'Play');
      if(!auto||!vis)return;void bar.offsetWidth;bar.style.transition='width '+DUR+'ms linear';bar.style.width='100%';timer=setTimeout(function(){show((at+1)%sets.length);},DUR);}
    tabs.forEach(function(t,k){t.addEventListener('click',function(){auto=false;show(k);});});
    if(playBtn)playBtn.addEventListener('click',function(){auto=!auto;sched();});
    root.addEventListener('acf:vis',function(e){var was=vis;vis=e.detail;if(vis&&!was&&auto)show(0);else sched();});
    show(0);
  }

  function boot(){
    problem();idea();how();charts();compare();
    $$('.reveal,.anim,.gal').forEach(watch);
    if(reduced||DBG)$$('.reveal,.anim,.gal').forEach(function(e){e.classList.add('in');});
    var fold=$('#find-div');
    if(fold)fold.addEventListener('toggle',function(){if(fold.open)divChart($('#ch-div'));});
    function cols(){return [960,860,820,700,560,480].map(function(b){return mm('(max-width:'+b+'px)');}).join();}
    var lastC=cols(), lastW=window.innerWidth, rt=0;
    window.addEventListener('resize',function(){var c=cols();if(Math.abs(window.innerWidth-lastW)<40&&c===lastC)return;clearTimeout(rt);rt=setTimeout(function(){lastW=window.innerWidth;lastC=c;charts();},180);});
    new MutationObserver(function(){var n=noiseURL();if(n&&n!==NOISE){NOISE=n;$$('image').forEach(function(im){var h=im.getAttribute('href')||'';if(h.indexOf('data:image/png')===0)im.setAttribute('href',NOISE);});}}).observe(document.body,{attributes:true,attributeFilter:['class']});
  }
  boot();
})();
</script>
