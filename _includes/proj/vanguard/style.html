<style>
/* Vanguard page: additions to the shared design system (selfrw/style.html). Colours and sizes only from its tokens.
   Ours (Vanguard) = the ice/navy family, the large target = peach, the small draft = lavender or an outline. */
.stage-steps li:nth-child(1){--sc:var(--lav-e)}
.stage-steps li:nth-child(2){--sc:var(--ice-e)}
.stage-steps li:nth-child(3){--sc:var(--ice-t)}
.stage-steps li:nth-child(4){--sc:var(--peach-e)}
/* hero note under the logos, the same on every page that has one */
.hero .note{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:10px;font-size:var(--t-fine);line-height:1.5;color:var(--muted)}
.hero .note sup{font-size:.8em;margin-right:2px}
@media(max-width:700px){.hero .note{justify-content:flex-start}}

/* at-a-glance illustrations */
.il-dr{fill:var(--card);stroke:var(--faint);stroke-width:1.5}
.il-tg{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.5}
.il-vg{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.5}
.il-fr{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.il-fr2{fill:var(--card);stroke:var(--hair);stroke-width:1.4}
.il-acc{fill:none;stroke:var(--ice-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.il-tick{fill:none;stroke:var(--ice-t);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.il-pt{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.4}
.il-pt.h{fill:var(--card)}
.il-fit{fill:none;stroke:var(--ice-e);stroke-width:1.6;stroke-dasharray:4 4}
.il-spd{fill:none;stroke:var(--ice-e);stroke-width:2;stroke-linecap:round}
.il-lv{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.5}

/* the problem: four judges */
.vg-judges{margin-top:var(--sp-fig)}
.vg-judges .card{display:flex;flex-direction:column}
.vg-ill{display:block;height:96px;margin:-4px 0 14px}
.vg-ill svg{display:block;height:100%;width:auto;max-width:100%;overflow:visible}
.vg-ill .ax{stroke:var(--hair);stroke-width:1.2}
.vg-ill text{font-family:var(--sans);font-size:var(--t-fine);fill:var(--muted)}
.vg-ill .tau{stroke:var(--ice-e);stroke-width:1.5;stroke-dasharray:4 3}
.vg-ill .t-ice{fill:var(--ice-t);font-weight:600}
.vg-ill .pk{fill:var(--peach);stroke:var(--peach-e);stroke-width:1}
.vg-ill .lv{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.2}
.vg-ill .lvl{fill:var(--lav-l);stroke:var(--lav-e);stroke-width:1.2}
.vg-ill .crv{fill:none;stroke:var(--peach-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vg-ill .box{fill:none;stroke:var(--hair);stroke-width:1.2;stroke-dasharray:4 3}
.vg-ill .scr{fill:var(--card);stroke:var(--hair);stroke-width:1.3}
.vg-ill .ln{stroke:var(--hair);stroke-width:3;stroke-linecap:round}
.vg-ill .btn{fill:var(--band);stroke:var(--hair);stroke-width:1.1}
.vg-ill .x{fill:none;stroke:var(--peach-t);stroke-width:2.2;stroke-linecap:round}
.vg-ill .q{fill:none;stroke:var(--peach-e);stroke-width:1.5;stroke-dasharray:3 3}
.vg-ill .dot3{fill:var(--hair)}

/* how it works: four steps */
.vg-pipe{margin-top:var(--sp-fig);border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);overflow:hidden}
.vg-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto auto auto}
.vp{position:relative;display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;padding:22px;min-width:0}
.vp + .vp{border-left:1px solid var(--rule)}
.vp::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--ke)}
.vp-n{display:flex;align-items:center;gap:10px;font-size:var(--t-card);font-weight:600;color:var(--ink);line-height:1.2}
.vp-n .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:var(--t-fine);font-weight:700;background:var(--k);border:1px solid var(--ke);color:var(--kt);flex:none}
.vp-fig{margin:18px 0 14px;align-self:center;min-width:0}
.vp-fig svg{display:block;width:100%;height:auto;overflow:visible}
.vp-fig text{font-family:var(--sans);font-size:var(--t-fine);fill:var(--muted)}
.vp-fig .t-ice{fill:var(--ice-t);font-weight:600}
.vp-fig .t-peach{fill:var(--peach-t);font-weight:600}
.vp-fig .t-lav{fill:var(--lav-t);font-weight:600}
.vp-fig .t-ink{fill:var(--ink);font-weight:600}
.vp-say{font-size:var(--t-label);line-height:1.5;color:var(--muted)}
.vp-num{font-size:var(--t-label);line-height:1.45;color:var(--body);margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);align-self:stretch}
.vp-num b{font-weight:700;color:var(--kt);font-variant-numeric:tabular-nums}
.vp-total{padding:16px 24px;border-top:1px solid var(--rule);font-size:var(--t-label);line-height:1.5;color:var(--muted)}
.vp-total b{color:var(--ice-t);font-weight:700}
.sv-lv{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.2}
.sv-lvl{fill:var(--lav-l);stroke:var(--lav-e);stroke-width:1.2}
.sv-ic{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.3}
.sv-icl{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1.3}
.sv-pk{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.2}
.sv-pkl{fill:var(--peach-l);stroke:var(--peach-e);stroke-width:1.2}
.sv-scr{fill:var(--card);stroke:var(--hair);stroke-width:1.2}
.sv-bar{fill:var(--band);stroke:var(--hair);stroke-width:1}
.sv-ln{stroke:var(--hair);stroke-width:3;stroke-linecap:round}
.sv-dot{fill:var(--hair)}
.sv-ar{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sv-ar.ice{stroke:var(--ice-e)}
.sv-ar.pk{stroke:var(--peach-e)}
.sv-tau{stroke:var(--ice-t);stroke-width:1.5;stroke-dasharray:4 3}
.sv-ok{fill:none;stroke:var(--ice-t);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sv-d{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1.8}

/* chart marks */
.ch .m-draft{fill:var(--card);stroke:var(--faint);stroke-width:1.6}
.ch .m-four{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.5}
.ch .m-tgt{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.5}
.ch .m-ours{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.8}
.ch .m-oth{fill:var(--hair);stroke:var(--faint);stroke-width:1.2}
.ch .lolli{stroke:var(--rule);stroke-width:2;stroke-linecap:round}
.ch .tgt-ln{stroke:var(--peach-e);stroke-width:1.6;stroke-dasharray:5 4}
.ch .t-ours{fill:var(--ice-t);font-weight:700}
.ch .t-tgt{fill:var(--peach-t);font-weight:600}
.ch .t-body{fill:var(--body)}
.ch .t-in{fill:var(--ice-t);font-weight:700}
.ch .arw{fill:none;stroke:var(--ice-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch .band-row{fill:var(--band)}
.ch .zero{stroke:var(--faint);stroke-width:1.2}
.ch .fit{fill:none;stroke:var(--ice-e);stroke-width:1.8;stroke-dasharray:6 5;opacity:.85}
.ch .f-ice{fill:var(--ice);stroke:var(--ice-e)}
.ch .f-mint{fill:var(--mint);stroke:var(--mint-e)}
.ch .f-lav{fill:var(--lav);stroke:var(--lav-e)}
.ch .f-rose{fill:var(--rose);stroke:var(--rose-e)}
.ch .f-peach{fill:var(--peach);stroke:var(--peach-e)}
.ch .hollow{fill:var(--card)}
.ch .pt{stroke-width:1.8}
.ch .spd{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1.2}
.ch .grp{fill:var(--ink);font-weight:600}
.ch .cell-on{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.5}
.ch .cell-off{fill:var(--card);stroke:var(--faint);stroke-width:1.5}
.anim .slide{transform:translateX(var(--dx));opacity:0}
.anim.in .slide{transform:none;opacity:1;transition:transform 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0s),opacity .3s ease var(--d,0s)}
.vg-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px 48px;align-items:start}
.vg-two>div{min-width:0}
.vg-key{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 6px;font-size:var(--t-label);color:var(--body)}
.vg-key span{display:inline-flex;align-items:center;gap:8px}
.vg-key i{flex:none;width:13px;height:13px;border-radius:3px;border:1.5px solid}
.vg-key .k-dr{background:var(--card);border-color:var(--faint)}
.vg-key .k-four{background:var(--lav);border-color:var(--lav-e)}
.vg-key .k-tg{background:var(--peach);border-color:var(--peach-e)}
.vg-key .k-vg{background:var(--ice);border-color:var(--ice-e)}
.vg-key .k-oth{background:var(--hair);border-color:var(--faint);border-radius:50%}
.vg-key svg,.fig .vg-key svg{flex:none;display:block;width:14px;height:14px;overflow:visible}
.vg-key + .vg-key{margin-top:-2px}
.vg-key + svg{margin-top:12px}
.vg-key .k-line{width:20px;height:0;border:0;border-top:2px dashed var(--peach-e);border-radius:0}

/* examples: the Mind2Web step and the BabyAI episode */
.vg-ex{margin-top:16px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:22px 26px 24px}
.vg-ex .bn{font-size:var(--t-label);font-weight:600;color:var(--muted)}
.vg-ex .bn span{font-weight:400}
.m2w{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.25fr);gap:22px 32px;align-items:center;margin-top:14px}
.m2w-scr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:30px 12px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--bg);position:relative}
.m2w-scr::before{content:'';position:absolute;left:12px;top:11px;width:30px;height:8px;background:radial-gradient(circle at 4px 4px,var(--hair) 3.5px,transparent 4px) 0 0/11px 8px repeat-x}
.m2w-scr span{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:6px 4px;border:1px solid var(--hair);border-radius:8px;background:var(--card);font-size:var(--t-fine);line-height:1.25;color:var(--body);text-align:center}
.m2w-scr span i{position:absolute;left:-8px;top:-8px;min-width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:var(--t-fine);font-weight:700;color:var(--card)}
.m2w-scr .g{border:2px solid var(--ice-e)}
.m2w-scr .g i{background:var(--ice-e)}
.m2w-scr .h{border:2px solid var(--lav-e)}
.m2w-scr .h i{background:var(--lav-e)}
.m2w-rows{display:grid;gap:8px}
.m2w-rows li{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,44%);gap:4px 16px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--ke);background:var(--kl);opacity:0;transform:translateY(8px)}
.m2w-rows .who{font-size:var(--t-label);font-weight:600;color:var(--kt)}
.m2w-rows .act{grid-column:1;font-size:var(--t-label);color:var(--body);line-height:1.4}
.m2w-rows .sc{grid-column:2;grid-row:1/3;display:grid;gap:6px;justify-items:start}
.m2w-rows .sc b{font-size:var(--t-label);font-weight:700;color:var(--kt);font-variant-numeric:tabular-nums}
.m2w-rows .trk{position:relative;width:100%;height:8px;border-radius:4px;background:var(--card);border:1px solid var(--rule)}
.m2w-rows .trk i{position:absolute;left:0;top:-1px;bottom:-1px;width:calc(var(--p)*100%);min-width:3px;border-radius:4px;background:var(--ke);transform:scaleX(0);transform-origin:left}
.m2w-rows .trk::after{content:'';position:absolute;left:50%;top:-5px;bottom:-5px;border-left:1.5px dashed var(--ice-t)}
.m2w-rows .r-tgt .sc b{color:var(--peach-t)}
.m2w.in .m2w-rows li,.no-anim .m2w-rows li{opacity:1;transform:none;transition:opacity .5s ease var(--d,0s),transform .5s ease var(--d,0s)}
.m2w.in .trk i,.no-anim .trk i{transform:none;transition:transform .9s cubic-bezier(.2,.7,.2,1) calc(var(--d,0s) + .35s)}
.k-ours{--k:var(--ice);--ke:var(--ice-e);--kt:var(--ice-t);--kl:var(--ice-l)}
.k-draft{--k:var(--lav);--ke:var(--lav-e);--kt:var(--lav-t);--kl:var(--lav-l)}
.k-tgt{--k:var(--peach);--ke:var(--peach-e);--kt:var(--peach-t);--kl:var(--peach-l)}
.k-plain{--k:var(--band);--ke:var(--hair);--kt:var(--body);--kl:var(--band)}

.bb{display:grid;grid-template-columns:1fr auto 1fr;gap:18px 30px;align-items:start;margin-top:14px}
.bb figure{margin:0;min-width:0}
.bb svg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;overflow:visible}
.bb figcaption{text-align:center;font-size:var(--t-label);line-height:1.45;margin-top:10px;color:var(--body)}
.bb figcaption b{display:block;font-weight:600}
.bb .lose b{color:var(--peach-t)}
.bb .win b{color:var(--ice-t)}
.bb-key{align-self:center;display:grid;gap:10px;font-size:var(--t-label);color:var(--body)}
.bb-key span{display:flex;align-items:center;gap:10px;white-space:nowrap}
.bb-key span::before{content:'';width:26px;height:4px;border-radius:2px;background:var(--ice-t)}
.bb-key .pk::before{background:var(--peach-e)}
.bb .wall{fill:none;stroke:var(--hair);stroke-width:3}
.bb .gl{stroke:var(--rule);stroke-width:1}
.bb .p-v{fill:none;stroke:var(--ice-t);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.bb .p-t{fill:none;stroke:var(--peach-e);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.bb .agent{fill:var(--ink)}
.bb .loop{fill:none;stroke:var(--peach-t);stroke-width:1.8;stroke-linecap:round}
.bb .goal{fill:none;stroke:var(--ice-t);stroke-width:2;stroke-dasharray:3 3}
.bb .goalbad{fill:none;stroke:var(--peach-t);stroke-width:2}
.bb.anim.in .bbp{transition:stroke-dashoffset var(--du,1s) cubic-bezier(.4,0,.2,1) var(--d,0s)}
body:not(.no-anim) .bb.in .spin{animation:vgSpin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vgSpin{to{transform:rotate(360deg)}}

/* why it matters */
.vg-why .vg-two{align-items:center}
/* closing call to action, left-aligned: a figure gap after cards, 22px after the belief line */
.cta.left{justify-content:flex-start;margin-top:var(--sp-fig)}
.belief + .cta.left{margin-top:22px}
#matters .belief{max-width:44em;font-weight:500}

@media(max-width:1099px){
  .vg-steps{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,auto)}
  .vp:nth-child(3){border-left:0}
  .vp:nth-child(n+3){border-top:1px solid var(--rule)}
}
@media(max-width:960px){
  .m2w{grid-template-columns:1fr}
  .m2w-scr{max-width:440px}
}
@media(max-width:900px){
  .vg-two{grid-template-columns:1fr;gap:34px}
  .bb{grid-template-columns:1fr 1fr}
  .bb-key{grid-column:1/-1;grid-row:1;display:flex;flex-wrap:wrap;gap:8px 22px}
}
@media(max-width:700px){
  .vp{padding:20px 18px}
  .vp-total{padding:14px 18px}
  .vg-ex{padding:18px 16px 20px}
  .m2w-rows li{grid-template-columns:1fr;padding:10px 12px}
  .m2w-rows .sc{grid-column:1;grid-row:auto;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;margin-top:4px}
  .m2w-scr{padding:28px 8px 10px;gap:6px}
  .m2w-scr span{min-height:40px}
}
@media(max-width:560px){
  .vg-steps{grid-template-columns:1fr;grid-template-rows:none}
  .vp{display:block;grid-row:auto}
  .vp + .vp{border-left:0;border-top:1px solid var(--rule)}
  .vp-fig{max-width:260px}
  .bb{gap:16px 14px}
  .bb figcaption{font-size:var(--t-fine)}
}
</style>
