<style>
/* TF-OPD page: additions to the shared design system (selfrw/style.html). Colours and sizes only from its tokens. */
.stage-steps li:nth-child(2){--sc:var(--peach-e)}
.stage-steps li:nth-child(3){--sc:var(--lav-e)}
.stage-steps li:nth-child(4){--sc:var(--mint-e)}
.tf-contrib{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:10px;font-size:var(--t-fine);color:var(--faint)}
.tf-contrib sup{font-size:.8em;margin-right:2px}

/* at-a-glance illustrations */
.il-db line{stroke:var(--hair);stroke-width:2}
.il-ln2 line{stroke:var(--ice-e);stroke-width:3;stroke-linecap:round}
.il-loop{fill:none;stroke:var(--peach-e);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.il-x{fill:none;stroke:var(--peach-t);stroke-width:2.2;stroke-linecap:round}
.il-ok{fill:none;stroke:var(--mint-t);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.il-sq.ok rect{fill:var(--mint);stroke:var(--mint-e);stroke-width:1.2}
.il-sq.no rect{fill:var(--peach-l);stroke:var(--peach-e);stroke-width:1.2}

/* the problem: three routes */
.tf-routes .pdm-stage{overflow:hidden}
.rt-draw{display:block;margin:10px 24px 12px;min-width:0}
.rt-draw svg{display:block;width:100%;height:auto;overflow:visible;transition:opacity .6s ease}
.rt-draw svg.pre{opacity:.32}
.rt-svg text{font-family:var(--sans)}
.rt-svg .lb{font-size:var(--t-fine);fill:var(--muted)}
.rt-svg .lb.op{font-size:var(--t-card);font-weight:500;fill:var(--faint)}
.rt-svg .t-ice{fill:var(--ice-t);font-weight:600}
.rt-svg .t-lav{fill:var(--lav-t);font-weight:600}
.rt-svg .t-peach{fill:var(--peach-t);font-weight:600}
.rt-svg .t-mint{fill:var(--mint-t);font-weight:600}
.rt-svg .ln-ice,.rt-svg .ln-lav,.rt-svg .ln-peach,.rt-svg .ln-mint{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rt-svg .thin{stroke-width:1.6}
.rt-svg .ln-ice{stroke:var(--ice-e)}
.rt-svg .ln-lav{stroke:var(--lav-e)}
.rt-svg .ln-peach{stroke:var(--peach-e)}
.rt-svg .ln-mint{stroke:var(--mint-e);stroke-width:1.6}
.rt-svg .ln-dash{fill:none;stroke:var(--peach-e);stroke-width:1.4;stroke-dasharray:3 4}
.rt-svg .bx-ice{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1.2}
.rt-svg .bx-lav{fill:var(--lav-l);stroke:var(--lav-e);stroke-width:1.2}
.rt-svg .halo{fill:none;stroke:var(--peach-e);stroke-width:2}
.rt-svg .arc-back{fill:none;stroke:var(--peach-e);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rt-svg .dot-peach{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.2}
.rt-svg .dot-off{fill:none;stroke:var(--hair);stroke-width:1.2}
.rt-svg .dot-ice{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.2}
.rt-svg .dot-lav{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.2}

/* the idea */
.tf-idea .cst-act{padding-bottom:20px}
.id-draw{width:100%;max-width:520px;margin:14px auto 0}
.id-draw svg{display:block;width:100%;height:auto;overflow:visible}
.id-draw text{font-family:var(--sans);font-size:var(--t-fine)}
.id-draw .t-ice{fill:var(--ice-t)}.id-draw .t-lav{fill:var(--lav-t)}.id-draw .t-mint{fill:var(--mint-t)}.id-draw .t-peach{fill:var(--peach-t)}
.whisk{stroke:var(--peach-e);stroke-width:2;stroke-linecap:round}
.ov-ring{fill:var(--mint-l);stroke:var(--mint-e);stroke-width:1.2;stroke-dasharray:4 4}
.tf-eq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 40px;align-items:center;margin-top:16px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:22px 28px}
.tf-eq .eq{font-family:var(--sans);font-size:var(--t-h2);font-weight:500;color:var(--ink);line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
.tf-eq .eq sub,.tf-eq .eq sup{font-size:.55em;font-weight:500}
.tf-eq .eq sub{vertical-align:-.3em}
.eq-key{display:grid;gap:10px;font-size:var(--t-label);line-height:1.45;color:var(--muted)}
.eq-key div{display:grid;grid-template-columns:2.4em 1fr;gap:12px;align-items:baseline}
.eq-key dt{font-weight:600;color:var(--ink);font-size:var(--t-body)}
.eq-key dt sub{font-size:.65em}
.eq-key dd sub{font-size:.75em}

/* how it works */
.tf-pipe{margin-top:var(--sp-fig);border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);overflow:hidden}
.pp-key{display:flex;flex-wrap:wrap;gap:6px 20px;padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--band);font-size:var(--t-label);color:var(--body)}
.pp-key span{display:inline-flex;align-items:center;gap:8px}
.pp-key span::before{content:'';width:18px;height:3px;border-radius:2px;background:var(--ice-e)}
.pp-key .k-lav::before{background:var(--lav-e)}
.pp-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto auto auto}
.pp{position:relative;display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;padding:22px 22px 22px;min-width:0}
.pp + .pp{border-left:1px solid var(--rule)}
.pp::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--ke)}
.pp-n{display:flex;align-items:center;gap:10px;font-size:var(--t-card);font-weight:600;color:var(--ink);line-height:1.2}
.pp-n .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:var(--t-fine);font-weight:700;background:var(--k);border:1px solid var(--ke);color:var(--kt);flex:none}
.pp-fig{margin:18px 0 14px;align-self:center;min-width:0}
.pp-fig svg{display:block;width:100%;height:auto;overflow:visible}
.pp-fig text{font-family:var(--sans);font-size:var(--t-fine)}
.pp-fig .t-ice{fill:var(--ice-t)}.pp-fig .t-lav{fill:var(--lav-t)}.pp-fig .t-peach{fill:var(--peach-t)}.pp-fig .t-mint{fill:var(--mint-t)}
.pp-fig .ln-ice,.pp-fig .ln-lav{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pp-fig .thin{stroke-width:1.5}
.pp-fig .ln-ice{stroke:var(--ice-e)}.pp-fig .ln-lav{stroke:var(--lav-e)}
.wf-ice{fill:var(--ice);stroke:var(--ice-e);stroke-width:.6}
.wf-lav{fill:var(--lav);stroke:var(--lav-e);stroke-width:.6}
.wf-loop{fill:var(--peach);stroke:var(--peach-e);stroke-width:.6}
.wf-drop{fill:var(--band);stroke:var(--hair);stroke-width:.6}
.hm-box{fill:none;stroke-width:1}
.sl-off{fill:var(--card);stroke:var(--hair);stroke-width:1}
.sl-on{fill:var(--mint);stroke:var(--mint-e);stroke-width:1;fill-opacity:.85}
.pp-say{font-size:var(--t-label);line-height:1.5;color:var(--muted)}
.pp-num{font-size:var(--t-label);line-height:1.45;color:var(--body);margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);align-self:stretch}
.pp-num b{font-weight:700;color:var(--kt);font-variant-numeric:tabular-nums}
.pp-total{padding:16px 24px;border-top:1px solid var(--rule);font-size:var(--t-label);line-height:1.5;color:var(--muted)}
.pp-total b{color:var(--mint-t);font-weight:700}

/* charts */
.ch .mk-base{fill:var(--card);stroke:var(--faint);stroke-width:1.6}
.ch .mk-math{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.5}
.ch .mk-code{fill:var(--lav);stroke:var(--lav-e);stroke-width:1.5}
.ch .mk-ours{fill:var(--mint);stroke:var(--mint-e);stroke-width:2}
.ch .d-base{fill:var(--hair);stroke:var(--faint);stroke-width:1}
.ch .d-ice2{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1}
.ch .cornr{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4 4}
.ch .l-arrow{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch .db-ln{stroke:var(--hair);stroke-width:2.5;stroke-linecap:round}
.anim .slide{transform:translateX(var(--dx));opacity:0}
.anim.in .slide{transform:none;opacity:1;transition:transform 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0s),opacity .3s ease var(--d,0s)}
.tf-two{grid-template-columns:1.6fr 1fr;gap:10px 44px}
.tf-two.l3{grid-template-columns:1fr 1.3fr;align-items:center}
.tf-two>div{min-width:0}
@media(max-width:900px){.tf-two>div:last-child{display:block!important}.tf-two,.tf-two.l3{grid-template-columns:1fr;gap:34px}}

/* finding 04: cases */
.tf-duel .term{padding-bottom:14px}
.tf-trace{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:var(--t-label);line-height:1.6;color:var(--body);background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;flex:1}
.tf-trace li{position:relative;padding-left:18px;opacity:0;transform:translateY(6px)}
.tf-trace li::before{content:'';position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--k);border:1.5px solid var(--ke)}
.tf-trace li + li::after{content:'';position:absolute;left:5.5px;top:-6px;height:9px;width:1.5px;background:var(--ke);opacity:.5}
.tf-trace sup{font-size:.7em}
.tf-note{display:block;font-family:var(--sans);font-size:var(--t-fine);color:var(--kt);margin-top:2px}
.tf-duel.in .tf-trace li,.no-anim .tf-trace li{opacity:1;transform:none;transition:opacity .5s ease var(--d,0s),transform .5s ease var(--d,0s)}
.tf-samples{display:flex;align-items:center;gap:6px;margin-top:12px}
.tf-samples span{min-width:40px;text-align:center;padding:4px 8px;border-radius:8px;font-size:var(--t-label);font-weight:600;font-variant-numeric:tabular-nums;opacity:0;transform:scale(.6)}
.tf-samples span.ok{background:var(--mint);border:1px solid var(--mint-e);color:var(--mint-t)}
.tf-samples span.no{background:var(--peach-l);border:1px solid var(--peach-e);color:var(--peach-t)}
body.dark-mode .tf-samples span.ok{color:var(--ink)}
.tf-duel.in .tf-samples span,.no-anim .tf-samples span{opacity:1;transform:none;transition:opacity .35s ease var(--d,0s),transform .45s cubic-bezier(.2,1.4,.4,1) var(--d,0s)}
.tf-samples::before{content:'four samples';font-size:var(--t-fine);color:var(--muted);margin-right:4px}
.tf-cases{grid-template-columns:1fr}
.cases.txt.tf-cases .case{display:block;padding:4px 0 16px}
.tf-cases .case .bn{margin-top:10px}
.tf-cases .case .q{margin-top:4px}
.tf-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 16px 0}
.tf-pair > .ba{margin:0}
.tf-assert{display:block;font-family:var(--mono);font-size:var(--t-fine);color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.tf-code{white-space:pre;overflow-x:auto}
.tf-code,.tf-assert,.tf-trace{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}
.tf-say{display:block;font-size:var(--t-label);line-height:1.45;color:var(--body)}

/* why it matters: cost tracks */
.tf-cost{margin:var(--sp-fig) 0 0}
.tc-panel{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:20px 28px 22px}
.tc-key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--t-fine);color:var(--muted);margin-bottom:6px}
.tc-key span{display:inline-flex;align-items:center;gap:7px}
.tc-key span::before{content:'';width:12px;height:12px;border-radius:3px;border:1px solid var(--ke);background:var(--k)}
.c-roll{--k:var(--ice);--ke:var(--ice-e)}.c-read{--k:var(--lav);--ke:var(--lav-e)}.c-back{--k:var(--peach);--ke:var(--peach-e)}.c-solve{--k:var(--mint);--ke:var(--mint-e)}
.tc-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px 24px;align-items:center;padding:14px 0 6px;border-top:1px solid var(--rule);margin-top:12px}
.tc-row header h3{font-size:var(--t-card);line-height:1.2}
.tc-row header p{font-size:var(--t-fine);color:var(--muted);margin-top:4px}
.tc-row.own header h3{color:var(--mint-t)}
.tc-track{min-width:0}
.tc-track svg{display:block;width:100%;height:auto;overflow:visible}
.tc-b{stroke-width:1;transition:opacity .25s ease}
.tc-b.c-roll{fill:var(--ice);stroke:var(--ice-e)}.tc-b.c-read{fill:var(--lav);stroke:var(--lav-e)}.tc-b.c-back{fill:var(--peach);stroke:var(--peach-e)}.tc-b.c-solve{fill:var(--mint);stroke:var(--mint-e)}
.tc-base{stroke:var(--hair);stroke-width:1}
.tc-head{stroke:var(--ink);stroke-width:1.5}
.tc-done circle{fill:var(--mint);stroke:var(--mint-e);stroke-width:1.2}
.tc-done path{fill:none;stroke:var(--mint-t);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tc-lb{font-family:var(--sans);font-size:var(--t-label);font-weight:600}
.tc-lb.t-mint{fill:var(--mint-t)}
.tf-left{justify-content:flex-start;margin-top:22px}
#matters .belief{max-width:44em}
.film + .cap a{text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}

@media(max-width:1099px){
  .pp-steps{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,auto)}
  .pp:nth-child(3){border-left:0}
  .pp:nth-child(n+3){border-top:1px solid var(--rule)}
}
@media(max-width:960px){
  .rt-draw{grid-column:1;grid-row:1/4;margin:0 0 0 18px;align-self:center}
  .tf-routes.pdm-live .pdm-act:not(.done) p.pdm-say{opacity:.4}
}
@media(max-width:900px){
  .tf-eq{grid-template-columns:1fr;padding:20px 22px}
  .tf-pair{grid-template-columns:1fr}
}
@media(max-width:700px){
  .tf-contrib{justify-content:flex-start}
  .rt-draw{max-width:400px;margin:12px auto 10px;padding:0 18px}
  .tf-eq .eq{font-size:var(--t-card);white-space:normal}
  .pp{padding:20px 18px}
  .pp-key{padding:12px 18px}
  .pp-total{padding:14px 18px}
  .tc-panel{padding:18px 16px 18px}
  .tc-row{grid-template-columns:1fr;gap:8px}
}
@media(max-width:560px){
  .pp-steps{grid-template-columns:1fr;grid-template-rows:none}
  .pp{display:block;grid-row:auto}
  .pp + .pp{border-left:0;border-top:1px solid var(--rule)}
  .pp-fig{max-width:320px}
}
</style>
