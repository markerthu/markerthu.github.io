      N.model={x:0,y:119,w:nw,h:nh,c:'lp-ice',t:'The flow model',u:'being fine-tuned'};
      N.samp={x:W*0.3-nw/2,y:8,w:nw,h:nh,c:'lp-ice',t:'Its own samples',u:'drawn from its current flow'};
      N.rew={x:W*0.68-nw/2,y:8,w:nw,h:nh,c:'lp-lav',t:'Any reward',u:'a classifier, file size, CLIP'};
      N.wt={x:W-nw,y:119,w:nw,h:nh,c:'lp-rose',t:'Weight each sample',m:'w = exp(τ · r)'};
      N.loss={x:W*0.49-nw*0.6,y:230,w:nw*1.2,h:nh,c:'lp-mint',t:'Weighted flow matching',m:'+ α · W2 bound'};
      N.base={x:W*0.49-nw*0.5,y:119,w:nw,h:nh,c:'lp-base',t:'The base model',u:'frozen, never updated'};
      var mx=N.model.x+nw/2, wx=N.wt.x+nw/2, ty=N.samp.y+nh/2, my=N.model.y+nh/2, by=N.loss.y+nh/2;
      pts=[[mx,my],[mx,ty],[W*0.3,ty],[W*0.68,ty],[wx,ty],[wx,my],[wx,by],[W*0.49,by],[mx,by],[mx,my]];
    }else{
      var nw2=W-56, nh2=58, gy=26; H=6*(nh2+gy)+10;
      var ys=[0,1,2,3,4].map(function(i){return 4+i*(nh2+gy);});
      N.model={x:0,y:ys[0],w:nw2,h:nh2,c:'lp-ice',t:'The flow model',u:'being fine-tuned'};
      N.samp={x:0,y:ys[1],w:nw2,h:nh2,c:'lp-ice',t:'Its own samples',u:'drawn from its current flow'};
      N.rew={x:0,y:ys[2],w:nw2,h:nh2,c:'lp-lav',t:'Any reward',u:'a classifier, file size, CLIP'};
      N.wt={x:0,y:ys[3],w:nw2,h:nh2,c:'lp-rose',t:'Weight each sample',m:'w = exp(τ · r)'};
      N.loss={x:0,y:ys[4],w:nw2,h:nh2,c:'lp-mint',t:'Weighted flow matching',m:'+ α · W2 bound'};
      N.base={x:0,y:ys[4]+nh2+gy+4,w:nw2,h:nh2,c:'lp-base',t:'The base model',u:'frozen, never updated'};
      var cx=nw2/2, rx=W-14;
      pts=[[cx,ys[0]+nh2/2],[cx,ys[4]+nh2/2],[rx,ys[4]+nh2/2],[rx,ys[0]+nh2/2],[cx,ys[0]+nh2/2]];
      H=N.base.y+nh2+6;
    }
    var d='M'+pts.map(function(p){return f(p[0])+' '+f(p[1]);}).join('L');
    s+='<path class="lp-path" id="lp-path" d="'+d+'"/><circle class="lp-halo" r="12"/><circle class="lp-dot" r="5"/>';
    if(!narrow){
      var lb=N.base, ll=N.loss;
      s+='<path class="lp-ref" d="M'+f(lb.x+lb.w/2)+' '+f(lb.y+lb.h)+'V'+f(ll.y)+'"/>';
      s+='<text class="lp-lab m" x="'+f(lb.x+lb.w/2+10)+'" y="'+f((lb.y+lb.h+ll.y)/2+4)+'">W2 bound</text>';
      s+='<text class="lp-lab" x="'+f(W*0.49-N.loss.w/2-14)+'" y="'+f(N.loss.y+N.loss.h/2-8)+'" text-anchor="end">update</text>';
      s+='<text class="lp-lab" x="'+f((N.samp.x+N.samp.w+N.rew.x)/2)+'" y="'+f(N.samp.y+N.samp.h/2-8)+'" text-anchor="middle">score</text>';
    }else{
      var lb2=N.base, ll2=N.loss;
      s+='<path class="lp-ref" d="M'+f(lb2.x+lb2.w*0.3)+' '+f(lb2.y)+'V'+f(ll2.y+ll2.h)+'"/>';
      s+='<text class="lp-lab m" x="'+f(lb2.x+lb2.w*0.3+10)+'" y="'+f((lb2.y+ll2.y+ll2.h)/2+4)+'">W2 bound</text>';
    }
    Object.keys(N).forEach(function(k){var n=N[k];
      s+='<g class="lp-node '+n.c+'" data-k="'+k+'"><rect x="'+f(n.x)+'" y="'+f(n.y)+'" width="'+f(n.w)+'" height="'+n.h+'" rx="12"/>'+
        '<text class="lp-h" x="'+f(n.x+16)+'" y="'+f(n.y+25)+'">'+n.t+'</text>'+
        (n.m?'<text class="lp-m" x="'+f(n.x+16)+'" y="'+f(n.y+45)+'">'+n.m+'</text>':'<text class="lp-s" x="'+f(n.x+16)+'" y="'+f(n.y+45)+'">'+n.u+'</text>')+'</g>';});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s+'</svg>';
    var path=$('#lp-path',el), L=path.getTotalLength(), chev='';
    [0.06,0.2,0.33,0.47,0.6,0.74,0.9].forEach(function(u){var p=path.getPointAtLength(L*u),q=path.getPointAtLength(Math.min(L,L*u+2)),a=Math.atan2(q.y-p.y,q.x-p.x),c=Math.cos(a),s2=Math.sin(a);
      chev+='<path class="lp-chev" d="M'+f(p.x+c*5)+' '+f(p.y+s2*5)+'L'+f(p.x-c*4-s2*4.5)+' '+f(p.y-s2*4+c*4.5)+'L'+f(p.x-c*4+s2*4.5)+' '+f(p.y-s2*4-c*4.5)+'z"/>';});
    path.insertAdjacentHTML('afterend',chev);
    var dot=$('.lp-dot',el), halo=$('.lp-halo',el), nodes=$$('.lp-node',el).filter(function(g){return g.getAttribute('data-k')!=='base';});
    var rects=nodes.map(function(g){var k=g.getAttribute('data-k');return [g,N[k]];});
    loopState={path:path,L:L,dot:dot,halo:halo,rects:rects,base:$('.lp-node[data-k=base]',el),narrow:narrow};
    placeDot(reduced?0.62:loopU);
  }
  var loopU=0, loopRaf=0, loopVis=false, loopLast=0;
  function placeDot(u){
    var S=loopState;if(!S)return;var p=S.path.getPointAtLength(S.L*u);
    S.dot.setAttribute('cx',p.x.toFixed(1));S.dot.setAttribute('cy',p.y.toFixed(1));S.halo.setAttribute('cx',p.x.toFixed(1));S.halo.setAttribute('cy',p.y.toFixed(1));
    var inLoss=false;
    S.rects.forEach(function(r){var n=r[1],on=p.x>=n.x-6&&p.x<=n.x+n.w+6&&p.y>=n.y-6&&p.y<=n.y+n.h+6;r[0].classList.toggle('on',on);if(on&&r[0].getAttribute('data-k')==='loss')inLoss=true;});
    if(S.base)S.base.classList.toggle('on',inLoss);
  }
  function loopTick(now){
    loopRaf=0;if(!loopVis||reduced)return;
    var dt=loopLast?Math.min(0.05,(now-loopLast)/1000):0;loopLast=now;
    loopU=(loopU+dt/(loopState&&loopState.narrow?8:9))%1;placeDot(loopU);loopRaf=requestAnimationFrame(loopTick);
  }
  var loopEl=$('#loop');
  if(loopEl)loopEl.addEventListener('orw:vis',function(e){loopVis=e.detail;if(loopVis&&!loopRaf&&!reduced){loopLast=0;loopRaf=requestAnimationFrame(loopTick);}});

  /* SD3 viewer: tabs + scatter, in sync */
  var view=null;
  (function(){
    var root=$('#sd3'); if(!root) return;
    var tabs=$$('.mtabs button',root), img=$('#sd3-img'), name=$('#sd3-name'), val=$('#sd3-val'), cur='ours', auto=!reduced, vis=false, timer=0, loaded=false;
    function preload(){if(loaded)return;loaded=true;tabs.forEach(function(b){var i=new Image();i.src=b.getAttribute('data-img');});}
    function mark(){$$('.sc-pt',root).forEach(function(g){g.classList.toggle('sel',g.getAttribute('data-k')===cur);});}
    function show(k){
      var b=tabs.filter(function(t){return t.getAttribute('data-k')===k;})[0]; if(!b) return; cur=k;
      tabs.forEach(function(t){t.setAttribute('aria-selected',t===b?'true':'false');});
      var src=b.getAttribute('data-img');
      if(img.getAttribute('src')!==src){img.classList.add('fading');setTimeout(function(){img.src=src;img.alt=b.getAttribute('data-alt');img.onload=function(){img.classList.remove('fading');};if(img.complete)img.classList.remove('fading');},reduced?0:180);}
      name.textContent=b.getAttribute('data-name');
      val.innerHTML='CLIP score <b>'+b.getAttribute('data-clip')+'</b> &nbsp;&middot;&nbsp; diversity score <b>'+b.getAttribute('data-div')+'</b>';
      mark();
    }
    function schedule(){clearTimeout(timer);if(!auto||!vis)return;timer=setTimeout(function(){var i=tabs.map(function(t){return t.getAttribute('data-k');}).indexOf(cur);show(tabs[(i+1)%tabs.length].getAttribute('data-k'));schedule();},cur==='ours'?5200:3200);}
    tabs.forEach(function(t){t.addEventListener('click',function(){auto=false;clearTimeout(timer);show(t.getAttribute('data-k'));});});
    root.addEventListener('click',function(e){var g=e.target.closest&&e.target.closest('.sc-pt');if(g){auto=false;clearTimeout(timer);show(g.getAttribute('data-k'));}});
    root.addEventListener('orw:vis',function(e){vis=e.detail;if(vis){preload();if(auto&&cur==='ours'&&!root.dataset.started){root.dataset.started='1';show('sd3');}}schedule();});
    view={mark:mark};
    show('ours');
  })();

  var charts=[['#ch-gap',gap],['#ch-clip',clipPair],['#ch-dial',dialPair],['#ch-sd3',scatter],['#rounds',rounds],['#loop',loop]], lastW=0;
  function build(){charts.forEach(function(c){var el=$(c[0]);if(el)c[1](el);});}
  build();
  function cols(){return [900,760,700,640,560,460].map(function(b){return mm('(max-width:'+b+'px)');}).join();}
  var lastC=cols(), rt=0;
  window.addEventListener('resize',function(){var c=cols();if(Math.abs(window.innerWidth-lastW)<40&&c===lastC)return;clearTimeout(rt);rt=setTimeout(function(){lastW=window.innerWidth;lastC=c;build();},180);});
  lastW=window.innerWidth;
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
  $$('.reveal').forEach(function(el){if(revIO)revIO.observe(el);else el.classList.add('in');});
  $$('.anim').forEach(function(el){if(animIO)animIO.observe(el);else el.classList.add('in');});
})();
</script>
