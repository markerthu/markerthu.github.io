<style>
/* SpeechGym page: only what the shared design system (selfrw/style.html) does not already provide. */
.stage-steps li:nth-child(1){--sc:var(--lav-e)}.stage-steps li:nth-child(2){--sc:var(--ice-e)}.stage-steps li:nth-child(3){--sc:var(--rose-e)}.stage-steps li:nth-child(4){--sc:var(--mint-e)}

/* tiny illustrations on the finding cards */
.il-p{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.5}
.il-i{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.5}
.il-m{fill:var(--mint);stroke:var(--mint-e);stroke-width:1.2}
.il-h{fill:var(--hair)}
.il-wv{fill:none;stroke:var(--lav-e);stroke-width:2;stroke-linecap:round}
.il-dl{stroke:var(--hair);stroke-width:2.5;stroke-linecap:round}
.il-dm{fill:var(--mint);stroke:var(--mint-e);stroke-width:1.5}
.il-di{fill:var(--card);stroke:var(--ice-e);stroke-width:1.5}

/* the three-way comparison: the shared .pdm acts, with an SVG drawing in place of a canvas */
.sg-axes .pdm-ill{margin:14px 24px 16px;min-width:0}
.sg-axes .pdm-ill svg{display:block;width:100%;height:auto;overflow:visible}
@media(max-width:960px){.sg-axes .pdm-act .pdm-ill{grid-column:1;grid-row:1/4;margin:0 4px 0 22px;align-self:center}}
@media(max-width:700px){.sg-axes .pdm-act .pdm-ill{margin:14px max(18px,calc(50% - 172px)) 14px}}

/* shared SVG parts */
.sg-node{fill:var(--card);stroke:var(--hair);stroke-width:1.2}
.sg-user{fill:var(--lav-l);stroke:var(--lav-e);stroke-width:1.3}
.sg-agent{fill:var(--ice-l);stroke:var(--ice-e);stroke-width:1.3}
.sg-ic{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sg-icu{fill:none;stroke:var(--lav-t);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sg-ln{fill:none;stroke:var(--hair);stroke-width:1.4}
.sg-dash{fill:none;stroke:var(--hair);stroke-width:1.3;stroke-dasharray:4 4}
.sg-lnm{fill:none;stroke:var(--mint-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sg-lnp{fill:none;stroke:var(--peach-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sg-hlb{fill:var(--mint-l)}
.sg-wv{fill:var(--lav-e)}
.sg-txl{fill:var(--faint)}
.sg-dot{fill:var(--ice-e)}
.sg-cell{fill:var(--ice);stroke:var(--ice-e);stroke-width:1}
.sg-ok{fill:var(--mint);stroke:var(--mint-e);stroke-width:1.2}
.sg-bad{fill:var(--peach);stroke:var(--peach-e);stroke-width:1.2}
.sg-pl{fill:var(--peach-l);stroke:var(--peach-e);stroke-width:1.2}
.sg-ml{fill:var(--mint-l);stroke:var(--mint-e);stroke-width:1.2}
.sg-nb{fill:var(--band);stroke:var(--hair);stroke-width:1.2}
.sg-hc{fill:var(--hair)}
.sg-ice{fill:var(--ice);stroke:var(--ice-e);stroke-width:1.2}
.gk{fill:none;stroke:var(--mint-t);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gx{fill:none;stroke:var(--peach-t);stroke-width:2;stroke-linecap:round}
.ch .t-body{fill:var(--body)}
.ch .t-faint{fill:var(--faint)}
.ch .t-rose{fill:var(--rose-t)}
.ch .w5{font-weight:500}
.ch .w4{font-weight:400}
.in .sg-cell.lrn{fill:var(--mint);stroke:var(--mint-e);transition:fill .5s ease var(--d,0s),stroke .5s ease var(--d,0s)}
.no-anim .sg-cell.lrn{fill:var(--mint);stroke:var(--mint-e)}
.anim .growl{transform:scaleX(0);transform-box:fill-box;transform-origin:right center}
.anim.in .growl{transform:none;transition:transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
body:not(.no-anim) .in .sg-osc{animation:sgOsc .9s ease-in-out infinite alternate var(--o,0s);transform-box:fill-box;transform-origin:center}
@keyframes sgOsc{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
body:not(.no-anim) .in .sg-mv{animation:sgMv var(--dur,2.8s) linear infinite var(--dl,0s)}
@keyframes sgMv{0%{transform:translate(var(--x0,0px),var(--y0,0px));opacity:0}14%{opacity:1}86%{opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:0}}
.paused .sg-osc,.paused .sg-mv{animation-play-state:paused}

/* two charts side by side inside one panel */
.sg-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px 48px;align-items:start}
@media(max-width:860px){.sg-two{grid-template-columns:1fr;gap:34px}}

/* small line icons on cards */
.sg-cards .card{display:flex;flex-direction:column}
.sg-cards .h-ico svg path,.sg-cards .h-ico svg circle,.sg-cards .h-ico svg rect{vector-effect:non-scaling-stroke}
@keyframes sgPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
body:not(.no-anim) .sg-cards .h-p1{animation:sgPulse 2.4s ease-in-out infinite}
body:not(.no-anim) .sg-cards .h-p2{animation:sgPulse 2.4s ease-in-out infinite .4s}
body:not(.no-anim) .sg-cards .h-p3{animation:sgPulse 2.4s ease-in-out infinite .8s}
body:not(.no-anim) .sg-cards .h-bob{animation:sgBob 3s ease-in-out infinite}
.sg-cards .h-ico .acc{stroke:var(--peach-e)}
.sg-cards.paused .h-ico path,.sg-cards.paused .h-ico rect,.sg-cards.paused .h-ico g{animation-play-state:paused!important}

/* the film poster, linking to the film page */
.sg-poster{display:block;position:relative;color:inherit}
.sg-poster img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.sg-play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:var(--card);border:1px solid var(--hair);display:grid;place-items:center;transition:transform .2s,border-color .2s}
.sg-play svg{width:24px;height:24px;fill:var(--ink);margin-left:4px}
.sg-poster:hover .sg-play{transform:scale(1.06);border-color:var(--mint-e)}
@media(max-width:560px){.sg-play{width:56px;height:56px;margin:-28px 0 0 -28px}.sg-play svg{width:20px;height:20px}}
.finale .cta .btn{min-width:0}
@media(max-width:700px){.finale .cta .btn svg{display:inline-block}}
</style>
