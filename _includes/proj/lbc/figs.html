<script>
/* LBC page: reveal on view (and again on every re-entry), pause off-screen, and the evidence charts drawn from the paper's numbers. */
(function(){
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
  var hasIO='IntersectionObserver' in window;
  if(reduced||!hasIO) document.body.classList.add('no-anim');
  function f1(v){return v.toFixed(1);}
  function fmt(v){var p=String(v).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.');}
  function setLens(root){$$('.draw',root).forEach(function(p){try{p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2);}catch(e){}});}

  /* reveal: add .in when enough of it is on screen, remove it once it has left, so it plays again next time */
  var revIO=hasIO&&!reduced?new IntersectionObserver(function(es){es.forEach(function(e){
    var el=e.target, need=Math.min(.3,(window.innerHeight*.55)/Math.max(1,e.boundingClientRect.height));
    if(e.isIntersecting&&e.intersectionRatio>=need){if(!el.classList.contains('in')){el.classList.add('in');el.dispatchEvent(new CustomEvent('lbc:in'));}}
    else if(!e.isIntersecting){el.classList.remove('in');}
  });},{threshold:[0,.05,.1,.2,.3]}):null;
  function watch(el){if(revIO)revIO.observe(el);else el.classList.add('in');}
  if(hasIO){var pauseIO=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('paused',!e.isIntersecting);e.target.dispatchEvent(new CustomEvent('lbc:vis',{detail:e.isIntersecting}));});},{threshold:.05});
    $$('.pausable').forEach(function(e){e.classList.add('paused');pauseIO.observe(e);});}

  /* Finding 01: which of the 57 games each agent broke (paper, appendix table of human world record breakthroughs) */
  (function(){
    var root=$('#wall'); if(!root) return;
    var tiles=$$('.wall li',root), tabs=$$('.wall-tabs button',root), num=$('.wall-n b',root), who=$('.wall-n span',root);
    var A={lbc:{i:0,k:'k-edit',n:'LBC, 1B frames'},a57:{i:1,k:'k-run',n:'Agent57, 100B frames'},meme:{i:2,k:'k-n',n:'MEME, 1B frames'}};
    var cur='lbc', timers=[];
    function clear(){timers.forEach(clearTimeout);timers=[];}
    function show(key,play){
      clear();cur=key;var a=A[key], on=tiles.filter(function(t){return t.getAttribute('data-h').charAt(a.i)==='1';});
      root.className=root.className.replace(/\bk-\w+/g,'').trim()+' '+a.k;
      who.textContent=a.n;
      tabs.forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-a')===key?'true':'false');});
      tiles.forEach(function(t){t.classList.remove('on');});
      if(!play||reduced){on.forEach(function(t){t.classList.add('on');});num.textContent=on.length;return;}
      num.textContent='0';
      on.forEach(function(t,j){timers.push(setTimeout(function(){t.classList.add('on');num.textContent=j+1;},180+j*85));});
    }
    tabs.forEach(function(b){b.addEventListener('click',function(){show(b.getAttribute('data-a'),true);});});
    root.addEventListener('lbc:in',function(){show(cur,true);});
    show('lbc',false);
    watch(root);
  })();

  /* Finding 02: mean human-normalized score against training frames (paper, Fig. 1 and appendix tables) */
  /* on a phone the same numbers as rows: one bar per agent, its training frames beside its name */
  function scoreRows(el){
    var cw=el.clientWidth, W=Math.round(Math.max(280,cw)), x0=0, x1=W-92, X=function(v){return x0+(x1-x0)*v/10077.52;};
    var rows=[['LBC','1B frames',10077.52,'10,077.52%'],['MuZero','20B frames',4994.97,'4,994.97%'],['Go-Explore','10B frames',4989.31,'4,989.31%'],['Agent57','100B frames',4762.17,'4,762.17%'],['MEME','1B frames',4081.14,'4,081.14%']];
    var top=40, rh=58, H=top+rows.length*rh+4;
    var s='<text x="0" y="18" class="t-ink mid">Mean score over the 57 games</text>';
    rows.forEach(function(r,i){var y=top+i*rh, me=i===0, d=(.15+i*.14).toFixed(2)+'s', bw=Math.max(4,X(r[2])-x0);
      s+='<text x="0" y="'+(y+14)+'"><tspan class="'+(me?'t-mint':'t-ink')+' mid">'+r[0]+'</tspan><tspan class="sm'+(me?' t-mint':'')+'" dx="8">'+r[1]+'</tspan></text>';
      s+='<rect class="'+(me?'d-mint':r[0]==='Agent57'?'d-ice':'d-n')+' grow" style="--d:'+d+'" x="'+x0+'" y="'+(y+24)+'" width="'+f1(bw)+'" height="'+(me?20:16)+'" rx="5"/>';
      s+='<text class="fade '+(me?'t-mint mid':'')+'" style="--d:'+(.45+i*.14).toFixed(2)+'s" x="'+f1(x0+bw+8)+'" y="'+(y+(me?39:37))+'">'+r[3]+'</text>';});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
  }
  function score(el){
    if(el.clientWidth<600){scoreRows(el);return;}
    var cw=el.clientWidth, small=cw<640, W=Math.round(Math.max(small?330:700,cw)), H=small?400:430;
    var m={l:small?58:78,r:small?20:150,t:46,b:62};
    var L0=Math.log10(.6e9), L1=Math.log10(1.6e11);
    var X=function(fr){return m.l+(W-m.l-m.r)*(Math.log10(fr)-L0)/(L1-L0);}, Y=function(v){return m.t+(H-m.t-m.b)*(1-v/11000);};
    var s='<text x="0" y="18" class="t-ink mid">'+(small?'Mean score over 57 games':'Mean human-normalized score over the 57 games')+'</text>';
    [0,2000,4000,6000,8000,10000].forEach(function(v){s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f1(Y(v))+'" y2="'+f1(Y(v))+'"/><text x="'+(m.l-10)+'" y="'+f1(Y(v)+4)+'" text-anchor="end">'+fmt(v)+'%</text>';});
    [[1e9,'1B'],[1e10,'10B'],[1e11,'100B']].forEach(function(t){s+='<line class="ax" x1="'+f1(X(t[0]))+'" x2="'+f1(X(t[0]))+'" y1="'+(H-m.b)+'" y2="'+(H-m.b+5)+'"/><text x="'+f1(X(t[0]))+'" y="'+(H-m.b+22)+'" text-anchor="middle">'+t[1]+'</text>';});
    s+='<line class="ax" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(H-m.b)+'" y2="'+(H-m.b)+'"/>';
    s+='<text x="'+(W-m.r)+'" y="'+(H-8)+'" text-anchor="end" class="sm">training frames, log scale</text>';
    var pts=[
      ['MEME','1B frames',1e9,4081.14,'4,081.14%',small?['s',11,5]:['s',14,5]],
      ['Go-Explore','10B frames',1e10,4989.31,'4,989.31%',small?['e',4,-32]:['e',-12,-34]],
      ['MuZero','20B frames',2e10,4994.97,'4,994.97%',small?['m',0,26]:['s',12,30]],
      ['Agent57','100B frames',1e11,4762.17,'4,762.17%',small?['e',8,-32]:['s',16,5]]];
    var xl=X(1e9), yl=Y(10077.52);
    s+='<line class="fade" style="--d:1.1s" x1="'+f1(xl)+'" x2="'+f1(xl)+'" y1="'+f1(Y(4081.14)-10)+'" y2="'+f1(yl+14)+'" stroke="var(--mint-e)" stroke-width="1.4" stroke-dasharray="3 4"/>';
    pts.forEach(function(p,i){var x=X(p[2]),y=Y(p[3]),d=(.25+i*.18).toFixed(2)+'s',a=p[5][0]==='e'?'end':p[5][0]==='m'?'middle':'start',lx=x+p[5][1],ly=y+p[5][2];
      s+='<circle class="'+(p[0]==='Agent57'?'d-ice':'d-n')+' pop" style="--d:'+d+'" cx="'+f1(x)+'" cy="'+f1(y)+'" r="7"/>';
      s+='<text class="fade" style="--d:'+d+'" x="'+f1(lx)+'" y="'+f1(ly)+'" text-anchor="'+a+'"><tspan class="t-ink mid">'+p[0]+'</tspan><tspan x="'+f1(lx)+'" dy="17" class="sm">'+p[4]+(small?'':', '+p[1])+'</tspan></text>';});
    s+='<circle class="pop" style="--d:1.3s" cx="'+f1(xl)+'" cy="'+f1(yl)+'" r="20" fill="var(--mint-l)"/><circle class="d-mint pop" style="--d:1.3s" cx="'+f1(xl)+'" cy="'+f1(yl)+'" r="9"/>';
    s+='<text class="fade" style="--d:1.5s" x="'+f1(xl+(small?24:30))+'" y="'+f1(yl-4)+'"><tspan class="t-mint big">LBC</tspan><tspan class="t-mint big" dx="10">10,077.52%</tspan><tspan x="'+f1(xl+(small?24:30))+'" dy="20" class="sm">1B frames</tspan></text>';
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';setLens(el);
  }

  /* Finding 03 and 04: the ablation, scaled to the full method (paper, Fig. 5); the drops are the paper's labels */
  function space(el){
    if(el.clientWidth<600){hbars(el,'','Score, scaled to the full method',
      [['Three policies, blended','LBC',100,100,'',''],['One policy, blended','fewer policies',81,72,'\u221219%','\u221228%'],['One policy, temperature only','fewer policies, no blend',69,41,'\u221231%','\u221259%']]);return;}
    var cw=el.clientWidth, small=cw<600, W=Math.round(Math.max(small?330:640,cw)), H=small?380:400;
    var m={l:small?44:56,r:small?6:20,t:76,b:small?70:62};
    var G=[['Three policies,','blended',100,100,'',''],['One policy,','blended',81,72,'−19%','−28%'],['One policy,','temperature only',69,41,'−31%','−59%']];
    var Y=function(v){return m.t+(H-m.t-m.b)*(1-v/110);}, gw=(W-m.l-m.r)/3, bw=Math.min(small?34:56,gw*.3);
    var s='<text x="0" y="18" class="t-ink mid">'+(small?'Score, scaled to the full method':'Score of each variant, scaled to the full method')+'</text>';
    s+='<g transform="translate(0,46)"><rect x="0" y="-10" width="12" height="12" rx="3" class="d-key"/><text x="18" y="1" class="sm">mean</text><rect x="70" y="-10" width="12" height="12" rx="3" class="d-key-o"/><text x="88" y="1" class="sm">median</text></g>';
    [0,20,40,60,80,100].forEach(function(v){s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f1(Y(v))+'" y2="'+f1(Y(v))+'"/><text x="'+(m.l-8)+'" y="'+f1(Y(v)+4)+'" text-anchor="end" class="sm">'+v+'%</text>';});
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f1(Y(100))+'" y2="'+f1(Y(100))+'" stroke="var(--mint-e)" stroke-width="1.2" stroke-dasharray="4 4" class="fade" style="--d:.2s"/>';
    G.forEach(function(g,i){var cx=m.l+gw*(i+.5), xs=[cx-bw-3,cx+3];
      var hue=i===0?'mint':'lav';
      [[g[2],'d-'+hue,'t-'+hue,g[4]],[g[3],'d-'+hue+'-o','t-'+hue,g[5]]].forEach(function(b,j){var y=Y(b[0]),h=Y(0)-y,d=(.2+i*.35+j*.12).toFixed(2)+'s';
        s+='<rect class="'+b[1]+' growy" style="--d:'+d+'" x="'+f1(xs[j])+'" y="'+f1(y)+'" width="'+f1(bw)+'" height="'+f1(h)+'" rx="5"/>';
        if(b[3])s+='<text class="'+b[2]+' fade mid" style="--d:'+(.6+i*.35+j*.12).toFixed(2)+'s" x="'+f1(xs[j]+bw/2)+'" y="'+f1(y-9)+'" text-anchor="middle">'+b[3]+'</text>';});
      var bold=i===0?' class="t-ink mid"':'';
      s+='<text x="'+f1(cx)+'" y="'+(H-m.b+22)+'" text-anchor="middle"'+bold+'>'+g[0]+'</text><text x="'+f1(cx)+'" y="'+(H-m.b+40)+'" text-anchor="middle"'+bold+'>'+g[1]+'</text>';
      if(i===0)s+='<text x="'+f1(cx)+'" y="'+(H-m.b+58)+'" text-anchor="middle" class="sm t-mint" style="font-weight:600">LBC</text>';});
    s+='<line class="ax" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f1(Y(0))+'" y2="'+f1(Y(0))+'"/>';
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
  }
  function hbars(el,title,titleS,rows){
    var cw=el.clientWidth, small=cw<600, W=Math.round(Math.max(small?280:640,cw));
    var x0=small?0:236, x1=W-(small?70:96), X=function(v){return x0+(x1-x0)*v/100;};
    var top=small?44:56, rowH=small?124:88, H=top+rows.length*rowH+(small?14:18);
    var col=small&&rows.some(function(r){return r[4]&&r[2]>60;});
    var s='<text x="0" y="18" class="t-ink mid">'+(small?titleS:title)+'</text>';
    s+='<line x1="'+f1(X(100))+'" x2="'+f1(X(100))+'" y1="'+(top-8)+'" y2="'+(H-22)+'" stroke="var(--mint-e)" stroke-width="1.2" stroke-dasharray="4 4" class="fade"/>';
    s+='<text x="'+f1(X(100))+'" y="'+(H-4)+'" text-anchor="middle" class="sm">100%</text>';
    rows.forEach(function(r,i){var y=top+i*rowH, by=small?y+42:y, cls=i===0?'t-ink mid':'mid';
      if(small)s+='<text x="0" y="'+(y+14)+'" class="'+cls+'">'+r[0]+'</text><text x="0" y="'+(y+31)+'" class="sm">'+r[1]+'</text>';
      else s+='<text x="'+(x0-16)+'" y="'+(y+20)+'" text-anchor="end" class="'+cls+'">'+r[0]+'</text><text x="'+(x0-16)+'" y="'+(y+38)+'" text-anchor="end" class="sm">'+r[1]+'</text>';
      var hue=i===0?'mint':'lav';
      [[r[2],'d-'+hue,'t-'+hue,r[4],'mean'],[r[3],'d-'+hue+'-o','t-'+hue,r[5],'median']].forEach(function(b,j){var yy=by+j*30, d=(.2+i*.4+j*.15).toFixed(2)+'s', bw=Math.max(4,X(b[0])-x0), inside=bw>64;
        s+='<rect class="'+b[1]+' grow" style="--d:'+d+'" x="'+f1(x0)+'" y="'+yy+'" width="'+f1(bw)+'" height="22" rx="5"/>';
        if(inside)s+='<text class="fade sm t-ink" style="--d:'+d+'" x="'+f1(x0+9)+'" y="'+(yy+15.5)+'">'+b[4]+'</text>';
        var lx=col?X(100)+8:x0+bw+10;
        if(b[3])s+='<text class="fade" style="--d:'+(.6+i*.4+j*.15).toFixed(2)+'s" x="'+f1(lx)+'" y="'+(yy+16)+'"><tspan class="'+b[2]+' mid">'+b[3]+'</tspan>'+(inside?'':'<tspan class="sm" dx="6">'+b[4]+'</tspan>')+'</text>';});});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
  }
  function choice(el){
    hbars(el,'Score with the same behavior space, scaled to the full method','Score, scaled to the full method',
      [['A bandit learns the blend','LBC',100,100,'',''],['Blends picked at random','the same behavior space',19.7,18.5,'\u221280.3%','\u221281.5%']]);
  }

  var charts=[['#ch-score',score],['#ch-space',space],['#ch-choice',choice]], lastW=0;
  function build(){charts.forEach(function(c){var el=$(c[0]);if(el)c[1](el);});}
  build();
  var rt=0;window.addEventListener('resize',function(){if(Math.abs(window.innerWidth-lastW)<40)return;clearTimeout(rt);rt=setTimeout(function(){lastW=window.innerWidth;build();},180);});
  lastW=window.innerWidth;
  $$('.reveal,.anim').forEach(watch);
  if(reduced||!hasIO) $$('.reveal,.anim').forEach(function(e){e.classList.add('in');});
})();
</script>
