    <article class="rw-t new" style="--d:.9s">
      <span class="rw-tag">new</span>
      <h3>Procedure</h3>
      <p>The calls in the right order, and the rollout ends on the reference sequence.</p>
      <svg class="rw-ill" viewBox="0 0 240 96" aria-hidden="true">
        <rect class="s-g" x="4" y="4" width="56" height="24" rx="6"/><text class="s-t" x="28" y="20.500">1</text>
        <rect class="s-g" x="72" y="4" width="56" height="24" rx="6"/><text class="s-t" x="96" y="20.500">2</text>
        <rect class="s-g" x="140" y="4" width="56" height="24" rx="6"/><text class="s-t" x="164" y="20.500">3</text>

      </svg>
      <p class="rw-w"><span>weight</span><b>2</b></p>
    </article>
    <article class="rw-t new" style="--d:1.3s">
      <span class="rw-tag">new</span>
      <h3>Error-aware penalty</h3>
      <p>A point off for an invented or missing tool, a wrong set of keys, a wrong type.</p>
      <svg class="rw-ill" viewBox="0 0 240 96" aria-hidden="true">
        <rect class="s-c" x="4" y="6" width="176" height="22" rx="6"/><text class="s-t" x="16" y="21.500">tool names</text>

    <p class="rw-sum"><span><b>The reward</b> is the weighted sum of the four terms</span><span class="pill">a standard GRPO update</span></p>
  </div>
  <figcaption class="cap">Correctness-only RL stops at the first two terms. The weights are the paper&rsquo;s.</figcaption>
