<script>
/* Read the Mind: figures. Every chart is drawn from numbers in the paper (arXiv 2608.24958);
   schematics say so in their captions. Each figure animates when it scrolls into view and
   restarts when it comes back; loops pause off-screen; reduced motion shows the final frame. */
(function(){
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasIO='IntersectionObserver' in window;
  var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
  if(reduced||!hasIO) document.body.classList.add('no-anim');

  function n1(v){return Math.round(v*10)/10;}
  function T(x,y,s,cls,anchor,style){return '<text x="'+n1(x)+'" y="'+n1(y)+'"'+(cls?' class="'+cls+'"':'')+(anchor?' text-anchor="'+anchor+'"':'')+(style?' style="'+style+'"':'')+'>'+s+'</text>';}
  function D(d){return ' style="--d:'+d.toFixed(2)+'s"';}
  function svg(W,H,s){return '<svg viewBox="0 0 '+Math.round(W)+' '+Math.round(H)+'" style="max-width:'+Math.round(W)+'px" aria-hidden="true">'+s+'</svg>';}
  function setLens(root){$$('.draw',root).forEach(function(p){try{p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2);}catch(e){}});}
  function cw(el,min,max){return Math.round(Math.max(min,Math.min(max,el.clientWidth||min)));}
  function tw(s,px){var w=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);w+=c>0x2e80?px*1.02:(c===32?px*0.28:px*0.56);}return w;}
  function chip(cx,cy,label,cls,px){var w=tw(label,px)+26,h=px+15;return '<rect class="'+cls+'" x="'+n1(cx-w/2)+'" y="'+n1(cy-h/2)+'" width="'+n1(w)+'" height="'+h+'" rx="'+(h/2)+'"/>'+T(cx,cy+px*0.36,label,'t-chip','middle');}
  function wave(x0,x1,yc,hmax,n,cls,seed,pulse){var s='',bw=Math.max(2.4,(x1-x0)/n*0.5);for(var i=0;i<n;i++){var e=0.3+0.7*Math.abs(Math.sin(i*1.7+seed)),h=hmax*e,x=x0+(x1-x0)*(i+0.5)/n;
    s+='<rect class="'+cls+(pulse?' rm-pulse':'')+'"'+(pulse?D((i%5)*0.18):'')+' x="'+n1(x-bw/2)+'" y="'+n1(yc-h/2)+'" width="'+n1(bw)+'" height="'+n1(h)+'" rx="'+n1(bw/2)+'"/>';}return s;}

  /* ---------- The idea: two readers ---------- */
  function idea(el,ws){
    var W=cw(el,280,500),nar=W<380,H=196,s='',i,mx0=nar?50:56,lw=nar?7:9,lg=nar?4:5,ly0=46,ly1=146,lx1=mx0+8*(lw+lg)-lg,ox=lx1+(nar?22:26);
    s+=wave(6,46,96,46,6,'wv',0.6,true);
    for(i=0;i<8;i++){var mid=ws&&i>=3&&i<=5;s+='<rect class="lay'+(mid?' mid':'')+'" x="'+(mx0+i*(lw+lg))+'" y="'+ly0+'" width="'+lw+'" height="'+(ly1-ly0)+'" rx="3"/>';}
    s+=T(26,172,'sound','','middle')+T((mx0+lx1)/2,172,'the model','','middle');
    s+='<path class="lk" d="M'+(lx1+3)+' 128H'+(ox-4)+'"/>';
    s+=T(ox,104,'then it speaks');
    var aw=Math.min(W-ox-2,128);
    s+='<g class="pop"'+D(ws?2.2:1.0)+'><rect class="ans" x="'+ox+'" y="114" width="'+n1(aw)+'" height="30" rx="15"/>'+T(ox+aw/2,134,'the answer','t-ink','middle')+'</g>';
    if(!ws){
      s+=nar?T(W-2,22,'what it writes down','t-k','end'):T(ox,22,'what it writes down','t-k');
      s+='<path class="lk" d="M'+(lx1+4)+' 50H'+(ox-4)+'"/>';
      s+='<rect class="slot" x="'+ox+'" y="32" width="'+n1(W-ox-2)+'" height="36" rx="10"/>';
      s+='<rect class="scanbar rm-scan" x="'+(ox+4)+'" y="36" width="22" height="28" rx="7" style="--tx:'+n1(W-ox-34)+'px;--d:.4s"/>';
      s+=T(ox+(W-ox)/2,55,'nothing to read','fade t-peach','middle','--d:1.4s');
    }else{
      var cx=mx0+4*(lw+lg)+lw/2;
      s+='<g class="pop"'+D(0.5)+'><circle class="lens" cx="'+cx+'" cy="96" r="25"/><path class="lens" d="M'+(cx+18)+' 114l12 12" stroke-linecap="round"/></g>';
      s+=nar?T(W-2,22,'read from its middle layers','t-k','end'):T(ox,22,'read from its middle layers','t-k');
      s+='<path class="lk draw"'+D(0.9)+' d="M'+cx+' 70C'+cx+' 50 '+(ox-20)+' 50 '+(ox-4)+' 50"/>';
      var w1=nar?74:80,w2=nar?52:68,c1=ox+w1/2,c2=ox+w1+(nar?6:8)+w2/2;
      s+='<g class="pop"'+D(1.2)+'><rect class="chip" x="'+(c1-w1/2)+'" y="34" width="'+w1+'" height="30" rx="15"/>'+T(c1,54,'scandal','t-ink','middle')+'</g>';
      if(c2+w2/2<=W) s+='<g class="pop"'+D(1.6)+'><rect class="chip" x="'+(c2-w2/2)+'" y="34" width="'+w2+'" height="30" rx="15"/>'+T(c2,54,'总统','t-ink','middle')+'</g>';
    }
    el.innerHTML=svg(W,H,s);setLens(el);
  }

  /* ---------- How it works: the lens ---------- */
  function lens(el){
    var W=cw(el,300,760),narrow=W<520,nc=narrow?12:24,lw=narrow?74:118,colw=(W-lw)/nc,s='',c,r;
    var gy=132,rh=15,na=6,nt=4,ty=gy+na*rh+10,sy=ty+nt*rh+12,sh=26,H=sy+sh+40;
    var X=function(c){return lw+colw*c+colw/2;};
    var b0=-1,b1=-1;for(c=0;c<nc;c++){var f=(c+0.5)/nc;if(f>=0.35&&f<=0.8){if(b0<0)b0=c;b1=c;}}
    s+='<rect class="bandbg" x="'+n1(X(b0)-colw/2-2)+'" y="'+(gy-10)+'" width="'+n1((b1-b0+1)*colw+4)+'" height="'+(sy+sh+6-gy+10)+'" rx="8"/>';
    s+=T(lw-12,gy+na*rh/2-(narrow?0:8),'audio','t-ink mid','end');
    if(!narrow){s+=T(lw-12,gy+na*rh/2+8,'comes first,','sm','end')+T(lw-12,gy+na*rh/2+23,'cannot see the text','sm','end');}
    s+=T(lw-12,ty+nt*rh/2+(narrow?4:-3),narrow?'text':'question','t-ink mid','end');
    if(!narrow) s+=T(lw-12,ty+nt*rh/2+13,'+ options','sm','end');
    s+=T(lw-12,sy+sh/2+5,'answer','t-ink mid','end');
    for(c=0;c<nc;c++){var x=lw+colw*c+2,w=colw-4;
      for(r=0;r<na;r++)s+='<rect class="cell-0" x="'+n1(x)+'" y="'+(gy+r*rh+1.5)+'" width="'+n1(w)+'" height="'+(rh-3)+'" rx="2.5"/>';
      for(r=0;r<nt;r++)s+='<rect class="cell-0" x="'+n1(x)+'" y="'+(ty+r*rh+1.5)+'" width="'+n1(w)+'" height="'+(rh-3)+'" rx="2.5"/>';
      var g='';for(r=0;r<na;r++)g+='<rect class="cell-a" x="'+n1(x)+'" y="'+(gy+r*rh+1.5)+'" width="'+n1(w)+'" height="'+(rh-3)+'" rx="2.5"/>';
      for(r=0;r<nt;r++)g+='<rect class="cell-t" x="'+n1(x)+'" y="'+(ty+r*rh+1.5)+'" width="'+n1(w)+'" height="'+(rh-3)+'" rx="2.5"/>';
      s+='<g class="fade"'+D(0.15+c*(1.6/nc))+'>'+g+'</g>';}
    var cL=Math.round((b0+b1)/2),xL=X(cL),t1=0.15+1.6+0.25;
    s+='<rect class="hot fade"'+D(t1)+' x="'+n1(xL-colw/2-1)+'" y="'+(gy-3)+'" width="'+n1(colw+2)+'" height="'+(na*rh+6)+'" rx="5"/>';
    var hw=152,hx=Math.max(4,Math.min(W-hw-4,xL-hw/2));
    s+='<path class="lk draw"'+D(t1+0.25)+' d="M'+n1(xL)+' '+(gy-6)+'V104"/>';
    s+='<rect class="head" x="'+n1(hx)+'" y="64" width="'+hw+'" height="38" rx="10"/><rect class="head-on fade"'+D(t1+0.65)+' x="'+n1(hx)+'" y="64" width="'+hw+'" height="38" rx="10"/>';
    s+=T(hx+hw/2,88,'its own output head','t-ink mid','middle');
    s+='<path class="lk draw"'+D(t1+0.85)+' d="M'+n1(xL)+' 62V44"/>';
    s+='<g class="pop"'+D(t1+1.15)+'>'+chip(xL,24,'总统  president','chip',15)+'</g>';
    if(!narrow&&xL+120<W-150) s+=T(xL+96,29,'a word, before any is said','fade sm','start','--d:'+(t1+1.4)+'s');
    s+='<rect class="slot" x="'+(lw+2)+'" y="'+sy+'" width="'+n1(W-lw-4)+'" height="'+sh+'" rx="8"/>';
    s+=T(lw+(W-lw)/2,sy+sh/2+5,narrow?'still empty: nothing said':'still empty: nothing said yet','fade t-ink mid','middle','--d:'+(t1+1.6)+'s');
    s+=T(lw+2,H-8,'layer 0','sm','start')+T(W,H-8,'layer 47','sm','end')+T((X(b0)+X(b1))/2,H-8,'middle layers','band-l sm','middle');
    el.innerHTML=svg(W,H,s);setLens(el);
  }

  /* ---------- How it works: the swap control ---------- */
  function swap(el){
    var W=cw(el,280,460),s='',i,rows=['the real clip','a mismatched clip','silence'],y0=58,rh=94,H=y0+3*rh-8;
    s+=T(0,16,'Change only the sound','t-ink mid')+T(0,36,'the question and options stay byte-identical','sm');
    var wx1=Math.round(W*0.38),cx0=wx1+22;
    for(i=0;i<3;i++){var y=y0+i*rh;
      s+='<rect class="rowbg rm-swap-on'+(i===0?' first':'')+'" style="--d:'+(i*2.4-0.01).toFixed(2)+'s" x="-8" y="'+(y-8)+'" width="'+(W+16)+'" height="'+(rh-12)+'" rx="12"/>';
      s+=T(0,y+12,rows[i],'t-ink mid');
      if(i===0) s+=wave(0,wx1,y+44,40,13,'wv',0.6,true);
      else if(i===1) s+=wave(0,wx1,y+44,40,13,'wv-m',2.3,true);
      else s+='<path class="wv-0" d="M2 '+(y+44)+'H'+wx1+'"/>';
      var cwid=(W-cx0)/6;
      for(var c=0;c<6;c++) s+='<rect class="cell-t" x="'+n1(cx0+c*cwid+2)+'" y="'+(y+30)+'" width="'+n1(cwid-4)+'" height="28" rx="4"/>';
      s+=T(cx0,y+12,'same text','sm');
    }
    el.innerHTML=svg(W,H,s);
  }

  /* ---------- Finding 01: the Nixon chain ---------- */
  function chain(el){
    var W=cw(el,320,1060),narrow=W<640,lw=narrow?112:176,ax0=lw+8,ax1=narrow?W-8:W-178,s='',i;
    var rows=[['water + gate',0.08,'= Watergate, never one token'],['scandal',0.08,'rank 1 from the earliest layers'],['president · 总统',0.35,''],['Nixon',0.37,'read over the audio, not off the option']];
    var r0=62,rs=narrow?50:56,yb=r0+4*rs-14,H=yb+(narrow?118:52);
    var X=function(f){return ax0+(ax1-ax0)*f;};
    s+=T(0,16,narrow?'The Nixon clip, at the audio positions':'The Nixon clip, read at the audio positions, input to output','t-ink mid');
    s+='<rect class="bandbg" x="'+n1(X(0.35))+'" y="'+(r0-30)+'" width="'+n1(X(0.8)-X(0.35))+'" height="'+(yb-r0+30)+'" rx="8"/>';
    if(!narrow){s+=T(0,r0+rs*0.5+4,'the event','sm')+T(0,r0+rs*2.5+4,'the actor','sm');}
    var pts=[];
    rows.forEach(function(rw,k){var y=r0+k*rs,x=X(rw[1]);pts.push([x,y]);
      s+='<line class="grid" x1="'+ax0+'" x2="'+ax1+'" y1="'+y+'" y2="'+y+'"/>';
      s+=T(lw-8,y+5,rw[0],k===3?'t-mint mid':'t-ink mid','end');
    });
    var p='M'+n1(pts[0][0])+' '+pts[0][1];for(i=1;i<4;i++)p+='L'+n1(pts[i][0])+' '+pts[i][1];
    s+='<path class="lk draw" stroke-dasharray="0"'+D(0.3)+' d="'+p+'"/>';
    s+='<line class="grow" style="--d:1.7s;stroke:var(--mint-e);stroke-width:7;stroke-linecap:round;stroke-opacity:.55" x1="'+n1(pts[2][0])+'" x2="'+n1(X(0.8))+'" y1="'+pts[2][1]+'" y2="'+pts[2][1]+'"/>';
    pts.forEach(function(q,k){s+='<circle class="pop" style="--d:'+(0.25+k*0.42).toFixed(2)+'s" cx="'+n1(q[0])+'" cy="'+q[1]+'" r="15" fill="var(--mint-l)"/><circle class="d-mint pop"'+D(0.25+k*0.42)+' cx="'+n1(q[0])+'" cy="'+q[1]+'" r="6.5"/>';
      if(!narrow&&rows[k][2]) s+=T(q[0]+16,q[1]-10,rows[k][2],'fade sm','start','--d:'+(0.5+k*0.42).toFixed(2)+'s');});
    if(!narrow) s+=T(X(0.8)-6,pts[2][1]-12,'held through the middle layers as 总统','fade sm t-mint','end','--d:2.1s');
    s+=(narrow?'':T(ax0,yb+20,'input','sm','start')+T(ax1,yb+20,'output','sm','end'))+T((X(0.35)+X(0.8))/2,yb+20,'middle layers','band-l sm','middle');
    var aw=136,ah=36,axx,ayy;
    if(narrow){axx=W-aw-2;ayy=yb+48;s+=T(axx-10,ayy+ah/2+5,'the answer','','end');}
    else{axx=W-aw-4;ayy=pts[3][1]-ah/2;s+=T(axx+aw/2,ayy-10,'the answer','','middle');
      s+='<path class="lk draw"'+D(2.2)+' d="M'+n1(pts[3][0]+10)+' '+pts[3][1]+'H'+n1(axx-4)+'" stroke-dasharray="3 4"/>';}
    s+='<g class="pop"'+D(2.6)+'><rect class="chip" x="'+axx+'" y="'+n1(ayy)+'" width="'+aw+'" height="'+ah+'" rx="'+(ah/2)+'"/>'+T(axx+aw/2,ayy+ah/2+6,'Richard Nixon','t-chip','middle')+'</g>';
    el.innerHTML=svg(W,H,s);setLens(el);
  }

  /* ---------- Finding 02: shares and the frequency control ---------- */
  function share(el){
    var W=cw(el,280,480),s='',bx=0,by=52,bh=34,bw=W;
    s+=T(0,16,'Top-1 readouts in the middle layers','t-ink mid')+T(0,34,'863,770 cells over 948 clips','sm');
    var en=bw*0.526,zh=bw*0.385;
    s+='<rect class="d-hair grow"'+D(0.1)+' x="0" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="6" style="--d:.1s;stroke:none"/>';
    s+='<rect class="d-ice grow"'+D(0.25)+' x="0" y="'+by+'" width="'+n1(en)+'" height="'+bh+'" rx="6"/>';
    s+='<rect class="d-lav grow"'+D(0.6)+' x="'+n1(en+2)+'" y="'+by+'" width="'+n1(zh-2)+'" height="'+bh+'" rx="6"/>';
    s+=T(0,by+bh+22,'English 52.6%','t-ice mid fade','start','--d:.6s')+T(en+2,by+bh+22,'Chinese 38.5%','t-lav mid fade','start','--d:1s')+T(W,by+bh+22,'other','sm fade','end','--d:1.1s');
    var y2=168;
    s+=T(0,y2,'音乐 (music) at rank 1','t-ink mid')+T(0,y2+18,'how often, by kind of clip','sm');
    var lw=W<360?112:124,mx=W-lw-46,bar=function(v){return Math.max(3,mx*v/30);};
    var rows=[['music clips',30,'d-lav','t-lav'],['610 other clips',6,'d-hair','']];
    rows.forEach(function(r,k){var y=y2+44+k*34;
      s+=T(0,y+5,r[0],k===0?'t-ink':'');
      s+='<rect class="'+r[2]+' grow"'+D(1.3+k*0.2)+' x="'+lw+'" y="'+(y-10)+'" width="'+n1(bar(r[1]))+'" height="20" rx="5"/>';
      s+=T(lw+bar(r[1])+8,y+5,r[1]+'%',(r[3]?r[3]+' ':'')+'mid fade','start','--d:'+(1.6+k*0.2)+'s');});
    s+=T(0,y2+44+2*34+18,'a 5× lift: specific to the clip','t-lav mid fade','start','--d:2s');
    el.innerHTML=svg(W,y2+44+2*34+28,s);
  }

  /* ---------- Finding 03: two minds, one clip ---------- */
  function minds(el){
    var W=cw(el,300,700),narrow=W<520,s='',na=narrow?10:20,nq=4,no=4,gap=10;
    var aw=narrow?0:150,sx1=W-aw,unit=(sx1-2*gap)/(na+nq+no),H=narrow?344:300;
    s+=T(0,16,'Q: “Identify the source of the roars.”','t-ink mid')+T(0,34,'options: Lion / Dog / Wolf / Bear','sm');
    var LIT_A=narrow?[1,2,4,5,7,8]:[1,2,3,5,6,8,11,12,13,16,18];
    var strips=[['Hearing the clip','audio',LIT_A,[0],'Lion, correct','chip'],['Reading its own caption','its caption',[],[0],'Wolf, wrong','chip-p']];
    var top=58,sh=44,blk=narrow?150:116;
    strips.forEach(function(st,k){var y=top+k*blk,i,xs=0,lit;
      s+=T(0,y+12,st[0],'t-ink mid');
      var cy=y+22;
      for(i=0;i<na+nq+no;i++){var seg=i<na?0:i<na+nq?1:2,x=i*unit+(seg>0?gap:0)+(seg>1?gap:0);
        s+='<rect class="cell-0" x="'+n1(x+1)+'" y="'+cy+'" width="'+n1(unit-2)+'" height="'+sh+'" rx="3"/>';
        lit=(seg===0&&st[2].indexOf(i)>=0)||(seg===2&&st[3].indexOf(i-na-nq)>=0);
        if(lit){var op=seg===2?0.9:(0.55+0.45*((i*7)%5)/4);
          s+='<rect class="d-mint pop" style="--d:'+(0.3+i*0.06).toFixed(2)+'s;fill-opacity:'+op.toFixed(2)+'" x="'+n1(x+1)+'" y="'+cy+'" width="'+n1(unit-2)+'" height="'+sh+'" rx="3"/>';}}
      var lab=function(a,b,t){var xm=(a+b)/2;return T(xm,cy+sh+18,t,'sm','middle');};
      s+=lab(0,na*unit,st[1])+lab(na*unit+gap,(na+nq)*unit+gap,'question')+lab((na+nq)*unit+2*gap,(na+nq+no)*unit+2*gap,'options');
      var cxa,cya;if(narrow){cxa=W/2;cya=cy+sh+50;s+=T(cxa-78,cya+5,'answers','','end');cxa=cxa+8;}else{cxa=sx1+aw/2+8;cya=cy+sh/2;s+=T(cxa,cya-26,'answers','','middle');}
      s+='<g class="pop"'+D(1.8+k*0.4)+'>'+chip(cxa,cya,st[4],st[5],15)+'</g>';
    });
    if(!narrow) s+=T(0,H-6,'lit: the word “lion” in the readout','sm');
    el.innerHTML=svg(W,H,s);
  }
  function role(el){
    var W=cw(el,280,460),s='',lw=96,mx=W-lw-58;
    s+=T(0,16,'Correct speaker role','t-ink mid')+T(0,34,'on the 27 clips where the two minds disagree','sm');
    [['hearing it',88.9,'d-mint','t-mint'],['its caption',70.4,'d-peach','t-peach']].forEach(function(r,k){var y=66+k*36,w=mx*r[1]/100;
      s+=T(0,y+5,r[0],k===0?'t-ink':'');
      s+='<rect class="'+r[2]+' grow"'+D(0.2+k*0.2)+' x="'+lw+'" y="'+(y-11)+'" width="'+n1(w)+'" height="22" rx="5"/>';
      s+=T(lw+w+8,y+5,r[1].toFixed(1)+'%',r[3]+' mid fade','start','--d:'+(0.6+k*0.2)+'s');});
    var y2=160;
    s+=T(0,y2,'Affects it reads from the sound','t-ink mid')+T(0,y2+18,'33 of 39 are absent from the caption mind','sm');
    var per=Math.max(8,Math.min(13,Math.floor((W+4)/20))),sp=Math.min(20,(W-4)/per);
    for(var i=0;i<39;i++){var c=i%per,r=Math.floor(i/per),on=i<33;
      s+='<circle class="'+(on?'d-mint':'dot0')+' pop"'+D(0.9+i*0.03)+' cx="'+n1(8+c*sp)+'" cy="'+(y2+42+r*sp)+'" r="'+(sp*0.36).toFixed(1)+'"/>';}
    var rowsN=Math.ceil(39/per);
    el.innerHTML=svg(W,y2+42+(rowsN-1)*sp+16,s);
  }

  /* ---------- Finding 04: the gap, layer by layer (Fig. 5 data) ---------- */
  var GAP=[1.43,5,2.86,7.86,7.86,2.86,10,10.71,9.29,10,8.57,15.71,8.57,12.14,13.57,15.71,8.57,17.86,15,15,11.43,13.57,15,11.43,10,9.29,10,7.14,7.14,15,11.43,10.71,7.86,8.57,13.57,15,12.86,11.43,12.86,12.14,20.71,15,13.57,17.14,19.29,16.43,25.71,19.29,14.29];
  var NS={0:1,1:1,2:1,3:1,4:1,5:1,10:1,16:1,27:1,28:1,32:1,33:1};
  /* 95% bootstrap band, as plotted: [depth %, points] around the polygon */
  var CI=[[0,10.71],[0,-7.86],[2,-4.29],[4,-5.71],[6,-2.14],[8,-1.43],[10,-7.14],[12,1.43],[15,1.41],[17,0.71],[19,0],[21,-1.43],[23,7.14],[25,-0.71],[27,3.55],[29,3.57],[31,5.71],[33,-0.71],[35,9.29],[38,5.71],[40,6.43],[42,2.14],[44,3.57],[46,5.71],[48,2.14],[50,0.71],[52,0],[54,0.71],[56,-2.86],[58,-2.14],[60,7.13],[62,2.13],[65,1.43],[67,-1.43],[69,-0.71],[71,4.29],[73,5.71],[75,3.57],[77,2.14],[79,3.57],[81,2.86],[83,12.14],[85,6.43],[88,4.29],[90,7.86],[92,10],[94,6.43],[96,16.43],[98,9.29],[100,5.71],[100,23.57],[98,29.29],[96,35],[94,25.71],[92,28.57],[90,25.71],[88,22.86],[85,23.57],[83,29.29],[81,20.71],[79,22.14],[77,20.73],[75,22.14],[73,25],[71,24.29],[69,18.57],[67,16.43],[65,19.29],[62,20.71],[60,23.57],[58,17.14],[56,17.14],[54,19.29],[52,17.86],[50,19.29],[48,20],[46,24.29],[44,24.29],[42,20.71],[40,24.29],[38,24.29],[35,26.43],[33,17.86],[31,25],[29,22.86],[27,20.71],[25,17.86],[23,24.29],[21,18.59],[19,20],[17,17.86],[15,20.71],[12,19.29],[10,12.14],[8,17.86],[6,17.14],[4,11.43],[2,15]];
  function onset(el){
    var W=cw(el,300,760),narrow=W<520,H=narrow?320:350,m={l:narrow?34:44,r:8,t:58,b:narrow?62:52},s='',i;
    var lo=-10,hi=36,P=function(p){return m.l+(W-m.l-m.r)*p/100;},X=function(i){return P(Math.round(i*100/48));},Y=function(v){return m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));};
    s+=T(0,16,'The gap the sound adds, layer by layer','t-ink mid')+T(0,34,'real clip minus silence, points of balanced accuracy','sm');
    s+='<rect class="bandbg" x="'+n1(P(35))+'" y="'+m.t+'" width="'+n1(P(80)-P(35))+'" height="'+(H-m.t-m.b)+'"/>';
    s+=T((P(35)+P(80))/2,m.t+16,'middle layers','band-l sm','middle');
    [0,10,20,30].forEach(function(v){s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+n1(Y(v))+'" y2="'+n1(Y(v))+'"/>'+T(m.l-8,Y(v)+4,(v>0?'+':'')+v,'sm','end');});
    s+='<line class="zero" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+n1(Y(0))+'" y2="'+n1(Y(0))+'"/>';
    [0,20,40,60,80,100].forEach(function(p){s+=T(P(p),H-m.b+20,p+'%','sm','middle');});
    s+=T((m.l+W-m.r)/2,H-m.b+38,'depth, input to output','sm','middle');
    s+='<path class="ci fade"'+D(0.2)+' d="M'+CI.map(function(q){return n1(P(q[0]))+' '+n1(Y(q[1]));}).join('L')+'Z"/>';
    s+='<line class="on12 fade"'+D(1.2)+' x1="'+n1(P(12))+'" x2="'+n1(P(12))+'" y1="'+m.t+'" y2="'+(H-m.b)+'"/>';
    var d='M'+n1(X(0))+' '+n1(Y(GAP[0]));for(i=1;i<49;i++)d+='L'+n1(X(i))+' '+n1(Y(GAP[i]));
    s+='<path class="l-ice draw"'+D(0.3)+' d="'+d+'"/>';
    for(i=0;i<49;i++) s+='<circle class="'+(NS[i]?'m-ns':'m-sig')+' pop"'+D(0.35+i*0.03)+' cx="'+n1(X(i))+'" cy="'+n1(Y(GAP[i]))+'" r="'+(narrow?2.8:3.6)+'"/>';
    var ly=Y(narrow?-6.5:30);
    s+=T(P(12)+6,ly,narrow?'significant from ~12%':'significant from ~12% depth','t-peach sm fade','start','--d:1.4s;font-weight:600');
    var lgx=narrow?0:W-m.r-252,lgy=narrow?H-4:m.t-16;
    if(!narrow){s+='<circle class="m-sig" cx="'+(lgx+6)+'" cy="'+(lgy-4)+'" r="4"/>'+T(lgx+14,lgy,'significant: 37 of 49','sm')+'<circle class="m-ns" cx="'+(lgx+152)+'" cy="'+(lgy-4)+'" r="4"/>'+T(lgx+160,lgy,'not','sm');}
    else{s+='<circle class="m-sig" cx="6" cy="'+(lgy-4)+'" r="4"/>'+T(14,lgy,'significant: 37 of 49','sm')+'<circle class="m-ns" cx="160" cy="'+(lgy-4)+'" r="4"/>'+T(168,lgy,'not','sm');}
    el.innerHTML=svg(W,H,s);setLens(el);
  }
  function rank(el){
    var W=cw(el,280,460),s='',lw=100,mx=W-lw-70;
    s+=T(0,16,'Rank of the right answer','t-ink mid')+T(0,34,'median, among 152,064 tokens; lower is better','sm');
    var L=function(v){return lw+mx*(Math.log(v)-Math.log(1000))/(Math.log(100000)-Math.log(1000));};
    [1000,10000,100000].forEach(function(v){s+='<line class="grid" x1="'+n1(L(v))+'" x2="'+n1(L(v))+'" y1="50" y2="152"/>'+T(L(v),170,v===1000?'1,000':v===10000?'10,000':'100,000','sm','middle');});
    [['real clip','#2,297',2297,'d-mint','t-mint'],['mismatched','#5,040',5040,'d-lav','t-lav'],['silence','#26,241',26241,'d-peach','t-peach']].forEach(function(r,k){var y=70+k*32,w=L(r[2])-lw;
      s+=T(0,y+5,r[0],k===0?'t-ink':'');
      s+='<rect class="'+r[3]+' grow"'+D(0.2+k*0.2)+' x="'+lw+'" y="'+(y-10)+'" width="'+n1(w)+'" height="20" rx="5"/>';
      s+=T(lw+w+8,y+5,r[1],r[4]+' mid fade','start','--d:'+(0.6+k*0.2)+'s');});
    el.innerHTML=svg(W,178,s);
  }
  function patch(el){
    var W=cw(el,280,460),s='',lw=104,sp=Math.min(20,(W-lw-74)/10),rad=Math.min(7,sp*0.34);
    s+=T(0,16,'Patch the sound back in','t-ink mid')+T(0,34,'answers restored, of 10 clips','sm');
    [['early layers',10],['middle layers',9],['late layers',0]].forEach(function(r,k){var y=64+k*32;
      s+=T(0,y+5,r[0],k===1?'t-ink':'');
      for(var i=0;i<10;i++){var on=i<r[1];s+='<circle class="'+(on?'d-mint':'dot0')+' pop"'+D(0.3+k*0.35+i*0.04)+' cx="'+n1(lw+rad+i*sp)+'" cy="'+y+'" r="'+n1(rad)+'"/>';}
      s+=T(lw+9*sp+2*rad+10,y+5,r[1]+' of 10',(r[1]?'t-mint ':'t-peach ')+'mid fade','start','--d:'+(0.7+k*0.35).toFixed(2)+'s');});
    el.innerHTML=svg(W,140,s);
  }
  var ABL={0:65,2:2.5,3:2.5,4:2.5,6:2.5,7:2.5,9:7.5,10:2.5,16:2.5,21:5,23:2.5,25:2.5,28:7.5,29:2.5,31:2.5,34:10,35:7.5,36:5,37:2.5,38:10,43:7.5,47:7.5};
  function ablate(el){
    var W=cw(el,300,1060),narrow=W<520,m={l:narrow?84:104,r:8,t:58,b:40},H1=narrow?250:270,s='',i;
    var X=function(l){return m.l+(W-m.l-m.r)*(l+0.5)/48;},bw=(W-m.l-m.r)/48*0.62,Y=function(v){return m.t+(H1-m.t-m.b)*(1-v/70);};
    s+=T(0,16,'Accuracy lost when one layer is deleted','t-ink mid')+T(0,34,'points, over 40 clips','sm');
    s+='<rect class="bandbg" x="'+n1(X(17)-(W-m.l-m.r)/96)+'" y="'+m.t+'" width="'+n1(X(38)-X(17)+(W-m.l-m.r)/48)+'" height="'+(H1-m.t-m.b)+'"/>';
    [0,20,40,60].forEach(function(v){s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+n1(Y(v))+'" y2="'+n1(Y(v))+'"/>'+T(m.l-8,Y(v)+4,v,'sm','end');});
    s+='<line class="on12 fade"'+D(1.2)+' x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+n1(Y(10))+'" y2="'+n1(Y(10))+'"/>';
    for(i=0;i<48;i++){var v=ABL[i];if(!v)continue;var h=Y(0)-Y(v);
      s+='<rect class="'+(i===0?'ab0':'ab')+' growy"'+D(0.2+i*0.025)+' x="'+n1(X(i)-bw/2)+'" y="'+n1(Y(v))+'" width="'+n1(bw)+'" height="'+n1(h)+'" rx="1.5"/>';}
    s+=T(X(0)+bw,Y(62),'layer 0: 65 points','t-peach mid fade','start','--d:.6s');
    s+=T(W-m.r,Y(10)-8,'every interior layer: at most 10','sm fade','end','--d:1.3s');
    [0,10,20,30,40,47].forEach(function(l){s+=T(X(l),H1-m.b+18,l,'sm','middle');});
    s+=T((m.l+W-m.r)/2,H1-m.b+36,'deleted layer','sm','middle');
    var y0=H1+40,lh=34,lanes=[['perception',[0,1]],['retrieval',[]],['delivery',[0,47]]];
    s+=T(0,y0-14,'Which ability one deleted layer breaks','t-ink mid');
    var hw=(W-m.l-m.r)/96,lx0=X(0)-hw,lx1=X(47)+hw;
    lanes.forEach(function(ln,k){var y=y0+k*lh;
      s+=T(0,y+16,ln[0],'');
      s+='<rect class="lane" x="'+n1(lx0)+'" y="'+(y+4)+'" width="'+n1(lx1-lx0)+'" height="16" rx="4"/>';
      ln[1].forEach(function(l){s+='<rect class="lost pop"'+D(1.4+k*0.2)+' x="'+n1(X(l)-hw+0.5)+'" y="'+(y+4)+'" width="'+n1(2*hw-1)+'" height="16" rx="3"/>';});
      if(!ln[1].length) s+=T((lx0+lx1)/2,y+16,'no single layer breaks it','sm fade','middle','--d:1.8s');});
    el.innerHTML=svg(W,y0+3*lh+6,s);
  }

  /* ---------- Finding 05: where a hallucination is born ---------- */
  function halluc(el){
    var W=cw(el,300,1060),narrow=W<520,s='',i,ds=narrow?14:24,rad=ds*0.37;
    var zones=[['early layers',0,0.35,46],['middle layers',0.35,0.8,10],['late layers',0.8,1,17]];
    var cols=zones.map(function(z){return Math.max(2,Math.floor(((z[2]-z[1])*W-12)/ds));});
    var rows=zones.map(function(z,k){return Math.ceil(z[3]/cols[k]);}),maxr=Math.max.apply(null,rows);
    var top=narrow?110:84,base=top+maxr*ds+10,H=base+(narrow?52:32);
    s+=T(0,16,'Where the wrong concept takes over','t-ink mid');
    s+=narrow?T(0,34,'73 clips: right from the sound,','sm')+T(0,50,'wrong from its caption','sm'):T(0,34,'73 clips it answers right from the sound and wrong from its caption','sm');
    var mx=0.12*W;
    s+=narrow?'<line class="on12 fade"'+D(1.6)+' x1="'+n1(mx)+'" x2="'+n1(mx)+'" y1="'+n1(base-rows[0]*ds-2)+'" y2="'+(base+4)+'"/>':'<line class="on12 fade"'+D(1.6)+' x1="'+n1(mx)+'" x2="'+n1(mx)+'" y1="'+(top-26)+'" y2="'+(base+4)+'"/>';
    zones.forEach(function(z,k){var x0=z[1]*W+6,x1=z[2]*W-6;
      if(k>0) s+='<line class="ax" x1="'+n1(z[1]*W)+'" x2="'+n1(z[1]*W)+'" y1="'+(base-2)+'" y2="'+(base+10)+'"/>';
      for(i=0;i<z[3];i++){var c=i%cols[k],r=Math.floor(i/cols[k]);
        s+='<circle class="d-peach pop"'+D(0.2+(k*46+i)*0.018)+' cx="'+n1(x0+rad+c*ds)+'" cy="'+n1(base-rad-r*ds)+'" r="'+n1(rad)+'"/>';}
      s+=T(x0,base-rows[k]*ds-12,z[3]+' clips',(k===0?'t-peach':'t-ink')+' mid fade','start','--d:'+(1+k*0.3)+'s');
      s+=T(x0,base+22,z[0],k===1?'band-l sm':'sm','start');});
    s+='<line class="ax" x1="0" x2="'+W+'" y1="'+(base+4)+'" y2="'+(base+4)+'"/>';
    if(narrow) s+=T(0,base+44,'dashed: median onset, 12% depth','t-peach sm fade','start','--d:1.8s;font-weight:600');
    else s+=T(mx+6,top-14,'median onset: 12% depth','t-peach sm fade','start','--d:1.8s;font-weight:600');
    el.innerHTML=svg(W,H,s);
  }

  var charts=[['#ch-idea-cot',function(e){idea(e,false);}],['#ch-idea-ws',function(e){idea(e,true);}],['#ch-lens',lens],['#ch-swap',swap],['#ch-chain',chain],['#ch-share',share],['#ch-minds',minds],['#ch-role',role],['#ch-onset',onset],['#ch-rank',rank],['#ch-patch',patch],['#ch-ablate',ablate],['#ch-halluc',halluc]];
  function build(){charts.forEach(function(c){var el=$(c[0]);if(el)c[1](el);});}
  build();
  var fold=$('#ablate-more');
  if(fold)fold.addEventListener('toggle',function(){if(fold.open){var el=$('#ch-ablate');ablate(el);el.classList.remove('in');requestAnimationFrame(function(){requestAnimationFrame(function(){if(io)io.observe(el);else el.classList.add('in');});});}});
  var lastW=window.innerWidth,rt=0;
  window.addEventListener('resize',function(){if(Math.abs(window.innerWidth-lastW)<30)return;clearTimeout(rt);rt=setTimeout(function(){lastW=window.innerWidth;build();},180);});

  /* the transcript types itself out */
  var asr=$('#rm-asr'),typer=0;
  function typeASR(){
    if(!asr) return; clearInterval(typer);
    var txt=asr.getAttribute('data-text').replace('&mdash;','—'), i=0;
    asr.textContent='';
    typer=setInterval(function(){i++;asr.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(typer);},70);
  }

  /* in view: animate; out of view: reset, so it plays again on return */
  var io=null;
  if(hasIO&&!reduced){
    io=new IntersectionObserver(function(es){es.forEach(function(e){
      var el=e.target;
      if(e.isIntersecting&&e.intersectionRatio>=0.18){if(!el.classList.contains('in')){el.classList.add('in');if(el.id==='rm-out')typeASR();}}
      else if(!e.isIntersecting){el.classList.remove('in');if(el.id==='rm-out'&&asr){clearInterval(typer);asr.textContent='';}}
    });},{threshold:[0,0.18,0.4]});
    $$('.anim,.reveal').forEach(function(el){io.observe(el);});
    var pio=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('paused',!e.isIntersecting);});},{threshold:0.02});
    $$('.pausable').forEach(function(el){el.classList.add('paused');pio.observe(el);});
  }else{
    $$('.anim,.reveal').forEach(function(el){el.classList.add('in');});
  }
})();
</script>
