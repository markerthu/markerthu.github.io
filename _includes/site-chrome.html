<!-- Site-wide chrome. One masthead size everywhere (the homepage's original size: name 21.6px, links 15.7px), and the
     floating buttons (AI agent, dark mode, back to top) on the homepage only. Included after each
     page's own styles; !important so older per-page rules cannot win. Block comments only. -->
<style>
.masthead-title{font-size:21.6px!important;font-weight:800!important;letter-spacing:-.02em}
.masthead-nav{display:flex;gap:2px;align-items:center}
.masthead-nav a{font-size:15.7px!important;font-weight:600!important;padding:6px 10px!important;margin:0!important;letter-spacing:0!important}
@media(max-width:560px){.masthead-title{font-size:18.4px!important}.masthead-nav a{font-size:13.8px!important;padding:5px 8px!important}}
{% unless include.home %}
/* Film posters: the play button sits bottom-right so it never covers the title printed on the poster. */
a[href^="/film/"] .play{left:auto!important;top:auto!important;right:28px!important;bottom:24px!important;margin:0!important}
@media(max-width:560px){a[href^="/film/"] .play{right:14px!important;bottom:12px!important}}

/* Project pages: one venue label above the title, the same on every published paper. */
.hero p.venue{font-size:14px;line-height:1.5;font-weight:600;color:var(--mint-t);margin:0 0 12px;font-variant-numeric:tabular-nums}

/* One typeface outside the homepage (his 11-19 call: the serif pages "不好看"); Inter carries the hierarchy by weight. */
:root,body,body.dark-mode{--serif:'Inter','Inter Fallback','Segoe UI',system-ui,-apple-system,sans-serif!important}
.pg-fab,.ra-btn,.ra-tip,.ra-panel,.dark-toggle,.scroll-top,#pg-dark,#pg-top,#ra-btn,#ra-tip,#darkToggle{display:none!important}
{% endunless %}</style>
