<!-- Project film card: poster + play, opens the live film. Usage: include film-card.html id="speechgym" name="SpeechGym" -->
<style>
.film-card{position:relative;display:block;margin:1.6em 0 .4em;border-radius:12px;overflow:hidden;background:#09090a;aspect-ratio:16/9;text-decoration:none !important;border:1px solid rgba(201,166,107,.22);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.film-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.2);border-color:rgba(201,166,107,.5)}
.film-card:focus-visible{outline:2px solid #c9a66b;outline-offset:3px}
.film-card img{display:block;width:100%;height:100%;object-fit:cover;margin:0;border:0;border-radius:0}
.film-card .fc-play{position:absolute;right:16px;bottom:12px;width:52px;height:52px;border-radius:50%;border:1px solid rgba(236,230,218,.6);background:rgba(9,9,10,.55);backdrop-filter:blur(4px);transition:background .25s ease,transform .25s ease}
.film-card .fc-play::after{content:'';position:absolute;left:21px;top:16px;border-left:14px solid #ece6da;border-top:9px solid transparent;border-bottom:9px solid transparent}
.film-card:hover .fc-play{background:rgba(201,166,107,.35);transform:scale(1.06)}
.film-card .fc-label{position:absolute;left:16px;bottom:12px;font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.24em;color:#c9a66b;background:rgba(9,9,10,.6);padding:7px 10px;border-radius:999px}
@media (max-width:600px){.film-card .fc-play{width:44px;height:44px;right:12px;bottom:10px}.film-card .fc-play::after{left:16px;top:12px;border-left-width:14px;border-top-width:9px;border-bottom-width:9px}}
@media (prefers-reduced-motion:reduce){.film-card,.film-card .fc-play{transition:none}.film-card:hover{transform:none}}
</style>
<a class="film-card" href="/film/?s={{ include.id }}" aria-label="Watch the {{ include.name }} project film">
  <img src="/film/posters/{{ include.id }}.jpg" alt="" width="1280" height="720" loading="lazy" decoding="async">
  <span class="fc-play" aria-hidden="true"></span>
  <span class="fc-label">WATCH THE FILM</span>
</a>
