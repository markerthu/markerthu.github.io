<!-- start Google Analytics 4 (gtag.js) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.analytics.google.tracking_id }}');
  /* gtag.js is large; fetch it once the page has loaded and the browser is idle.
     The queued commands above are sent when it arrives, so the page view is still counted. */
  (function(){
    function load(){
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}';
      document.head.appendChild(s);
    }
    function later(){ if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 }); else setTimeout(load, 1500); }
    if (document.readyState === 'complete') later(); else window.addEventListener('load', later, { once: true });
  })();
</script>
<!-- end Google Analytics 4 -->
