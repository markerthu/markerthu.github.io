<figcaption><b>How to read it.</b> One round of ADRPO on a batch. A sample&#8217;s advantage A is how far its reward sits above or below the batch average. Every sample starts from the same &#946;&#8320;, and its own A is taken off: samples above the average get a lighter divergence penalty, samples below it a heavier one, and the update uses each sample&#8217;s &#946;<sub>eff</sub> on the W2 (flow matching) or KL (LLM) term. Bar lengths are illustrative. Schematic.</figcaption>
