  <title id="owB-t">Why ORW-CFM-W2 regularizes with a W2 bound instead of KL</title>
  <desc id="owB-d">On the left, reward weighting alone would keep pulling the policy's distribution away from the base model toward the highest-reward mode. Two routes try to measure that gap. The KL route needs the model's likelihood, which is not tractable in flow matching, so its progress bar barely moves: standard KL regularization cannot be computed directly. The W2 route goes through a tractable upper bound derived for flow matching, finishes, and keeps the policy close to the base model, so the other modes stay.</desc>

<figcaption><b>How to read it.</b> Reward weighting alone would keep pulling the policy away from the base model. RL fine-tuning usually holds it back with a KL term, but KL needs likelihoods, and flow matching has no tractable likelihood. ORW-CFM-W2 measures the gap with the Wasserstein-2 distance instead, through an upper bound that is tractable in flow matching, and its theory connects the method back to KL-regularized RL. Schematic.</figcaption>
