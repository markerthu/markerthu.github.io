<figcaption><b>How to read it.</b> Neither behaviour is written into the reward; both come from scoring the sequence. On a multi-turn file-system task the trained agent navigates before it creates (<code>cd</code> first, then the file), while the correctness-only baseline recreates a directory that already exists and cascades through the resulting state errors. After a failed call, the agent retries along a corrected path. Call names other than <code>cd</code> are illustrative. Schematic.</figcaption>
