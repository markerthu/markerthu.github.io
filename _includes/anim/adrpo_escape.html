  <title id="adC-t">Escaping a local optimum by actively increasing exploration</title>
  <desc id="adC-d">A cartoon reward landscape with a small hill and a taller hill. ADRPO first moves to lower entropy: the policy and a tight cloud of its samples sit on the small hill, a local optimum. It then actively increases exploration and the samples spread out; one sample lands on the slope of the taller hill, a promising direction. Finally the policy converges on the taller hill, a high-reward solution, with exploration still above its low point. GRPO keeps high entropy throughout, its samples spread wide, but its reward stays low.</desc>
