<figcaption><b>How to read it.</b> Without guidance for the reasoning process, hallucinated, inconsistent steps creep into the chain and their errors accumulate, so the longer the base model reasons the worse it does &mdash; test-time inverse scaling. CESAR rewards the reasoning process itself, its steps stay consistent, and extra reasoning becomes a gain, up to a sweet spot. Slopes are the fitted MMAU scaling slopes from Figure&nbsp;3; the traces are qualitative. Schematic.</figcaption>
