<figcaption><b>How to read it.</b> Numbers are each call&rsquo;s position in the expected order. A binary match is all-or-nothing, so a nearly right order scores the same as an invalid one; the procedural term scores order with normalized discounted cumulative gain, which ranks partially-correct orderings above invalid ones. Its final-state check credits a rollout that reaches the correct state, so a reasonable detour is not punished. Bar lengths are illustrative. Schematic.</figcaption>
