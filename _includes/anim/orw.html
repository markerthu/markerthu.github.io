<figcaption><b>How to read it.</b> Reward-weighted fine-tuning alone collapses onto a single mode (&alpha; = 0). The Wasserstein-2 term keeps the policy near the base model, and &alpha; is a smooth knob: 0.3 gives a balanced trade-off, 0.8 keeps high diversity with reward still near optimal, as in the paper's controlled study, where all five even digits are rewarded equally. Schematic.</figcaption>
