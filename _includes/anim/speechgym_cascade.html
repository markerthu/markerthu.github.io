<p class="sgC-take">One cascade, not three problems &#8212; and every link already has a free reward channel.</p>
<figcaption><b>How to read it.</b> Over audio the failures are perceptual, and they chain: a mis-heard argument produces a tool error, the error produces a retry, and the retries use up the step budget before the task can finish. The bars under each stage are speech versus text on the same tasks, drawn to scale; the ID is illustrative. Every link already has a free reward channel &#8212; the opening for the per-turn reward below. Schematic.</figcaption>
