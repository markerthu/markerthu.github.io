  <title id="pzB-t">ProteinZero: the supervised objective versus the design goal</title>
  <desc id="pzB-d">An inverse-folding model takes a target backbone and writes a sequence. Supervised training scores the sequence by sequence recovery, comparing it letter by letter with the curated native sequence. The design goal is different: the designed sequence should refold to the target backbone, checked with ESMFold, and be predicted stable, checked with the fast ddG predictor. ProteinZero rewards that goal directly, so the model can learn from its own designs without labeled data.</desc>

<svg class="pzBn" viewBox="0 0 400 604" role="img" aria-labelledby="pzBn-t pzBn-d" xmlns="http://www.w3.org/2000/svg">
  <title id="pzBn-t">ProteinZero: the supervised objective versus the design goal</title>
  <desc id="pzBn-d">An inverse-folding model takes a target backbone and writes a sequence. Supervised training scores the sequence by sequence recovery, comparing it letter by letter with the curated native sequence. The design goal is different: the designed sequence should refold to the target backbone, checked with ESMFold, and be predicted stable, checked with the fast ddG predictor. ProteinZero rewards that goal directly, so the model can learn from its own designs without labeled data.</desc>

<figcaption><b>How to read it.</b> Given a target backbone, an inverse-folding model writes a sequence. Supervised training grades it by sequence recovery &mdash; how many letters match the curated native sequence. The design goal is different: the sequence should refold to the target backbone (ESMFold) and be predicted stable (fast ddG). ProteinZero rewards that goal directly, which needs no curated label, so the model can keep learning from its own designs. Schematic; the sequences are illustrative.</figcaption>
</figure>
