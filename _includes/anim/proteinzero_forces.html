  <desc id="pzC-d">ProteinZero's objective has three terms. A cloud of designs starts at the reference model. The reward from ESMFold and the fast ddG predictor pulls it toward foldable, stable designs, and on its own lets the designs bunch together; the KL term to the reference model keeps the policy from drifting far; the separate embedding-level diversity term spreads the designs apart inside the foldable, stable region. Kept as its own term, diversity comes at roughly no cost in success rate, while adding diversity to the reward instead costs more than ten points of success rate. The spread is exaggerated for visibility: measured diversity is 0.306 with the term, 0.268 without it, and 0.281 for the base model.</desc>

<figcaption><b>How to read it.</b> Each dot is a design. The reward (ESMFold + fast ddG) pulls the designs toward foldable, stable sequences, but on its own lets them bunch up; the KL term keeps the policy near the reference model; the diversity term, defined on sequence embeddings and kept separate from the reward, spreads them apart. Measured diversity is 0.306 with the term and 0.268 without it (base model 0.281) &mdash; the spread in the picture is exaggerated for visibility. Schematic.</figcaption>
