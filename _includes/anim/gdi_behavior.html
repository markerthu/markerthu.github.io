  <title id="gdC-t">GDI: a selective distribution over a family of behavior policies</title>

<figcaption><b>How to read it.</b> GDI models the behavior policy explicitly as a family whose capacity and diversity it controls &mdash; drawn here from more exploratory to more exploitative. Each time, the policy that collects data is drawn from a selective (sampling) distribution over the family, and a monotonic data distribution optimization reshapes that distribution during training. Capacity and diversity serve data richness; the fine-grained, adaptive selection serves the exploration&#8211;exploitation trade-off. Schematic.</figcaption>
