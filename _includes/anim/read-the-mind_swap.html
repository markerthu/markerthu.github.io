<figcaption><b>How to read it.</b> The two columns on the right are two possible explanations, not two outputs of the model. The control keeps the printed text identical and changes only the sound. A readout that only reflects a prior over the printed answer options cannot tell the two inputs apart and would come out the same (dashed); a genuinely audio-driven readout differs between the sounds. In the paper the readout follows the sound: it is best with the real clip, weaker with a mismatched clip, and at chance with silence. Option letters are placeholders. Schematic.</figcaption>

    try{ svg.setCurrentTime(10.80); svg.pauseAnimations(); }catch(e){} return; }
  if('IntersectionObserver' in window){
    var seen=false;
    new IntersectionObserver(function(es){ es.forEach(function(e){
      try{

        svg.unpauseAnimations();
      }catch(_){}
    }); },{threshold:0.35}).observe(svg);
  }
})();
