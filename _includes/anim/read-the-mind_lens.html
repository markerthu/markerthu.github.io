<figcaption><b>How to read it.</b> Each column is a layer, each row a position in the input; the audio-token positions come before the question and options and cannot see them. Before anything is emitted, the logit lens takes the hidden states at the audio-token positions of a middle layer and passes them through the model&#8217;s own output head, so they read out as a word &#8212; here &#32654;&#22269;&#24635;&#32479; (&#8220;US president&#8221;), the role that reaches rank 1 at the audio positions of the Nixon clip below. The answer slot is still empty: nothing has been said yet. Layers and positions are drawn for illustration. Schematic.</figcaption>
