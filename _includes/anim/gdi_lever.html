  <title id="gdB-t">GDI: two challenges, one lever</title>
  <desc id="gdB-d">Two challenges, sample efficiency and final performance, which previous work usually handled one at a time, are decoupled into two classic RL problems, data richness and the exploration-exploitation trade-off. Both are cast into one problem, training data distribution optimization: obtaining the desired training data within limited interactions. That problem is addressed by two controls: the capacity and diversity of the behavior policy, and a fine-grained, adaptive sampling distribution. Result: performance comparable to Agent57's with 500 times less data.</desc>

<figcaption><b>How to read it.</b> Higher sample efficiency and superior final performance are hard to get at once, and previous work usually managed one. GDI decouples them into data richness and the exploration&#8211;exploitation trade-off, casts both into a single problem &mdash; optimizing the training data distribution &mdash; and solves it through the behavior policy: its capacity and diversity, and how it is sampled. Schematic.</figcaption>
