  <title id="afB-t">AC-Flow: the dual-stability mechanism over training</title>
  <desc id="afB-d">Training time runs left to right. In the warm-up phase the critic learns to predict future reward and its estimates settle, while the actor, the flow model being fine-tuned, is not yet steered by it. After warm-up the critic's advantages reach the actor: at each point in training an advantage drops from the critic straight down to the actor. Advantages that fall outside the clip range are cut back to it, so they cannot cause destructive policy updates.</desc>

<figcaption><b>How to read it.</b> Time runs left to right over training. During warm-up the critic learns to predict future reward while the actor is not yet steered by it; only once the critic has matured do its advantages (navy dots) drop to the actor, each at its own point in training, and advantage clipping cuts back any that fall outside the clip range (dashed part), preventing destructive policy updates. Heights are qualitative. Schematic.</figcaption>

<script>
(function(){
  var svg=document.querySelector('svg.afB'); if(!svg||!svg.pauseAnimations) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    try{ svg.setCurrentTime(10.80); svg.pauseAnimations(); }catch(e){} return; }
  if('IntersectionObserver' in window){
    var seen=false;
    new IntersectionObserver(function(es){ es.forEach(function(e){
      try{
        if(!e.isIntersecting){ svg.pauseAnimations(); return; }
        if(!seen){ seen=true; svg.setCurrentTime(0); }
        svg.unpauseAnimations();
      }catch(_){}
    }); },{threshold:0.35}).observe(svg);
  }
})();
</script>
