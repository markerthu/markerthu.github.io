<figcaption><b>How to read it.</b> Each row is one denoising chain from noise to image. An outcome reward alone arrives only at the end, so the model cannot tell which step earned it (the credit assignment problem). A critic fit by direct regression on cumulative rewards scores every step but often trains unstably and can collapse online (whiskers: how far each signal jumps). AC-Flow shapes the rewards into well-normalized signals, so its critic learns step-level values stably. Bar heights are qualitative. Schematic.</figcaption>
