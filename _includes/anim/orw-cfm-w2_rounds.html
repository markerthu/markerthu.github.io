<figcaption><b>How to read it.</b> Training is online: every round the model samples from its current self and weights those samples by reward, so the tilt toward high reward builds up round after round. With reward-weighting alone that ends in policy collapse onto a few high-reward modes. The Wasserstein-2 term keeps the policy near the base model (dashed outline), so training converges with the other modes still present; how near is the &alpha; knob shown further down. Schematic.</figcaption>
