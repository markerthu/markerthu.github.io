<figcaption><b>How to read it.</b> A fixed &beta; puts every sample on the same leash: strong enough to stop collapse is too strong for the good samples. ADRPO sets the strength per sample from its advantage A, so samples that are clearly better than the batch explore further and poor ones are held close. Schematic.</figcaption>

      try{
        if(!e.isIntersecting){ svg.pauseAnimations(); return; }
        if(!seen){ seen=true; svg.setCurrentTime(0); }
        svg.unpauseAnimations();
      }catch(_){}
    }); },{threshold:0.35}).observe(svg);
  }
})();
</script>
