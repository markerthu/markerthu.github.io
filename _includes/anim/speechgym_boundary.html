<p class="sgB-take">Both sides run locally: the success check becomes a training signal, and rollouts cost compute, not API calls.</p>
<figcaption><b>How to read it.</b> In evaluation-only frameworks a cascade of ASR, a text user simulator and TTS plays the caller to a closed realtime API: each call is billed, the benchmark gets a score, and nothing can be differentiated back through the API. SpeechGym puts open models on both sides of the call and keeps the text benchmark's tasks, tools and success check unchanged, so that success check now trains the agent. Schematic.</figcaption>
