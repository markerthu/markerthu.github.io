<script>
(function(){
  'use strict';

  /* ════════ KNOWLEDGE BASE ════════
     id      stable topic id (used by rel/follow-ups)
     nm      the paper's own names (scored above topical keywords)
     kw      retrieval keywords (phrases allowed; matched as whole words/phrases)
     a       answer variants (one is picked; never the same twice in a row)
     more    deeper detail served on "tell me more / why / how"
     rel     related topic ids the agent may proactively offer
     act     action chips rendered under the reply
     plain   a plain fact: no conversational opener                       */
  var KB = [
    { id:'focus', kw:['research','focus','interest','direction','work on','studying','topic','about you','what do you do'],
      a:["My research is about autonomous RL post-training for large generative models — making diffusion models, flow matching models, and multimodal LLMs continuously self-improve with minimal human supervision.",
         "In one line: I teach big generative models to improve themselves. Concretely — RL post-training for diffusion/flow models and multimodal reasoning LLMs, with as little human supervision as possible."],
      more:"The thread that connects everything: who supplies the learning signal when humans step away? My answers so far — reward-weighted matching (ORW-CFM-W2), adaptive regularization (ADRPO), intermediate feedback (AC-Flow), and process rewards for reasoning (CESAR).",
      rel:['cesar','orw'] },
    { id:'cesar', nm:['cesar'], kw:['audio','mmau','audio llm','audio llms','audio reasoning','process reward','process rewards','test-time inverse','inverse scaling','reasoning process','iclr 2026','amazon science'],
      a:["CESAR (ICLR 2026, also featured on Amazon Science) tackles a paradox we found in Audio LLMs: longer reasoning chains can actually hurt accuracy — test-time inverse scaling. We fix it with process-level rewards (GRPO) that grade the reasoning itself, not just the answer. Result: SOTA on MMAU, ahead of Gemini 2.5 Pro and GPT-4o Audio.",
         "That's our ICLR 2026 paper (now also on Amazon Science). Audio LLMs get worse when they think longer — we measured it, named it (test-time inverse scaling), and fixed it by rewarding the reasoning process instead of only outcomes. SOTA on MMAU."],
      more:"The key insight: outcome-only RL teaches models to ramble — verbose chains that drift off-task. Process rewards grade each intermediate step, so the model learns to think usefully. That's also why it scales: more test-time compute finally helps instead of hurting.",
      rel:['focus','adrpo'],
      act:[{t:'🔗 CESAR project page', h:'/projects/cesar/'},{t:'📄 Amazon Science', h:'https://www.amazon.science/publications/incentivizing-consistent-effective-and-scalable-reasoning-capability-in-audio-llms-via-reasoning-process-rewards'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2510.20867'}] },
    { id:'audiorsi', nm:['audiorsi','audio rsi','audio-rsi'], kw:['recursive self','recursive self-improvement','recursively','self-improving audio','self-critique','self critic','student and teacher','surpass its teacher','own teacher'],
      a:["AudioRSI (arXiv 2026) is, to our knowledge, the first recursively self-improving audio LLM. One model is both student and teacher: as the student it writes reasoning paths, and as the teacher it hears the same recording and compares them pair by pair, so its own judgments become a process-level reward added to the outcome reward. Every 200 steps the improved student becomes the teacher of its successor, as long as it has not regressed.",
         "That's our newest audio paper. The surprise behind it: trained by a frozen external judge that scores 74.6% on MMAU test-mini, the student ends at 75.1%, slightly above its teacher. So we let the student keep becoming the teacher, and the recursion reaches 76.1% with a 7B model and no external reward model."],
      more:"The teacher can hear the audio, so it can reject reasoning that cites a sound the recording does not contain, which a text-only judge would have to take on trust. And the recursion is what keeps it improving: with a frozen external judge, out-of-distribution accuracy plateaus, while a teacher refreshed from the student keeps it rising.",
      rel:['cesar','readmind'],
      act:[{t:'🔗 AudioRSI project page', h:'/projects/audiorsi/'},{t:'Watch the film', h:'/film/?s=audiorsi'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2610.36578'}] },
    { id:'tfopd', nm:['tf-opd','tfopd','training-free on-policy distillation'], kw:['training-free','training free','on-policy distillation','distillation','model merging','merge specialists','merging'],
      a:["Training-Free On-Policy Distillation (TF-OPD, arXiv 2026) merges RL specialists that share a base model into one model with zero gradient steps. Each linear layer of the merged model has to reproduce every specialist on the inputs that specialist sees while reading its own answers; that is least squares, solved exactly from second moments gathered in one forward pass over each specialist's kept answers to a few hundred training problems.",
         "It's the paper where, for specialists that share a base model, on-policy distillation stops needing training: on Olmo 3 7B, a math specialist and a code specialist merge into one model whose mean accuracy over seven math and code benchmarks (61.1) is higher than either specialist's (59.8 and 53.6), with about 10 GPU-hours of forward computation and linear algebra in total."],
      more:"The surprise is that the data matters more than the solver: a few of the math specialist's answers get stuck in repetition loops. They are 7% of its answers but 23% of its tokens, and dropping them takes the merged model on AIME25 from task-arithmetic level to the specialist's own level in the same number format.",
      rel:['audiorsi','pubs'],
      act:[{t:'🔗 TF-OPD project page', h:'/projects/tf-opd/'},{t:'Watch the film', h:'/film/?s=tf-opd'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2610.22236'}] },
    { id:'speechgym', nm:['speechgym','speech gym'], kw:['voice agent','voice agents','spoken agent','tau-voice','tau voice','native speech','native audio'],
      a:["SpeechGym (arXiv 2026) is about training voice agents with RL. Voice-agent benchmarks usually score a closed realtime API from the outside, so no gradient ever reaches the agent. SpeechGym makes both sides of the call local open models talking in native speech over an existing tool-use benchmark, so the agent can actually be trained — and a per-turn process reward fixes the first thing that breaks: at audio success rates almost every rollout group fails identically and teaches nothing.",
         "That's our newest agentic-RL paper: an audio-native gym where an open caller model and the voice agent talk in real speech, the agent calls tools against a live database, and the benchmark's own task check is the reward. Training in speech more than doubles task success on the τ-voice tasks."],
      rel:['readmind','cesar'],
      act:[{t:'🔗 SpeechGym project page', h:'/projects/speechgym/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2608.26432'}] },
    { id:'readmind', nm:['read the mind','read-the-mind'], kw:['logit lens','interpretability','mind of an audio','workspace','middle layer','middle layers','middle-layer'],
      a:["“Can We Read the Mind of an Audio LLM?” (arXiv 2026) looks inside a speech model while it listens. Reading Qwen3-Omni's middle layers with a logit lens at the audio-token positions, the answer to a spoken question is already legible — in words, across languages — before the model emits a single token.",
         "It's our interpretability paper on audio LLMs: the middle layers form a verbalizable, multilingual workspace, so you can read what the model has worked out even when it never writes its reasoning down."],
      rel:['speechgym','cesar'],
      act:[{t:'🔗 Read the Mind project page', h:'/projects/read-the-mind/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2608.24958'}] },
    { id:'parl', nm:['procedure-aware rl','procedure-aware','parl'], kw:['procedure','procedural','tool','tools','tool use','tool calling','function calling','colm','colm 2026','bfcl','api-bank','bamboogle','agent rl','toolrl'],
      a:["Procedure-Aware RL (COLM 2026) is about tool-using agents: RL that rewards only final correctness never teaches the model how to sequence its tool calls. We add a procedural reward — invocation-order quality plus a final-system-state check — and an error-aware penalty on top of GRPO.",
         "That's our COLM 2026 paper on tool-augmented LLMs. Same calls in the wrong order give the wrong final state, so we reward the order itself, not just the answer."],
      more:"With those rewards a 3B model beats the correctness-only RL baseline on BFCL-V3, API-Bank and Bamboogle, and lands in the same range as much larger proprietary models. It also learns to recover after a failed call — nothing in the reward asks for that.",
      rel:['focus','cesar'],
      act:[{t:'🔗 Procedure-Aware RL project page', h:'/projects/procedure-aware-rl/'},{t:'📄 OpenReview', h:'https://openreview.net/forum?id=d4wrBuJ4xo'}] },
    { id:'proteinzero', nm:['proteinzero','protein zero'], kw:['protein','proteins','protein design','inverse folding','tmlr','esmfold','cath'],
      a:["ProteinZero (TMLR 2026) lets a protein inverse-folding model improve from its own designs with online RL: ESMFold structure feedback plus a fast self-derived ddG proxy as the reward, and an embedding-level diversity regularizer so it does not collapse onto a few sequences. On CATH-4.3 it reaches success rates above 90% with 36–48% fewer design failures than prior models, and a full run fits on one 8-GPU node in about three days. The code is open source."],
      rel:['orw','adrpo'],
      act:[{t:'🔗 ProteinZero project page', h:'/projects/proteinzero/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2506.07459'},{t:'💻 Code', h:'https://github.com/ziwenwang28/ProteinZero'}] },
    { id:'lbc', nm:['lbc','learnable behavior control'], kw:['atari','world record','world records','record','records','superhuman','behavior control','exploration','bandit','iclr 2023'],
      a:["LBC (ICLR 2023 Oral, rank 5/4176) broke 24 Atari human world records with 1B frames — 100× less data than Agent57. The trick: a learnable hybrid behavior mapping plus a bandit meta-controller, which massively enlarges the space of behaviors the agent can explore.",
         "My favorite to talk about — LBC got an ICLR 2023 Oral (top 5%). We broke 24 Atari human world records using 100× less data than Agent57, by making behavior selection itself learnable instead of hand-designed."],
      more:"Why it works: population-based methods like Agent57 pick from a fixed, hand-designed set of policies. LBC instead learns a hybrid mapping over ALL policies and lets a bandit meta-controller choose — the effective behavior space explodes, and exploration quality with it. 10,077% mean human-normalized score.",
      rel:['gdi'],
      act:[{t:'🔗 LBC project page', h:'/projects/lbc/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2305.05239'}] },
    { id:'gdi', nm:['gdi','generalized data distribution iteration'], kw:['generalized data','distribution iteration','icml 2022'],
      a:["GDI (ICML 2022) makes one claim: the training data distribution is THE lever for RL efficiency. Optimize it directly and you get 9,620% mean human-normalized score on Atari with just 200M frames — about 500× less data than Agent57.",
         "GDI is the theory piece — it shows DQN through Agent57 are all special cases of one operator view, and that actively optimizing the data distribution is what really buys sample efficiency. 9,620% mean HNS at 200M frames."],
      more:"GDI frames RL as alternating between improving the policy and improving the DATA the policy learns from. Most algorithms only do the first implicitly. Making the second explicit — choosing what experience to learn from — is where the 500× efficiency comes from. LBC builds directly on this.",
      rel:['lbc'],
      act:[{t:'🔗 GDI project page', h:'/projects/gdi/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2206.03192'}] },
    { id:'adrpo', nm:['adrpo'], kw:['adaptive divergence','adaptive regularization','neurips 2025'],
      a:["ADRPO (NeurIPS 2025) makes KL regularization adaptive at the sample level — good samples get freedom to explore, bad ones get pulled back hard. With it, our 2B SD3 beats 12B FLUX and 4.8B SANA.",
         "The one-line pitch for ADRPO: stop regularizing every sample equally. Modulate the divergence penalty by sample value, and a 2B model out-generates 12B competitors. NeurIPS 2025, plug-and-play on any RL method."],
      more:"Fixed KL strength is always wrong in both directions — too tight kills exploration on promising samples, too loose lets bad samples drift into reward hacking. Sample-level adaptation resolves the dilemma, and it transfers across modalities (we show it on flow models and LLMs).",
      rel:['orw','acflow'],
      act:[{t:'🔗 ADRPO project page', h:'/projects/adrpo/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2510.18053'}] },
    { id:'orw', nm:['orw-cfm-w2','orw-cfm','orw'], kw:['cfm','wasserstein','flow matching rlhf','iclr 2025','online rlhf','rlhf'],
      a:["ORW-CFM-W2 (ICLR 2025) is the first online RLHF framework for flow matching models. No human data, no reward gradients — just a reward function, with Wasserstein-2 regularization to prevent collapse while keeping diversity.",
         "That's where my generative-model line started — ICLR 2025. Online reward-weighted fine-tuning for flow matching, with a tractable W2 bound that keeps the model from collapsing onto a single high-reward mode."],
      more:"The hard part was the W2 term: exact Wasserstein-2 between continuous flows is intractable, so we derived a tractable upper bound inside the flow matching objective. That bound is what balances exploitation (chase reward) against exploration (stay diverse).",
      rel:['adrpo','acflow'],
      act:[{t:'🔗 ORW-CFM-W2 project page', h:'/projects/orw-cfm-w2/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2502.06061'}] },
    { id:'acflow', nm:['ac-flow','acflow'], kw:['actor critic','actor-critic','intermediate feedback','dual-stability'],
      a:["AC-Flow brings actor-critic RL to flow matching: a critic provides feedback at intermediate timesteps, not just the final image. Dual-stability (advantage clipping + critic warm-up) keeps SD3 fine-tuning robust against reward hacking."],
      more:"Final-output rewards leave the credit-assignment problem to the very end — the model only hears 'good/bad' once the image is done. A critic at intermediate steps gives feedback along the way, and the dual-stability mechanism keeps that training stable, without collapse or reward hacking.",
      rel:['orw','adrpo'],
      act:[{t:'🔗 AC-Flow project page', h:'/projects/ac-flow/'},{t:'📎 arXiv', h:'https://arxiv.org/abs/2510.18072'}] },
    /* agentic RL / LLM reasoning: points only to his own first- and co-first-author papers */
    { id:'reasoning', kw:['agentic rl','agentic','agentic reinforcement learning','llm reasoning','reasoning llm','reasoning llms','reasoning models','reasoning','math reasoning','llm','llms','large language model','large language models','language model','language models','llm agents','tool-using agents'],
      a:["On agentic RL and LLM reasoning, my own papers are Procedure-Aware RL (COLM 2026, co-first) for tool-using agents, SpeechGym for training voice agents with RL in native speech, CESAR (ICLR 2026) and AudioRSI for reasoning in audio LLMs, and Training-Free On-Policy Distillation (co-first), which merges RL specialists that share a base model into one model with zero gradient steps."],
      rel:['parl','speechgym','cesar'],
      act:[{t:'🔗 Procedure-Aware RL', h:'/projects/procedure-aware-rl/'},{t:'🔗 SpeechGym', h:'/projects/speechgym/'},{t:'🔗 CESAR', h:'/projects/cesar/'}] },

  /* ════════ RETRIEVAL: char-bigram Dice similarity + phrase/keyword scoring ════════ */
  function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9一-鿿\s-]/g,' ').replace(/\s+/g,' ').trim(); }
  function bigrams(s){ var b=[],i; for(i=0;i<s.length-1;i++) b.push(s.substr(i,2)); return b; }
  function diceRaw(a,b){
    if(a===b) return 1;
    if(a.length<2||b.length<2) return 0;
    var A=bigrams(a), B=bigrams(b), map={}, hit=0, i;
    for(i=0;i<A.length;i++) map[A[i]]=(map[A[i]]||0)+1;
    for(i=0;i<B.length;i++) if(map[B[i]]>0){ map[B[i]]--; hit++; }
    return 2*hit/(A.length+B.length);
  }
  /* max of unpadded (inner typos) and space-padded (boundary typos) similarity */
  function dice(a,b){
    var r1=diceRaw(a,b), r2=diceRaw(' '+a+' ',' '+b+' ');
    return r1>r2 ? r1 : r2;
  }
  /* One keyword against the query.
     - exact hits are whole words / whole phrases only ('vla' does not fire inside 'elegantvla',
       'rank' not inside 'reranker', 'code' not inside 'decode');
     - a phrase with a hyphen or space also matches the other spelling ('ac flow' = 'ac-flow');
     - fuzzy (typo-tolerant) hits compare a phrase with a window of as many query words, and are
       off for keywords with digits (so 'neurips 2025' never fires on 'neurips 2026') and for
       keywords under 4 characters.                                                          */
  function kwScore(k, isName, Q){
    var kn=norm(k); if(!kn) return 0;
    var w = isName ? 2.5 : (kn.length>=8 ? 2.2 : (kn.length>=5 ? 1.5 : 1));
    var phrase = kn.indexOf(' ')>=0, bonus = phrase ? 1.25 : 1;
    if(Q.qs.indexOf(' '+kn+' ')>=0) return 2*w*bonus;
    if((phrase || kn.indexOf('-')>=0) && Q.qh.indexOf(' '+kn.replace(/-/g,' ')+' ')>=0) return 2*w*bonus;
    if(/\d/.test(kn) || kn.length<4) return 0;
    var n=kn.split(' ').length, toks=Q.toks, best=0, t, sim;
    for(t=0;t+n<=toks.length;t++){
      sim=dice(toks.slice(t,t+n).join(' '), kn);
      if(sim>best) best=sim;
    }
    return best>=0.72 ? best*w : 0;
  }
  function scoreEntry(entry, Q){
    var s=0, j;
    if(entry.nm) for(j=0;j<entry.nm.length;j++) s += kwScore(entry.nm[j], true, Q);
    for(j=0;j<entry.kw.length;j++) s += kwScore(entry.kw[j], false, Q);
    return s;
  }
  function retrieve(qRaw){
    var q=norm(qRaw); if(!q) return null;
    var Q={ qs:' '+q+' ', qh:' '+q.replace(/-/g,' ')+' ', toks:q.split(' ') };
    var best=null, bestS=0, i, s;
    for(i=0;i<KB.length;i++){
      s=scoreEntry(KB[i],Q);
      if(s>bestS){ bestS=s; best=KB[i]; }
    }
    return bestS>=0.9 ? best : null;
  }

  /* ════════ DIALOGUE STATE ════════ */
  var state = { lastTopic:null, offered:null, lastOpener:-1, lastVariant:{}, visited:{} };
  function pick(arr, lastKey){
    if(arr.length===1) return arr[0];
    var i, tries=0;
    do { i=Math.floor(Math.random()*arr.length); tries++; }
    while(lastKey!==undefined && i===state.lastVariant[lastKey] && tries<5);
    if(lastKey!==undefined) state.lastVariant[lastKey]=i;
    return arr[i];
  }
  function opener(){
    var i, tries=0;
    do { i=Math.floor(Math.random()*OPENERS.length); tries++; } while(i===state.lastOpener && tries<5);
    state.lastOpener=i;
    return OPENERS[i];
  }
  function followupFor(entry){
    if(!entry.rel || !entry.rel.length) return null;
    var candidates = entry.rel.filter(function(id){ return !state.visited[id]; });
    if(!candidates.length) return null;
    var id = candidates[Math.floor(Math.random()*candidates.length)];
    state.offered = id;
    return pick(FOLLOWUP).replace('{T}', NAME[id]||id);
  }
  function entryById(id){ for(var i=0;i<KB.length;i++) if(KB[i].id===id) return KB[i]; return null; }

  function timeHello(){

    if(h<5)  return "Up late! 🌙";
    if(h<12) return "Good morning! ☀️";
    if(h<18) return "Good afternoon! 👋";
    return "Good evening! 🌆";
  }
  function lowRaw(s){ return (s||'').toLowerCase().replace(/[‘’ʼ`]/g,"'").replace(/\s+/g,' ').trim(); }
  /* a social intent counts only when what is left after its phrase asks about nothing in the KB:
     "thanks" -> thanks, but "thanks, what is CESAR?" -> CESAR                                   */
  function intentOnly(re, low){
    var m=re.exec(low); if(!m) return false;
    return !retrieve(low.slice(0,m.index)+' '+low.slice(m.index+m[0].length));
  }
  function respond(qRaw){
    var low=lowRaw(qRaw);
    /* greetings / goodbyes (whole message) */
    if(GREET_RE.test(low))  return { text:timeHello()+" "+pick(GREETS,'greet') };
    if(BYE_RE.test(low))    return { text:pick(BYES,'bye') };
    /* accepting an offered follow-up */
    if(YES_RE.test(low) && state.offered){
      var off=entryById(state.offered); state.offered=null;
      if(off) return answerFrom(off, true);
    }
    /* small talk, unless the message also asks about something */
    if(intentOnly(THANKS_RE, low))   return { text:pick(THANKS_R,'thanks') };
    if(intentOnly(HOWRU_RE, low))    return { text:pick(HOWRU_R,'howru') };
    if(intentOnly(NAME_RE, low))     return { text:pick(NAME_R,'name') };
    if(intentOnly(WHOMADE_RE, low))  return { text:pick(WHOMADE_R,'whomade') };
    if(intentOnly(CANDO_RE, low))    return { text:pick(CANDO_R,'cando'), act:[{t:'🎧 What is CESAR?', h:'/projects/cesar/'},{t:'📄 Publications', h:'/publications/'}] };
    /* retrieve first: a new question that happens to contain "how does", "why", "more" or
       "else" is answered on its own topic; "tell me more" only continues the last topic when
       nothing new is hit, or the hit is that same topic                                     */
    var hit=retrieve(qRaw);
    if(MORE_RE.test(low) && state.lastTopic && (!hit || hit===state.lastTopic)){
      var t=state.lastTopic;
      if(t.more && !t._moreServed){
        t._moreServed=true;
        var fu=followupFor(t);
        return { text:t.more + (fu ? '||'+fu : ''), act:t.act };
      }
      var fu2=followupFor(t);
      if(fu2) return { text:"I've told you the best parts of that one! "+fu2 };
      if(!hit) return { text:"That's the core of it from me — the paper has the full details.", act:t.act };
    }
    if(hit) return answerFrom(hit, false, THANKS_RE.test(low) ? "You're welcome! " : null);
    state.offered=null;
    return { text:pick(FALLBACKS,'fb'), act:[{t:'📄 Browse papers', h:'/publications/'},{t:'✉️ Email Jiajun', h:'mailto:jiajunf3@illinois.edu'}] };
  }
  function answerFrom(entry, accepted, lead){
    state.lastTopic=entry; state.visited[entry.id]=true; state.offered=null;
    var body=pick(entry.a, entry.id);
    var pre = lead ? lead : (accepted ? pick(["Alright — ","Here goes: ",""]) : (entry.plain ? '' : opener()));
    var first=(body.match(/^[A-Za-z']+/)||[''])[0];
    if(pre && /[,—] $/.test(pre) && LOWER_OK[first]) body = body.charAt(0).toLowerCase() + body.slice(1);
    var fu = (Math.random()<0.6) ? followupFor(entry) : null;
    return { text: pre+body + (fu ? '||'+fu : ''), act:entry.act };
  }

  /* ════════ HUMAN-PACED DELIVERY ════════
     - thinking time scales with answer length (+jitter)
     - per-char typing speed varies; pauses at punctuation
     - '||' splits a reply into separate bubbles, with a typing
       indicator between them — like a person sending two messages   */
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(id){ return document.getElementById(id); }
  function addMsg(text, role){
    var msgs=el('ra-msgs'); if(!msgs) return;
    var div=document.createElement('div');
    div.className='ra-msg ra-'+role;
    div.textContent=text;
    msgs.appendChild(div);
    msgs.scrollTop=msgs.scrollHeight;
  }
  function appendActs(acts){
    if(!acts||!acts.length) return;
    var msgs=el('ra-msgs'); if(!msgs) return;
    var wrap=document.createElement('div');
    wrap.className='ra-acts';
    acts.forEach(function(ac){
      var a=document.createElement('a');
      a.className='ra-act'; a.href=ac.h;
      (function(){
        var IM={'🔗':'h-link','📎':'h-paperclip','📄':'sh-pubs','✉️':'h-email','✉':'h-email','🎓':'h-scholar','💻':'h-github','⬇️':'h-cv','⬇':'h-cv','📰':'sh-news','🎧':'h-music','🏠':'h-home','💼':'h-linkedin','📋':'h-list','📬':'sh-contact'};
        var t=ac.t, key=null;
        for(var k in IM){ if(t.indexOf(k)===0){ key=k; break; } }
        if(key){
          var rest=t.slice(key.length).trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          a.innerHTML='<i class="lbl-ico" style="-webkit-mask-image:url(/images/icons/'+IM[key]+'.png);mask-image:url(/images/icons/'+IM[key]+'.png)"></i>'+rest;
        } else { a.textContent=t; }
      })();
      if(/^https?:/.test(ac.h)){ a.target='_blank'; a.rel='noopener noreferrer'; }
      if(ac.h.indexOf('/#')===0 && location.pathname==='/'){
        a.addEventListener('click', function(ev){
          ev.preventDefault(); raClose();
          var sec=document.querySelector(ac.h.substring(1));
          if(sec) sec.scrollIntoView({behavior:'smooth'});
        });
      }
      wrap.appendChild(a);
    });
    msgs.appendChild(wrap);
    msgs.scrollTop=msgs.scrollHeight;
  }
  function showTyping(){
    if(el('ra-typing-indicator')) return;
    var msgs=el('ra-msgs'); if(!msgs) return;
    var div=document.createElement('div');
    div.className='ra-msg ra-bot ra-typing'; div.id='ra-typing-indicator';
    div.innerHTML='<span class="ra-sr">Typing…</span><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>';
    msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
  }
  function removeTyping(){
    var x=el('ra-typing-indicator');
    if(x&&x.parentNode) x.parentNode.removeChild(x);
  }
  function charDelay(ch, prev){
    if(prev==='.'||prev==='!'||prev==='?') return 180+Math.random()*140;  /* breath after sentence */
    if(prev===','||prev===';'||prev==='—') return 70+Math.random()*70;   /* mini-pause */
    return 6+Math.random()*16;                                            /* normal burst */
  }
  /* #ra-msgs is a polite live region. The characters are typed into an aria-hidden span, and the
     finished text replaces it in one step, so a screen reader hears each bubble once, not per key. */
  function typeBubble(text, done){
    var msgs=el('ra-msgs'); if(!msgs){ if(done) done(); return; }
    var div=document.createElement('div');
    div.className='ra-msg ra-bot';
    if(reduced){ div.textContent=text; msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight; if(done) done(); return; }
    var vis=document.createElement('span');
    vis.setAttribute('aria-hidden','true');
    div.appendChild(vis);
    msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
    var i=0;
    (function tick(){
      if(i<=text.length){
        vis.textContent=text.substring(0,i);
        msgs.scrollTop=msgs.scrollHeight;
        i++;
        setTimeout(tick, charDelay(text[i-1]||'', text[i-2]||''));
      } else {
        div.textContent=text;
        if(done) done();
      }
    })();
  }
  function deliver(reply, done){
    var parts=reply.text.split('||').map(function(p){return p.trim();}).filter(Boolean);
    var idx=0;
    function next(){
      if(idx>=parts.length){ appendActs(reply.act); if(done) done(); return; }
      var part=parts[idx++];
      var think = idx===1
        ? Math.min(420+part.length*2.2, 1700)+Math.random()*380   /* reading + thinking */
        : 380+Math.random()*520;                                   /* gap between bubbles */
      showTyping();
      setTimeout(function(){ removeTyping(); typeBubble(part, next); }, reduced?60:think);
    }
    next();
  }
  /* One reply at a time. A question sent while a reply is still typing waits its turn; its
     bubble and respond() both run when it is dequeued, so bubbles stay in question order and
     state.offered always belongs to the follow-up shown last ("yes" accepts what you see). */
  var queue=[], busy=false;
  function enqueue(job){ queue.push(job); if(!busy) pump(); }
  function pump(){
    if(!queue.length){ busy=false; return; }
    busy=true;
    var job=queue.shift(), reply=null;
    try{ reply=job(); }catch(e){ reply=null; }
    if(reply && reply.text) deliver(reply, pump); else pump();
  }

  /* ════════ PUBLIC API (open/close/send) ════════ */
  var welcomed=false;
  window.raAsk=function(btn){
    if(!btn) return;
    var text=btn.textContent.replace(/^[^\w]+/,'').trim();
    var chips=el('ra-chips'); var input=el('ra-input');
    if(chips) chips.classList.add('hidden');
    if(input) input.value=text;
    raSend();
  };
  window.raOpen=function(){
    var panel=el('ra-panel'); var btn=el('ra-btn');
    if(!panel||!btn) return;
    panel.classList.add('show');
    panel.setAttribute('aria-hidden','false');
    btn.style.display='none';
    btn.setAttribute('aria-expanded','true');
    var msgs=el('ra-msgs');
    if(msgs&&!welcomed&&!msgs.children.length){
      welcomed=true;
      enqueue(function(){
        return { text:"Hey, welcome 👋 I'm Jiajun's site agent — I know his main papers well.||Ask me anything, or tap a topic below.",
                 act:[{t:'🏠 Homepage', h:'/'},{t:'📄 Publications', h:'/publications/'},{t:'✉️ Contact', h:'mailto:jiajunf3@illinois.edu'}] };
      });
    }
    setTimeout(function(){ var i=el('ra-input'); if(i) i.focus(); },300);
  };
  window.raClose=function(){
    var panel=el('ra-panel'); if(!panel) return;
    panel.classList.remove('show');
    panel.setAttribute('aria-hidden','true');
    var btn=el('ra-btn');
    if(btn){ btn.style.display='flex'; btn.setAttribute('aria-expanded','false'); btn.focus(); }
  };
  document.addEventListener('keydown', function(e){
    var panel=el('ra-panel');
    if(!panel||!panel.classList.contains('show')) return;
    if(e.key==='Escape'){ raClose(); return; }
    if(e.key==='Tab'){
      var f=panel.querySelectorAll('button,input,a[href],[tabindex]:not([tabindex="-1"])');
      if(!f.length) return;
      var first=f[0], last=f[f.length-1];
      if(e.shiftKey){ if(document.activeElement===first){ e.preventDefault(); last.focus(); } }
      else          { if(document.activeElement===last){ e.preventDefault(); first.focus(); } }
    }
  });
  window.raSend=function(){
    var inp=el('ra-input'); if(!inp) return;
    var q=inp.value.trim(); if(!q) return;
    inp.value='';
    enqueue(function(){ addMsg(q,'user'); return respond(q); });
  };

  /* FAB tooltip (once per session) + pulse quiet after open */
  (function(){
    var btn=el('ra-btn'); var tip=el('ra-tip');
    if(!btn) return;
    function quiet(){
      btn.classList.add('ra-quiet');
      if(tip) tip.classList.remove('show');
      try{ sessionStorage.setItem('raSeen','1'); }catch(e){}
    }
    btn.addEventListener('click', quiet);
    try{ if(sessionStorage.getItem('raSeen')==='1'){ btn.classList.add('ra-quiet'); return; } }catch(e){}
    if(tip){
      setTimeout(function(){
        tip.classList.add('show');
        /* on phones the bubble sits over the text: drop it as soon as the reader scrolls */
        if(window.matchMedia('(max-width: 700px)').matches){
          window.addEventListener('scroll', function(){ tip.classList.remove('show'); }, {passive:true, once:true});
          setTimeout(function(){ tip.classList.remove('show'); }, 3400); /* a short hello on phones, then out of the text */
        }
      },2600);
      setTimeout(function(){ tip.classList.remove('show'); },9000);
    }
  })();
})();
</script>
